[capsule]
name = "sfn/runtime-native"
version = "0.5.10-alpha.4"
description = "Sailfin-native runtime (runtime/sfn + prelude) linked into every Sailfin compiler binary"

[capabilities]
# The runtime modules carry no Sailfin-effect surface that gates the
# link. Effects are a language feature; they don't gate clang/llvm-as
# invocations.
required = []

[build]
kind = "runtime"
sfn-source-root = "sfn"
sfn-module-prefix = "runtime/sfn"

# Stage D PR1 schema (docs/proposals/0006-build-architecture.md §Part 5):
# `kind = "runtime"` capsules ship declarative source lists rather
# than walking `src/**/*.sfn` like a `kind = "library"` capsule. The
# driver compiles each `c-sources` entry with clang, assembles each
# `ll-sources` entry with clang, propagates `include-dirs` to
# downstream C compiles, and appends `link-libs` to the final link.
#
# All paths below are relative to this manifest's directory
# (`runtime/`). With the C runtime retired (#822) and `runtime/native/`
# deleted (#823 tail), this manifest moved up from `runtime/native/` to
# the runtime root, so the entries are now plain `sfn/*` / `prelude.sfn`
# rather than the old `../sfn/*` / `../prelude.sfn`.
# The arrays below are read by the *pinned seed*'s baked-in TOML
# parser during `make compile`, so their form must be one that seed
# understands. `toml_get_string_array`
# (`compiler/src/toml_parser.sfn`) folds continuation lines, so both
# the single-line and multi-line forms parse identically; the
# historical single-line-only constraint is lifted.
c-sources = []
ll-sources = []
# `sfn-sources` lists the Sailfin runtime modules compiled and linked
# into every Sailfin binary. With the C runtime gone these are the sole
# runtime definitions (arena, strings, arrays, io, exceptions, the
# type-meta surface, the platform shims, and the concurrency runtime).
#
# One consumer honors this list:
#   `_compile_runtime_sfn_sources` in
#   `compiler/src/build/runtime_objs.sfn` — the Stage D PR2 link path
#   used by `sfn build` against a project that declares
#   `[dependencies] "sfn/runtime-native"`. The regression test lives at
#   `compiler/tests/e2e/runtime_sfn_sources_link_consumer_test.sfn`.
sfn-sources = [
    "sfn/runtime_globals.sfn",
    "sfn/memory/arena.sfn",
    "sfn/memory/rc.sfn",
    "sfn/memory/mem.sfn",
    "sfn/memory/ownedbuf.sfn",
    "sfn/memory/secretbuf.sfn",
    "sfn/string.sfn",
    "sfn/array.sfn",
    "sfn/clock.sfn",
    "sfn/process.sfn",
    "sfn/io.sfn",
    "sfn/exception.sfn",
    "sfn/assert.sfn",
    "sfn/type_meta.sfn",
    "sfn/platform/exec.sfn",
    "sfn/platform/rlimit.sfn",
    "sfn/platform/terminal.sfn",
    "sfn/platform/tls_status.sfn",
    "sfn/platform/tls.sfn",
    "sfn/platform/tls_record.sfn",
    "sfn/platform/pthread_layout.sfn",
    "sfn/platform/pthread.sfn",
    "sfn/platform/rand.sfn",
    "sfn/platform/fs_exec_mode.sfn",
    "sfn/platform/fd_io.sfn",
    "sfn/platform/socket_ops.sfn",
    "sfn/platform/rename_ops.sfn",
    "sfn/platform/exclusive_create.sfn",
    "sfn/platform/cert_roots.sfn",
    "sfn/platform/file_stat.sfn",
    "sfn/adapters/filesystem.sfn",
    "sfn/adapters/http.sfn",
    "sfn/adapters/websocket.sfn",
    "sfn/adapters/net.sfn",
    "sfn/concurrency/scheduler.sfn",
    "sfn/concurrency/nursery.sfn",
    "sfn/concurrency/future.sfn",
    "sfn/concurrency/channel.sfn",
    "sfn/concurrency/parallel.sfn",
    "sfn/concurrency/serve.sfn",
]
include-dirs = []
# The native TLS 1.3 stack (SFN-341) retired the OpenSSL link
# dependency: TLS is now pure Sailfin (`sfn/platform/tls.sfn` +
# `sfn/platform/tls_record.sfn` over the `sfn/crypto` capsule), so no
# `-lssl`/`-lcrypto` reaches the link and build hosts need no OpenSSL
# development package. The runtime capsule is still the only `kind`
# whose `link-libs` reaches the link (SFEP-0036 3.2).
link-libs = ["-lm", "-lpthread"]

# The prelude (`runtime/prelude.sfn`) is emitted from source on the same
# child-compiler path as `sfn-sources` and linked into every compiler
# build. Declaring it here gives the driver a single source of truth for
# the runtime `.sfn` surface. Once `sfn/prelude` becomes a real
# workspace library (Stage F) this field retires in favour of the
# workspace-implicit resolver path.
prelude-entry = "prelude.sfn"

# The native TLS stack's cold path (key schedule, X25519, X.509, both
# handshake state machines) lives in the `sfn/crypto` library capsule and
# is reached by a real dependency edge rather than vendored, per SFEP-0048
# Phase D. The capability that makes a runtime module able to call a
# capsule landed in SFN-773 and is present in the pinned seed; this
# declaration is deliberately held back from that PR so the per-binary
# ctor floor is paid where the benefit lands (SFN-341).
[dependencies]
"sfn/crypto" = "*"

# SFN-775 / SFEP-0068: target differences belong to the runtime provider,
# not to CI or the build frontend. Replacements preserve the base list's
# order (and therefore compose with demand-driven source gates); additions
# are deterministic manifest-order tails. The compiler retains its current
# hardcoded Windows mapping only as a one-seed fallback for manifests that do
# not declare this table.
[targets.aarch64-unknown-linux-gnu]
sfn-sources-replace = []
sfn-sources-add = []
sfn-sources-drop = []
ll-sources-add = []
link-libs-drop = []
link-libs-add = []

[targets.x86_64-apple-darwin]
sfn-sources-replace = [
    "sfn/platform/rename_ops.sfn=sfn/platform/rename_ops_macos.sfn",
]

[targets.arm64-apple-darwin]
sfn-sources-replace = [
    "sfn/platform/rename_ops.sfn=sfn/platform/rename_ops_macos.sfn",
]

[targets.x86_64-w64-mingw32]
sfn-sources-replace = [
    "sfn/process.sfn=sfn/platform/process_windows.sfn",
    "sfn/platform/rlimit.sfn=sfn/platform/rlimit_windows.sfn",
    "sfn/platform/terminal.sfn=sfn/platform/terminal_windows.sfn",
    "sfn/platform/rand.sfn=sfn/platform/rand_windows.sfn",
    "sfn/platform/fs_exec_mode.sfn=sfn/platform/fs_exec_mode_windows.sfn",
    "sfn/platform/fd_io.sfn=sfn/platform/fd_io_windows.sfn",
    "sfn/platform/socket_ops.sfn=sfn/platform/socket_ops_windows.sfn",
    "sfn/platform/rename_ops.sfn=sfn/platform/rename_ops_windows.sfn",
    "sfn/platform/exclusive_create.sfn=sfn/platform/exclusive_create_windows.sfn",
    "sfn/platform/cert_roots.sfn=sfn/platform/cert_roots_windows.sfn",
    "sfn/platform/file_stat.sfn=sfn/platform/file_stat_windows.sfn",
]
# `sysconf` has no standalone provider: it is defined in
# `pthread_windows.sfn`, which is therefore listed here even though MinGW
# ships winpthreads. A statically linked mingw-w64 does NOT resolve
# `sysconf` from winpthreads — verified by an `undefined reference to
# `sysconf`` at `sfn_scheduler_resolve_thread_count` when this entry was
# omitted — so both Windows ABIs take the Win32 implementation from that
# file. Splitting the shim out into its own module broke the native MSVC
# leg, whose pinned seed cannot read this table (SFN-1039); see
# `pthread_windows.sfn`'s header for the seed-visibility rule.
sfn-sources-add = [
    "sfn/platform/realpath_windows.sfn",
    "sfn/platform/clock_windows.sfn",
    "sfn/platform/pthread_windows.sfn",
    "sfn/platform/popen_windows.sfn",
    "sfn/platform/mkstemp_windows.sfn",
    "sfn/platform/strcasestr_windows.sfn",
    "sfn/platform/opendir_windows.sfn",
    "sfn/platform/mkdtemp_windows.sfn",
]
sfn-sources-drop = []
ll-sources-add = []
link-libs-drop = []
link-libs-add = ["-lbcrypt", "-lcrypt32", "-lws2_32"]

# SFN-1084 / SFEP-0068 §3.3. The native MSVC ABI, declared for the same
# reason mingw is: with no table here, `_condition_runtime_capsules`
# (`compiler/src/build/runtime_objs.sfn`) falls through to the compiler's
# hardcoded `target_condition_runtime_sfn_sources`, which lives *inside the
# seed binary*. A provider added to that list in the working tree is
# invisible to the pinned seed, which is exactly how SFN-1039 left `sysconf`
# undefined at link on this leg. Manifest data the seed reads takes effect
# immediately; the baked-in list needs a seed cut.
#
# The source set is identical to mingw's above — the hardcoded fallback keys
# on `target_os`, not the triple, so both Windows ABIs already receive the
# same modules. That equivalence is asserted, not assumed:
# `compiler/tests/unit/target_conditioning_test.sfn` resolves this manifest
# both ways and compares member-for-member, so the two mechanisms cannot
# drift while both exist.
#
# `link-libs-add` is the one real difference, and it must stay empty:
# `target_extra_link_libs` (`compiler/src/build/target.sfn`) already returns
# `-lbcrypt`/`-lcrypt32`/`-lws2_32` for the msvc ABI. Mingw adds them in its
# table precisely because it does not get them from there — duplicating them
# here would be the mirror-image mistake.
#
# Deleting the hardcoded fallback is SFN-777, and waits on a seed cut
# carrying SFN-775's manifest branch (merged after v0.10.4 was tagged, so
# the pinned seed cannot read either table yet).
[targets.x86_64-pc-windows-msvc]
sfn-sources-replace = [
    "sfn/process.sfn=sfn/platform/process_windows.sfn",
    "sfn/platform/rlimit.sfn=sfn/platform/rlimit_windows.sfn",
    "sfn/platform/terminal.sfn=sfn/platform/terminal_windows.sfn",
    "sfn/platform/rand.sfn=sfn/platform/rand_windows.sfn",
    "sfn/platform/fs_exec_mode.sfn=sfn/platform/fs_exec_mode_windows.sfn",
    "sfn/platform/fd_io.sfn=sfn/platform/fd_io_windows.sfn",
    "sfn/platform/socket_ops.sfn=sfn/platform/socket_ops_windows.sfn",
    "sfn/platform/rename_ops.sfn=sfn/platform/rename_ops_windows.sfn",
    "sfn/platform/exclusive_create.sfn=sfn/platform/exclusive_create_windows.sfn",
    "sfn/platform/cert_roots.sfn=sfn/platform/cert_roots_windows.sfn",
    "sfn/platform/file_stat.sfn=sfn/platform/file_stat_windows.sfn",
]
# Order is load-bearing: the fallback appends these as a fixed tail, and the
# manifest path appends in declaration order, so a reorder here breaks the
# equivalence assertion rather than silently diverging. `pthread_windows.sfn`
# carries `sysconf` as well as the `pthread_*` bodies (SFN-1039).
sfn-sources-add = [
    "sfn/platform/realpath_windows.sfn",
    "sfn/platform/clock_windows.sfn",
    "sfn/platform/pthread_windows.sfn",
    "sfn/platform/popen_windows.sfn",
    "sfn/platform/mkstemp_windows.sfn",
    "sfn/platform/strcasestr_windows.sfn",
    "sfn/platform/opendir_windows.sfn",
    "sfn/platform/mkdtemp_windows.sfn",
]
sfn-sources-drop = []
ll-sources-add = []
link-libs-drop = []
link-libs-add = []

# Demand-driven `sfn-sources` selection (SFN-882). A source listed under an
# effect name is compiled only when the build's declared effect surface demands
# that effect; a source named in NO gate is always compiled. Keys are canonical
# effect names (`analyzer/src/effect_taxonomy.sfn::canonical_effects()`).
#
# Demand is the union of the project manifest's `[capabilities] required` and
# every effect token appearing in an `![ ... ]` list across the unfiltered
# source set, each normalized through `effect_root()` — `![net.http]` and
# `![net.ws]` demand `net`, since only `serve` is rooted at bare `net`.
#
# `net` covers the TLS 1.3 stack, the socket/HTTP/WebSocket adapters and the
# server loop. Every entry point into these modules is `net`-rooted in
# `compiler/capsules/ir/src/intrinsic_effects.sfn`, so a program that can call
# one must declare a `net` effect transitively to `fn main` or fail E0400.
# DO NOT list the `_windows` siblings in this gate table. They are declared in
# the target table above, but selection intentionally runs against the base
# source set before target conditioning.
#
# Unnecessary, because selection runs BEFORE target conditioning: the call
# sites narrow, and `_condition_runtime_capsules` runs later inside
# `assemble_runtime_capsule_link_inputs`. `target_condition_runtime_sfn_sources`
# appends a Windows sibling only when it still sees the POSIX module it swaps
# from, so when `net` is undemanded that module is already gone and the sibling
# is never appended. When `net` IS demanded the module survives, the sibling is
# appended, and it is wanted. Both branches are correct with no entry here; that
# ordering is therefore load-bearing, not incidental.
#
# THIS SECTION MUST STAY LAST IN THE FILE. `toml_get_string_array` scans forward
# from a `[section]` header to the next header, so a section inserted before
# `[build]`'s array block would truncate `sfn-sources` under the pinned seed —
# which parses this file during `make compile` — and break self-hosting
# outright. Pinned by `compiler/tests/unit/runtime_source_gates_test.sfn`.
#
# THE PRELUDE CONSTRAINT. `runtime/prelude.sfn` is compiled and linked into
# every binary unconditionally — it is not an `sfn-sources` member and the
# selector never sees it — so every symbol the prelude references must resolve
# in EVERY link, on every target. That is a stronger constraint than "the
# prelude may not reference a GATED module": a runtime capsule chooses its own
# `sfn-sources`, and every minimal-runtime test fixture in
# `compiler/tests/e2e/` lists far fewer entries than this manifest does. A
# prelude reference into ANY `sfn-sources` member is therefore only as sound as
# the weakest runtime that has to satisfy it.
#
# `sailfin_runtime_serve` is the reference that proved it, and it is now
# defined in `runtime/prelude.sfn` ITSELF rather than in any runtime module
# (SFN-943). It sat in gated `serve.sfn` for as long as SFN-882 existed.
#
# The older rationale — that the reference was safe because `--gc-sections`
# would discard the prelude's unused `serve` wrapper — held only on ELF and
# Mach-O. COFF resolves undefined symbols BEFORE it discards sections, so on
# msvc a dangling reference out of a discarded section is a hard
# `lld-link: error: undefined symbol`. Dead-strippability is a size argument,
# never a link-correctness one; the retained closure must be exact. A new
# prelude binding into a gated module reintroduces the break on Windows while
# staying green on Linux, which is why
# `compiler/tests/unit/runtime_source_gates_test.sfn` checks it statically.
#
# Do not try to "fix" a gate entry by ungating the group. The closure is by
# SYMBOL REFERENCE, not import — `serve.sfn` and `http.sfn` have no imports at
# all, yet both call the bare `tls_*` API (`tls_client_ctx`, `tls_read`,
# `tls_write`) in `tls.sfn`, which imports `sfn/crypto`. Ungating serve/http
# therefore drags in TLS and all 33 crypto modules, erasing the entire win. An
# import-only audit sees a false all-clear here; `runtime_source_gates_test.sfn`
# checks symbols.
# `cert_roots.sfn` is deliberately NOT gated. It reads the PLATFORM TRUST
# STORE, which is a filesystem/OS operation rather than a networking one, and
# its only consumer is `capsules/sfn/crypto` (`src/trust_store.sfn` externs
# `sfn_cert_roots_blob`) — a capsule whose manifest declares
# `required = []`. Gating it on `net` therefore made the gate premise false:
# a build could stage `sfn/crypto` without demanding `net`, drop the defining
# module, and leave the extern unresolved. ELF dead-strips that dangling
# reference; COFF diagnoses it, so on msvc it was a hard
# `lld-link: error: undefined symbol: sfn_cert_roots_blob` (SFN-943). Ungating
# costs nothing: the module has no imports, references no other gated symbol,
# and its Windows form needs only crypt32, which is already on every link
# line. `runtime_capsule_extern_gates_test.sfn` keeps the general rule.
[sfn-source-gates]
net = [
    "sfn/platform/tls.sfn",
    "sfn/platform/tls_record.sfn",
    "sfn/platform/socket_ops.sfn",
    "sfn/adapters/http.sfn",
    "sfn/adapters/websocket.sfn",
    "sfn/adapters/net.sfn",
    "sfn/concurrency/serve.sfn",
]
