[capsule]
name = "sfn/runtime-native"
version = "0.5.10-alpha.4"
description = "Sailfin-native runtime (runtime/sfn + prelude) linked into every Sailfin compiler binary"

[capabilities]
# The runtime modules carry no Sailfin-effect surface that gates the
# link. Effects are a language feature; they don't gate clang/llvm-as
# invocations.
required = []

[build]
kind = "runtime"
sfn-source-root = "sfn"
sfn-module-prefix = "runtime/sfn"

# Stage D PR1 schema (docs/proposals/0006-build-architecture.md §Part 5):
# `kind = "runtime"` capsules ship declarative source lists rather
# than walking `src/**/*.sfn` like a `kind = "library"` capsule. The
# driver compiles each `c-sources` entry with clang, assembles each
# `ll-sources` entry with clang, propagates `include-dirs` to
# downstream C compiles, and appends `link-libs` to the final link.
#
# All paths below are relative to this manifest's directory
# (`runtime/`). With the C runtime retired (#822) and `runtime/native/`
# deleted (#823 tail), this manifest moved up from `runtime/native/` to
# the runtime root, so the entries are now plain `sfn/*` / `prelude.sfn`
# rather than the old `../sfn/*` / `../prelude.sfn`.
# The arrays below are read by the *pinned seed*'s baked-in TOML
# parser during `make compile`, so their form must be one that seed
# understands. `toml_get_string_array`
# (`compiler/src/toml_parser.sfn`) folds continuation lines, so both
# the single-line and multi-line forms parse identically; the
# historical single-line-only constraint is lifted.
c-sources = []
ll-sources = []
# `sfn-sources` lists the Sailfin runtime modules compiled and linked
# into every Sailfin binary. With the C runtime gone these are the sole
# runtime definitions (arena, strings, arrays, io, exceptions, the
# type-meta surface, the platform shims, and the concurrency runtime).
#
# One consumer honors this list:
#   `_compile_runtime_sfn_sources` in
#   `compiler/src/build/runtime_objs.sfn` — the Stage D PR2 link path
#   used by `sfn build` against a project that declares
#   `[dependencies] "sfn/runtime-native"`. The regression test lives at
#   `compiler/tests/e2e/runtime_sfn_sources_link_consumer_test.sfn`.
sfn-sources = [
    "sfn/runtime_globals.sfn",
    "sfn/memory/arena.sfn",
    "sfn/memory/rc.sfn",
    "sfn/memory/mem.sfn",
    "sfn/memory/ownedbuf.sfn",
    "sfn/memory/secretbuf.sfn",
    "sfn/string.sfn",
    "sfn/array.sfn",
    "sfn/clock.sfn",
    "sfn/process.sfn",
    "sfn/io.sfn",
    "sfn/exception.sfn",
    "sfn/assert.sfn",
    "sfn/type_meta.sfn",
    "sfn/platform/exec.sfn",
    "sfn/platform/rlimit.sfn",
    "sfn/platform/terminal.sfn",
    "sfn/platform/tls_status.sfn",
    "sfn/platform/tls.sfn",
    "sfn/platform/tls_record.sfn",
    "sfn/platform/pthread_layout.sfn",
    "sfn/platform/pthread.sfn",
    "sfn/platform/rand.sfn",
    "sfn/platform/fs_exec_mode.sfn",
    "sfn/platform/fd_io.sfn",
    "sfn/platform/socket_ops.sfn",
    "sfn/platform/rename_ops.sfn",
    "sfn/platform/exclusive_create.sfn",
    "sfn/platform/cert_roots.sfn",
    "sfn/adapters/filesystem.sfn",
    "sfn/adapters/http.sfn",
    "sfn/adapters/websocket.sfn",
    "sfn/adapters/net.sfn",
    "sfn/concurrency/scheduler.sfn",
    "sfn/concurrency/nursery.sfn",
    "sfn/concurrency/future.sfn",
    "sfn/concurrency/channel.sfn",
    "sfn/concurrency/parallel.sfn",
    "sfn/concurrency/serve.sfn",
]
include-dirs = []
# The native TLS 1.3 stack (SFN-341) retired the OpenSSL link
# dependency: TLS is now pure Sailfin (`sfn/platform/tls.sfn` +
# `sfn/platform/tls_record.sfn` over the `sfn/crypto` capsule), so no
# `-lssl`/`-lcrypto` reaches the link and build hosts need no OpenSSL
# development package. The runtime capsule is still the only `kind`
# whose `link-libs` reaches the link (SFEP-0036 3.2).
link-libs = ["-lm", "-lpthread"]

# The prelude (`runtime/prelude.sfn`) is emitted from source on the same
# child-compiler path as `sfn-sources` and linked into every compiler
# build. Declaring it here gives the driver a single source of truth for
# the runtime `.sfn` surface. Once `sfn/prelude` becomes a real
# workspace library (Stage F) this field retires in favour of the
# workspace-implicit resolver path.
prelude-entry = "prelude.sfn"

# The native TLS stack's cold path (key schedule, X25519, X.509, both
# handshake state machines) lives in the `sfn/crypto` library capsule and
# is reached by a real dependency edge rather than vendored, per SFEP-0048
# Phase D. The capability that makes a runtime module able to call a
# capsule landed in SFN-773 and is present in the pinned seed; this
# declaration is deliberately held back from that PR so the per-binary
# ctor floor is paid where the benefit lands (SFN-341).
[dependencies]
"sfn/crypto" = "*"

# Demand-driven `sfn-sources` selection (SFN-882). A source listed under an
# effect name is compiled only when the build's declared effect surface demands
# that effect; a source named in NO gate is always compiled. Keys are canonical
# effect names (`analyzer/src/effect_taxonomy.sfn::canonical_effects()`).
#
# Demand is the union of the project manifest's `[capabilities] required` and
# every effect token appearing in an `![ ... ]` list across the unfiltered
# source set, each normalized through `effect_root()` — `![net.http]` and
# `![net.ws]` demand `net`, since only `serve` is rooted at bare `net`.
#
# `net` covers the TLS 1.3 stack, the socket/HTTP/WebSocket adapters and the
# server loop. Every entry point into these modules is `net`-rooted in
# `compiler/capsules/ir/src/intrinsic_effects.sfn`, so a program that can call
# one must declare a `net` effect transitively to `fn main` or fail E0400.
# DO NOT list the `_windows` siblings here. It is tempting — they are gated
# modules' platform twins — but it is both unnecessary and actively harmful.
#
# Unnecessary, because selection runs BEFORE target conditioning: the call
# sites narrow, and `_condition_runtime_capsules` runs later inside
# `assemble_runtime_capsule_link_inputs`. `target_condition_runtime_sfn_sources`
# appends a Windows sibling only when it still sees the POSIX module it swaps
# from, so when `net` is undemanded that module is already gone and the sibling
# is never appended. When `net` IS demanded the module survives, the sibling is
# appended, and it is wanted. Both branches are correct with no entry here; that
# ordering is therefore load-bearing, not incidental.
#
# Harmful, because `compiler/tests/e2e/cross_windows_runtime_modules_test.sfn`
# asserts the Windows spellings appear NOWHERE in this file — its whole-text
# `contains` search is exact only while each token occurs in one place, and it
# cannot be rewritten to parse the arrays instead (that form reproducibly
# miscompiles from an `![io]` test, documented in its own header). Listing a
# sibling here fails that test with no behaviour change to show for it.
#
# THIS SECTION MUST STAY LAST IN THE FILE. `toml_get_string_array` scans forward
# from a `[section]` header to the next header, so a section inserted before
# `[build]`'s array block would truncate `sfn-sources` under the pinned seed —
# which parses this file during `make compile` — and break self-hosting
# outright. Pinned by `compiler/tests/unit/runtime_source_gates_test.sfn`.
#
# THE PRELUDE CONSTRAINT. `runtime/prelude.sfn` is compiled and linked into
# every binary unconditionally — it is not an `sfn-sources` member and the
# selector never sees it — and it binds `runtime_serve_fn = runtime.serve`,
# giving it a reference to `sailfin_runtime_serve` in gated `serve.sfn`. That
# reference is safe ONLY because it is dead-strippable: the prelude's `serve`
# wrapper does not match the `sfn*` retain-root pattern, so `--gc-sections`
# removes it from any binary that never calls `serve`, and a binary that DOES
# call it must declare `![net]`, which opens the gate. A link path that neither
# dead-strips nor narrows would see an undefined `sailfin_runtime_serve`; that
# is why `sfn test` opts out of selection entirely rather than gating (SFN-882).
#
# Do not try to "fix" this by ungating the group. The closure is by SYMBOL
# REFERENCE, not import — `serve.sfn` and `http.sfn` have no imports at all, yet
# both call the bare `tls_*` API (`tls_client_ctx`, `tls_read`, `tls_write`) in
# `tls.sfn`, which imports `sfn/crypto`. Ungating serve/http therefore drags in
# TLS and all 33 crypto modules, erasing the entire win. An import-only audit
# sees a false all-clear here; `runtime_source_gates_test.sfn` checks symbols.
[sfn-source-gates]
net = [
    "sfn/platform/tls.sfn",
    "sfn/platform/tls_record.sfn",
    "sfn/platform/cert_roots.sfn",
    "sfn/platform/socket_ops.sfn",
    "sfn/adapters/http.sfn",
    "sfn/adapters/websocket.sfn",
    "sfn/adapters/net.sfn",
    "sfn/concurrency/serve.sfn",
]
