name: "Sailfin Build + Package"
description: "Builds the native compiler from a seed, prepares test artifacts, runs tests, validates seedcheck, and produces dist/ packages + installer archive."
inputs:
  target:
    description: "Packaging target label (e.g. linux-x86_64, macos-arm64)"
    required: true
  clang:
    description: "Clang executable"
    required: false
    default: "clang"
  seed_repo:
    description: "Repo used by install.sh for seed fetching"
    required: false
    default: "SailfinIO/sailfin"
  seed_version:
    description: "Seed version tag (without v), or 'latest'"
    required: false
    default: "latest"
  seed_exclude_tag:
    description: "Optional tag to exclude"
    required: false
    default: ""
  arm_seed_mode:
    description: >-
      aarch64-Linux seed strategy. 'native' = fetch the pinned linux-arm64
      seed and self-host on device (steady state, SFN-580). 'qemu' = fetch the
      pinned x86_64 seed and run the SFN-472 first-bootstrap under emulation
      (fallback for tags whose pinned release predates ARM assets). Ignored
      unless `target` is linux-arm64. Callers resolve it with
      scripts/select-aarch64-seed-mode.sh.

      No default: an arm64 caller that omits it trips the validator below
      rather than silently taking the ~30-minute emulated path. The single
      place the qemu fallback is chosen is the callers' `Select aarch64 seed
      mode` step, which documents why (SFN-1078,
      docs/conventions/aarch64-qemu-bootstrap.md).
    required: false
    default: ""
  shard:
    description: "Test shard to run (unit-a|unit-b|unit-c|int-caps|e2e-a|e2e-b|e2e-c|e2e-d). Empty = run the full workspace suite (`sfn test` over `sfn dev inventory tests`). See `sfn dev shard names` (compiler/src/cli/commands/dev_shard.sfn)."
    required: false
    default: ""
  test_jobs:
    description: "Parallel test children for the full-suite path, forwarded as `sfn test --jobs N`. Empty = use the CPU+RAM budget from scripts/detect_test_jobs.sh. Only consulted when `shard` is empty: the shard path parallelizes across CI legs instead. Pick N only after measuring the runner's RAM budget — each child carries its own footprint under the 8GB per-process cap."
    required: false
    default: ""
  shard_test_jobs:
    description: "Per-file parallelism WITHIN a shard leg (SAILFIN_TEST_JOBS, read by `sfn dev shard run`). Only consulted when `shard` is set. Empty = use the native host CPU+RAM budget; 1 forces serial execution. Pin a higher value only after measuring the runner's RAM budget."
    required: false
    default: ""
  package:
    description: "Build + upload dist/ packages ('true'/'false'). Set 'false' on non-primary shard legs so packaging runs once per OS."
    required: false
    default: "true"
  mode:
    description: >-
      Pipeline slice to run. 'full' (default) = fetch seed + build + test +
      package (back-compat for release-*.yml / build-quality.yml callers).
      'build-only' = fetch seed + build the compiler, skip tests/packaging —
      used by the shared per-OS build-compiler job in ci.yml. 'skip-build' =
      trust an already-present build/native + build/cache tree (downloaded
      from the build-compiler artifact) and run tests/packaging only; no
      seed fetch, no compiler build. 'build-package' = fetch seed + build +
      package, skip the test suite — the slim release gate (#843): a release
      commit is a mechanical version bump on a main SHA that already passed
      full PR CI + push:main validation, so the release legs verify the
      build/package/smoke surface and delegate suite coverage to main CI
      and the nightly self-host.
    required: false
    default: "full"
runs:
  using: "composite"
  steps:
    # Every seed-acquisition and build step below is gated on this being
    # exactly 'native' or 'qemu'; an off-value would skip all of them and
    # fail much later in the packaging step against an absent binary.
    - name: Reject unknown aarch64 seed mode
      if: ${{ inputs.mode != 'skip-build' && inputs.target == 'linux-arm64' && inputs.arm_seed_mode != 'native' && inputs.arm_seed_mode != 'qemu' }}
      shell: bash {0}
      run: |
        echo "[arm-seed][error] arm_seed_mode must be 'native' or 'qemu', got '${{ inputs.arm_seed_mode }}'" >&2
        exit 1

    # Recreate the Darwin `clang` PATH shim the retired Makefile installed at
    # parse time (Makefile:64-67 before its removal). This is NOT redundant
    # with SFN-1077: that change made the compiler resolve its own driver for
    # the final *link* (`SAILFIN_CC`, compiler/src/backend.sfn:145), but the
    # released seed's own bootstrap and the compiler's Assemble role still
    # invoke a bare `clang` off PATH. Losing the shim with the Makefile would
    # hand those whichever clang leads PATH — on a Homebrew-LLVM macOS runner
    # that clang does not own the Darwin SDK/linker contract and the link
    # fails with `ld: library 'm' not found`. macOS only, exactly as the
    # Makefile scoped it; a no-op when the target does not exist.
    #
    # One deliberate delta: the Makefile's prefix reached only make-spawned
    # processes, whereas $GITHUB_PATH reaches every later step in the job.
    # Only the name `clang` is shadowed, and it resolves to the platform
    # clang the Makefile would also have picked. Callers that prepend
    # Homebrew LLVM do so before this action, and $GITHUB_PATH prepends, so
    # Apple's clang still lands ahead of it — the same precedence
    # `export PATH := $(CLANG_SHIM_DIR):$(PATH)` gave.
    - name: Install Darwin clang shim
      if: ${{ runner.os == 'macOS' }}
      shell: bash {0}
      run: |
        set -euo pipefail
        cc="${SAILFIN_CC:-/usr/bin/clang}"
        shim="$PWD/build/.toolchain-shim"
        mkdir -p "$shim"
        if [ -x "$cc" ]; then
          ln -sf "$cc" "$shim/clang"
          echo "[clang-shim] $shim/clang -> $cc"
        else
          echo "[clang-shim] $cc absent — empty shim dir, harmless PATH prefix"
        fi
        echo "$shim" >> "$GITHUB_PATH"

    # The seed store layout is declared once, in `bootstrap.toml [store]`,
    # and read here rather than restated. The native side already derives it
    # — `compiler/src/bootstrap_manifest.sfn` parses both keys and
    # `_bootstrap_seed_bin` (`compiler/src/cli/commands/dev.sfn`) composes
    # `<install_base>/<version>/sailfin` from them — so a hardcoded copy in
    # this file is a third answer to one question, and it disagrees silently
    # the moment `[store]` moves: `install.sh` writes to the new location,
    # the steps below look in the old one, and the run dies at the fetch gate
    # blaming a missing seed rather than the layout disagreement that caused
    # it (SFN-1163).
    #
    # The awk read mirrors ci.yml's `seed` step, which resolves
    # `[seed].version` out of the same file the same way. Fail-closed on an
    # absent key, as that step is and as SFEP-0047 §5 requires of the pin: a
    # build must never guess where the seed lives. The schema defaults in
    # `bootstrap_manifest.sfn` are deliberately NOT mirrored as fallbacks —
    # a fallback literal would reintroduce exactly the restatement this step
    # exists to remove.
    #
    # Placed before `Restore seed cache` because `actions/cache`'s `path:`
    # and `key:` are evaluated at step level, so these outputs have to exist
    # by then — earlier than the first hardcoded use it replaces. Ungated for
    # the same reason: a skipped step yields empty outputs, and an empty
    # `path:` fails the cache action outright.
    - name: Resolve seed store layout
      id: store
      shell: bash {0}
      run: |
        set -euo pipefail
        if [ ! -f bootstrap.toml ]; then
          echo "[seed-store] bootstrap.toml not found at the repo root" >&2
          exit 1
        fi
        read_store_key() {
          awk -v key="$1" '
            /^\[[^]]+\]/ { section = $0 }
            section == "[store]" && $0 ~ "^" key "[[:space:]]*=" {
              sub("^" key "[[:space:]]*=[[:space:]]*", "")
              gsub(/"/, "")
              sub(/[[:space:]]+$/, "")
              print
              exit
            }
          ' bootstrap.toml
        }
        install_base="$(read_store_key install_base)"
        bin_dir="$(read_store_key bin_dir)"
        if [ -z "$install_base" ]; then
          echo "[seed-store] bootstrap.toml [store].install_base is empty or missing" >&2
          exit 1
        fi
        if [ -z "$bin_dir" ]; then
          echo "[seed-store] bootstrap.toml [store].bin_dir is empty or missing" >&2
          exit 1
        fi
        echo "[seed-store] install_base=$install_base bin_dir=$bin_dir"
        {
          echo "install_base=$install_base"
          echo "bin_dir=$bin_dir"
          echo "seed_bin=$bin_dir/sfn"
        } >> "$GITHUB_OUTPUT"

    # Restore the fetched seed binary keyed on target + pinned version.
    # The key is exact (no restore-keys): a hit guarantees the binary
    # matches `bootstrap.toml [seed].version`, so the fetch step below can
    # safely skip the download. Saved automatically in the job's post phase.
    #
    # Gated to a concrete pin: with `seed_version` unset/`latest` the key
    # (`...-latest`) never changes as the moving `latest` tag advances,
    # so a cache hit + the skip-download guard below would pin the runner
    # to a stale seed forever. All current callers pass a resolved
    # `bootstrap.toml [seed].version` pin; this `if:` keeps a future `latest` caller
    # correct (it just re-downloads every run). The build cache below is
    # not gated — it is self-protecting because `cache_key_for`
    # (compiler/src/build_cache.sfn) embeds the real seed/compiler
    # version in the on-disk digest, so a stale-seed entry simply misses.
    - name: Restore seed cache
      if: ${{ inputs.mode != 'skip-build' && (inputs.target != 'linux-arm64' || inputs.arm_seed_mode == 'native') && inputs.seed_version != '' && inputs.seed_version != 'latest' }}
      uses: actions/cache@v4
      with:
        # The two declared store dirs, not their common parent: `[store]`
        # declares `install_base` and `bin_dir` independently and does not
        # declare a root, and `install.sh` writes nothing else that survives
        # the run (its only other writes are under a `mktemp -d` it traps
        # away, install.sh:472-476). Listing both is therefore exactly the
        # tree the parent path used to cover, and stays correct if the two
        # keys are ever pointed at unrelated locations.
        path: |
          ${{ steps.store.outputs.install_base }}
          ${{ steps.store.outputs.bin_dir }}
        key: sailfin-seed-store-${{ inputs.target }}-${{ inputs.seed_version }}

    - name: Fetch released seed compiler
      if: ${{ inputs.mode != 'skip-build' && (inputs.target != 'linux-arm64' || inputs.arm_seed_mode == 'native') }}
      shell: bash {0}
      env:
        SEED_INSTALL_BASE: ${{ steps.store.outputs.install_base }}
        SEED_BIN_DIR: ${{ steps.store.outputs.bin_dir }}
        SEED_BIN: ${{ steps.store.outputs.seed_bin }}
      run: |
        set -euo pipefail
        seed_version="${{ inputs.seed_version }}"
        seed_exclude_tag="${{ inputs.seed_exclude_tag }}"
        if [ -z "$seed_version" ]; then
          seed_version="latest"
        fi
        # Skip the download on a seed-cache hit. The cache key pins the
        # exact version, so a present + invokable binary is the right one.
        if [ -x "$SEED_BIN" ] && "$SEED_BIN" version >/dev/null 2>&1; then
          echo "[ci] seed cache hit ($seed_version) — skipping fetch"
        else
          # Direct port of the retired `fetch-seed` target, which was a thin
          # wrapper over ./install.sh with these exact five variables. The
          # native `sfn dev bootstrap fetch` is deliberately NOT used here:
          # it takes no repo/version/exclude-tag arguments (it reads
          # bootstrap.toml only), and more fundamentally a cold runner has no
          # `sfn` on it yet — acquiring the seed is what this step is for.
          if [ -z "$seed_version" ]; then
            echo "[fetch-seed][error] SEED_VERSION is empty." >&2
            echo "[fetch-seed][error] The pin lives in bootstrap.toml [seed].version at the repo root." >&2
            exit 1
          fi
          echo "[fetch-seed] installing seed $seed_version into $SEED_INSTALL_BASE"
          # Both declared dirs, replacing a `mkdir -p` of their former common
          # parent. install.sh creates each itself (install.sh:814-816, 924),
          # so this only preserves the pre-existing "the tree is there before
          # the installer runs" property without assuming a shared parent.
          mkdir -p "$SEED_INSTALL_BASE" "$SEED_BIN_DIR"
          REPO="${{ inputs.seed_repo }}" \
          VERSION="$seed_version" \
          EXCLUDE_TAG="$seed_exclude_tag" \
          GLOBAL_BIN_DIR="$SEED_BIN_DIR" \
          INSTALL_BASE="$SEED_INSTALL_BASE" \
          SAILFIN_BOOTSTRAP_SEED_STORE=1 \
          BINARY="sailfin" \
            ./install.sh
          if [ ! -x "$SEED_BIN" ]; then
            echo "[fetch-seed][error] missing fetched seed compiler: $SEED_BIN" >&2
            exit 1
          fi
        fi
        echo "[ci] seed binary: $SEED_BIN"
        "$SEED_BIN" version

    # Fail closed on the native aarch64 fast path (SFN-580). install.sh
    # verifies the signed SHA256SUMS manifest and the archive digest before
    # extraction, and since SFN-1034 aborts rather than continuing when it
    # cannot (install.sh), but nothing downstream
    # checks that the binary it installed is actually an AArch64 build of the
    # pinned version — a mis-selected or stale seed would otherwise surface as a
    # confusing self-host failure much later. The qemu fallback gets the
    # equivalent assertions from scripts/bootstrap-aarch64-linux.sh.
    - name: Verify native aarch64 seed
      if: ${{ inputs.mode != 'skip-build' && inputs.target == 'linux-arm64' && inputs.arm_seed_mode == 'native' }}
      shell: bash {0}
      env:
        SEED_VERSION: ${{ inputs.seed_version }}
        SEED_BIN: ${{ steps.store.outputs.seed_bin }}
      run: |
        set -euo pipefail
        seed="$SEED_BIN"
        if [ -z "${SEED_VERSION}" ] || [ "${SEED_VERSION}" = "latest" ]; then
          echo "[arm-seed][error] the native path requires a concrete seed_version, got '${SEED_VERSION}'" >&2
          exit 1
        fi
        if ! file -L "$seed" | grep -E 'ELF 64-bit.*ARM aarch64' >/dev/null; then
          echo "[arm-seed][error] fetched seed is not an AArch64 executable:" >&2
          file -L "$seed" >&2
          exit 1
        fi
        reported="$("$seed" --version)"
        if [ "$reported" != "sfn ${SEED_VERSION}" ]; then
          echo "[arm-seed][error] seed reports '${reported}', expected 'sfn ${SEED_VERSION}'" >&2
          exit 1
        fi
        echo "[arm-seed] native AArch64 seed ${SEED_VERSION} verified"

    # Module-layout fingerprint: the sorted set of `.sfn` PATHS, without
    # their contents. It segments the build-cache key space below so a
    # restore can never span a module split/add/remove/rename. See
    # `scripts/module_layout_fingerprint.sh` for the full rationale
    # (SFN-661).
    - name: Compute module layout fingerprint
      id: layout
      shell: bash
      run: |
        set -euo pipefail
        # Assign first, THEN echo. `echo "fp=$(cmd)"` returns echo's status,
        # so a failing script (missing sha256sum, missing root) would yield
        # an empty `fp` on a GREEN step — silently disabling the guard, and
        # worse, diverging this key from the save key in build-quality.yml,
        # which strands PR CI on a permanently cold cache.
        fp="$(bash scripts/module_layout_fingerprint.sh)"
        [ -n "$fp" ] || { echo "[ci] module layout fingerprint is empty" >&2; exit 1; }
        freshness="$(bash scripts/module_layout_fingerprint.sh --ci-freshness)"
        [ -n "$freshness" ] || { echo "[ci] workspace freshness fingerprint is empty" >&2; exit 1; }
        echo "fp=$fp" >> "$GITHUB_OUTPUT"
        echo "freshness=$freshness" >> "$GITHUB_OUTPUT"

    # Restore the content-addressed module IR cache (`build/cache/`,
    # written by `<seed> build -p compiler`). Keys are content-safe:
    # `cache_key_for` (compiler/src/build_cache.sfn) hashes source
    # content + sorted (dep slug, dep-manifest hash) pairs + compiler
    # version + flags — no absolute paths or mtimes — so a restored
    # cache is reusable across runners and runs.
    #
    # A restored cache may have been built from a DIFFERENT source tree;
    # safety has to come from the key, because the restore itself is a
    # prefix match. A module whose inputs changed derives a different
    # key, so its stale entry is not addressable and it re-emits.
    #
    # The hole SFN-661 closed: a module's emitted symbols depend on the
    # SLUG of each import's provider (call sites mangle to
    # `<symbol>__<provider_slug>`), and a slug is derived from a path.
    # Splitting `parser/declarations.sfn` into `parser/declarations/mod.sfn`
    # therefore re-mangled the call sites of an UNCHANGED
    # `parser/statements.sfn`. Both modules' layout manifests were empty
    # (neither declares a struct), so the dep component of the key was
    # byte-identical and `statements` hit its pre-split entry — its IR
    # still calling `parse_function__parser__declarations`, which no
    # longer existed. The link failed on undefined references.
    #
    # `cache_key_for` now mixes the dep slug in, which fixes this at the
    # source. But CI's compiler build is driven by the PINNED SEED, so
    # that fix is inert here until a seed carrying it is pinned — which
    # is why the layout fingerprint above is part of the key AND the
    # restore-keys prefix. That segmentation is seed-independent: a
    # layout change lands in a fresh key space with nothing to restore
    # from, so the seed cannot be handed a cache that predates the split.
    #
    # restore-keys therefore falls back to the most recent cache for this
    # target+seed+layout, so a PR still warms from main's cache (primed
    # by build-quality.yml) and from its own earlier pushes — content-only
    # changes, the overwhelmingly common case, are unaffected. The looser
    # target-only fallback is deliberately gone: it spans a seed version
    # change, and entries emitted by a different seed are keyed on a
    # compiler identity this build cannot reproduce, so they were dead
    # weight in the restore rather than useful warmth.
    - name: Restore build cache (content-addressed module IR)
      if: ${{ inputs.mode != 'skip-build' }}
      uses: actions/cache@v4
      with:
        path: build/cache
        key: sailfin-buildcache-${{ inputs.target }}-${{ inputs.seed_version }}-${{ steps.layout.outputs.fp }}-${{ steps.layout.outputs.freshness }}
        restore-keys: |
          sailfin-buildcache-${{ inputs.target }}-${{ inputs.seed_version }}-${{ steps.layout.outputs.fp }}-

    # Restore the per-test linked-binary cache (`build/cache/test-bin`,
    # #1230/#1233) under its OWN key prefix, separate from the module-IR
    # cache above. This is deliberate: a shared `sailfin-buildcache-`
    # prefix would let a test-bin-only entry shadow the module-IR cache on
    # a restore-keys prefix match and force a cold compiler build. The
    # producer is the `test-bin-baseline` job in `build-quality.yml`
    # (push:main + nightly), which runs the full `.sfn` suite with the
    # cache ENABLED and `cache/save`s `build/cache/test-bin` under this
    # exact key. GitHub scopes caches to the branch + default branch, so a
    # PR's first run restores main's baseline. This step runs AFTER the
    # module-IR restore so the populated test-bin subtree overlays the
    # (empty) test-bin the module-IR save carries. Cross-commit hits work
    # only for byte-identical compilers: each entry identity combines the
    # commit-stable capsule version with the compiler binary SHA-256
    # (SFN-545), so a foreign compiler's restored entries cannot match.
    # The hashFiles set includes the runtime capsule manifest
    # (`runtime/capsule.toml`) and `runtime/ir/**` (prewritten runtime IR)
    # on top of the `.sfn` trees, because those inputs change
    # the linked runtime objects baked into a cached test binary.
    # (`runtime/native/**` retired in #823 when that directory was
    # deleted.) `actions/cache/save` is a no-op when a key already exists,
    # so omitting them would pin PRs to a stale baseline after a runtime
    # edit (and the baseline job could never publish a fresh entry). They
    # are also folded into the per-test cache key by content
    # (`runtime_link_inputs_identity`), so this is belt-and-braces.
    - name: Restore test-bin cache (per-test linked binaries)
      if: ${{ inputs.mode != 'build-only' && inputs.mode != 'build-package' }}
      uses: actions/cache@v4
      with:
        path: build/cache/test-bin
        key: sailfin-testbin-${{ inputs.target }}-${{ inputs.seed_version }}-${{ steps.layout.outputs.freshness }}
        restore-keys: |
          sailfin-testbin-${{ inputs.target }}-${{ inputs.seed_version }}-
          sailfin-testbin-${{ inputs.target }}-

    - name: Build native compiler (selfhost from released seed)
      if: ${{ inputs.mode != 'skip-build' && (inputs.target != 'linux-arm64' || inputs.arm_seed_mode == 'native') }}
      shell: bash {0}
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        SEED_BIN: ${{ steps.store.outputs.seed_bin }}
      run: |
        set -euo pipefail
        # #1235 measurement (macOS only — the issue scopes Linux OUT).
        # Time the build phase and flip on the existing SAILFIN_AGENT_REPORT
        # gate (originally the `rebuild-impl` recipe, #1120; now inlined
        # below) so the seed emits its module-IR
        # BuildReport to build/native/.build-report.json — that is where
        # `cache.hit_rate` lives. Purely additive + macOS-scoped: the two
        # `date` calls are no-ops and every write is behind `_measure`, so
        # Linux / release builds stay byte-identical.
        _measure=0
        if [ "${{ inputs.target }}" = "macos-arm64" ]; then
          _measure=1
          export SAILFIN_AGENT_REPORT=1
        fi
        _t0=$(date +%s)
        # `sfn dev bootstrap build` is the native replacement for the retired
        # `rebuild` target, and is a superset of it: it resolves the pinned
        # seed, snapshots the source fingerprint before the build and
        # re-checks it after, smoke-verifies the built artifact, and only
        # then publishes it via `dev bootstrap install`
        # (compiler/src/cli/commands/dev.sfn::_dev_bootstrap_build).
        #
        # `--force` reproduces the old target's semantics exactly: `rebuild`
        # was unconditional, whereas bare `dev bootstrap build` skips when the
        # stored fingerprint still matches. No cached CI path restores
        # build/bin/sfn or the fingerprint file, so the two agree today —
        # `--force` keeps them agreeing if a future cache path changes that.
        #
        # `CLANG=` is deliberately not carried over: the `rebuild` recipe
        # never referenced it (it fed only the legacy .ll compile path), so
        # forwarding it here would be inventing behaviour, not porting it.
        # `inputs.clang` remains live where it always was — the aarch64 qemu
        # leg's SAILFIN_NATIVE_CC below. Clang selection for the build itself
        # is SAILFIN_CC plus the Darwin shim step above.
        seed="$SEED_BIN"
        # Pin the cache root explicitly, as the retired recipe did
        # (Makefile:950). This is load-bearing, not defensive: the pinned seed
        # predates the `sfn/compiler` self-host predicate, so left to itself it
        # resolves $HOME/.cache/sailfin/<schema> rather than the in-tree
        # build/cache the `Restore build cache` step above populates. Verified
        # against seed 0.10.6 with `sfn cache info`: unset => /root/.cache/
        # sailfin/v2, pinned => build/cache/v2. Dropping it would leave every
        # leg green while silently cold-building the whole compiler, and would
        # strand the module-IR cache out of the shard artifact too. A caller
        # override still wins; this is a no-op once a seed carries the
        # predicate.
        export SAILFIN_BUILD_CACHE_DIR="${SAILFIN_BUILD_CACHE_DIR:-build/cache}"
        build_rc=0
        if [ "${SAILFIN_AGENT_REPORT:-}" = "1" ]; then
          # Gate inlined from the retired Makefile recipe: `sfn` itself does
          # not read SAILFIN_AGENT_REPORT — the `--json | tee` composition was
          # always the driver's job, and is now this action's.
          #
          # The tee cannot be the report verbatim the way it was under make.
          # There the seed was invoked directly, so stdout carried only its
          # single-line BuildReport. `dev bootstrap build` wraps that call and
          # prints its own progress on stdout too, so the raw capture is
          # interleaved. Extract the report line and keep the consumer
          # contract that has always held: file exists => valid BuildReport.
          mkdir -p build/native
          bash -c 'set -o pipefail; "$0" dev bootstrap build --force -- --json | tee build/native/.build-report.raw' \
            "$seed" || build_rc=$?
          report_line=""
          if [ -s build/native/.build-report.raw ]; then
            report_line="$(grep -E '^\{' build/native/.build-report.raw | tail -n 1 || true)"
          fi
          if [ "$build_rc" -eq 0 ] && [ -n "$report_line" ]; then
            printf '%s\n' "$report_line" > build/native/.build-report.json
          else
            rm -f build/native/.build-report.json
          fi
          rm -f build/native/.build-report.raw
        else
          bash -c 'set -o pipefail; "$0" dev bootstrap build --force 2>&1 | cat' \
            "$seed" || build_rc=$?
        fi
        if [ "$build_rc" -ne 0 ] || [ ! -x build/bin/sfn ]; then
          echo "[build][error] sfn dev bootstrap build failed (exit=$build_rc) or did not publish build/bin/sfn" >&2
          echo "[build][error] expected the seed's subprocess-stage path to keep the cold build under the 8 GiB memory budget" >&2
          echo "[build][error] if this is a regression, rerun with: $seed dev bootstrap build --force -- --cache-trace" >&2
          echo "[build][error] or fall back to the prior seed via bootstrap.toml [seed].version" >&2
          exit 1
        fi
        _t1=$(date +%s)
        if [ "$_measure" = "1" ]; then
          _build_s=$(( _t1 - _t0 ))
          _hit_rate="n/a"
          if command -v jq >/dev/null 2>&1 && [ -f build/native/.build-report.json ]; then
            _hit_rate="$(jq -r '.cache.hit_rate // "n/a"' build/native/.build-report.json 2>/dev/null || echo n/a)"
          fi
          mkdir -p build
          {
            echo "ci_metrics_phase=build"
            echo "ci_metrics_target=${{ inputs.target }}"
            echo "build_seconds=${_build_s}"
            echo "build_cache_hit_rate=${_hit_rate}"
          } >> build/ci-metrics.env
          echo "[ci-metrics] build phase: ${_build_s}s, module-IR cache.hit_rate=${_hit_rate}"
        fi

    # Fallback path (SFN-580): the pinned release predates the linux-arm64
    # assets (or is being rebuilt from such a tag), so the seed fetch has
    # no native seed to select. Fetch and verify the pinned x86_64 native
    # package explicitly, then run the SFN-472 bootstrap under qemu.
    # scripts/select-aarch64-seed-mode.sh is what picks this path; SFN-580
    # made `native` (above) the steady state.
    - name: Fetch pinned x86_64 seed for aarch64 bootstrap
      if: ${{ inputs.mode != 'skip-build' && inputs.target == 'linux-arm64' && inputs.arm_seed_mode == 'qemu' }}
      id: aarch64_seed
      shell: bash {0}
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        seed_version="${{ inputs.seed_version }}"
        if [ -z "$seed_version" ] || [ "$seed_version" = "latest" ]; then
          echo "[aarch64-seed][error] a concrete seed_version is required" >&2
          exit 1
        fi
        asset="sailfin-native-linux-x86_64-${seed_version}.tar.gz"
        base="https://github.com/${{ inputs.seed_repo }}/releases/download/v${seed_version}"
        mkdir -p build/aarch64-seed
        auth=()
        if [ -n "${GITHUB_TOKEN:-}" ]; then
          auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
        fi
        curl --fail --location --retry 3 "${auth[@]}" \
          "${base}/${asset}" -o "build/aarch64-seed/${asset}"
        curl --fail --location --retry 3 "${auth[@]}" \
          "${base}/${asset}.sha256" -o "build/aarch64-seed/${asset}.sha256"
        expected="$(tr -d '[:space:]' < "build/aarch64-seed/${asset}.sha256")"
        actual="$(sha256sum "build/aarch64-seed/${asset}" | awk '{print $1}')"
        if [ "$actual" != "$expected" ]; then
          echo "[aarch64-seed][error] digest mismatch for ${asset}" >&2
          exit 1
        fi
        tar -xzf "build/aarch64-seed/${asset}" -C build/aarch64-seed
        seed="$(find build/aarch64-seed -path '*/bin/sfn' -type f -print -quit)"
        if [ -z "$seed" ]; then
          echo "[aarch64-seed][error] x86_64 seed binary missing from ${asset}" >&2
          exit 1
        fi
        chmod +x "$seed"
        qemu-x86_64 "$seed" version
        echo "path=$seed" >> "$GITHUB_OUTPUT"

    - name: Bootstrap native aarch64 compiler and fixed point
      if: ${{ inputs.mode != 'skip-build' && inputs.target == 'linux-arm64' && inputs.arm_seed_mode == 'qemu' }}
      shell: bash {0}
      env:
        SEED_X86_64: ${{ steps.aarch64_seed.outputs.path }}
        SAILFIN_NATIVE_CC: ${{ inputs.clang }}
      run: |
        set -euo pipefail
        scripts/bootstrap-aarch64-linux.sh
        rm -rf build/bin build/compiler
        mkdir -p build/bin build/compiler
        install -m 755 build/aarch64-bootstrap/pass-2/sfn build/bin/sfn
        cp -R build/aarch64-bootstrap/pass-2/compiler/import-context \
          build/compiler/import-context
        build/bin/sfn dev bootstrap fingerprint > build/.compiler-source-fingerprint
        build/bin/sfn version

    # skip-build mode: the compiler tree was downloaded from the shared
    # per-OS build-compiler artifact instead of being rebuilt here. Verify
    # the binary survived the artifact round-trip *executable* (GitHub
    # artifacts strip permissions unless the producer tars first — the
    # build-compiler job does) and actually runs before spending test time.
    - name: Verify downloaded compiler tree (skip-build mode)
      if: ${{ inputs.mode == 'skip-build' }}
      shell: bash {0}
      run: |
        set -euo pipefail
        if [ ! -x build/bin/sfn ]; then
          echo "[ci][error] skip-build mode: build/bin/sfn missing or not executable" >&2
          ls -l build/bin build/native 2>/dev/null || true
          exit 1
        fi
        build/bin/sfn version

    - name: Prepare test artifacts
      if: ${{ inputs.mode != 'build-only' && inputs.mode != 'build-package' }}
      shell: bash {0}
      run: |
        set -euo pipefail
        # Inlined from the retired `ci-prepare-test-artifacts` target, which
        # was only ever this guard — no CLI verb is warranted for it.
        if [ ! -d build/compiler/import-context ] ||
           [ -z "$(find build/compiler/import-context -name '*.sfn-asm' -print -quit 2>/dev/null)" ]; then
          echo "[prepare-test-artifacts][error] missing build/compiler/import-context — the compiler build must run first" >&2
          exit 1
        fi
        echo "[prepare-test-artifacts] build/compiler/import-context present"

    - name: Run tests (first-pass binary)
      if: ${{ inputs.mode != 'build-only' && inputs.mode != 'build-package' }}
      shell: bash {0}
      run: |
        set -euo pipefail
        # #1235 / SFN-826 measurement. Time the macOS and aarch64-Linux shard
        # phases and flip on
        # the SAILFIN_AGENT_REPORT gate so the shard run below forwards
        # `--json` and tees build/agent-test.shard-<shard>.jsonl,
        # whose `summary` event carries cache.test_bin_hit_rate (#1230).
        # Additive + target-scoped; Linux x86_64 shard legs keep the
        # byte-identical human run.
        _measure=0
        if [ "${{ inputs.target }}" = "macos-arm64" ] ||
           [ "${{ inputs.target }}" = "linux-arm64" ]; then
          _measure=1
          export SAILFIN_AGENT_REPORT=1
        fi
        _t0=$(date +%s)
        # No step-level ulimit: since seed 0.7.0-alpha.33 every sailfin
        # invocation self-applies an 8 GiB RLIMIT_AS on Linux at its own
        # startup (#1291, .claude/rules/compiler-safety.md) — each
        # per-test compiler process is capped independently, and the
        # subprocesses IT spawns (emit workers, clang, compiled test
        # programs) inherit that cap. Non-compiler processes the suite
        # runs directly are not capped; they were never the OOM vector.
        # A runaway compile thus fails cleanly per-test instead of
        # OOM-killing the hosted runner.
        # Empty shard = full suite (release workflows + back-compat).
        # A shard name runs only that disjoint slice; the union across
        # legs equals the full suite (asserted by the shard-cover lint).
        # Per-file parallelism within a shard leg (benchmarked: ~2x e2e /
        # ~6x unit throughput, peak RSS a fraction of the runner budget).
        # Forwarded via SAILFIN_TEST_JOBS, which `sfn dev shard run` reads.
        # Empty/unset lets the native runner apply its CPU+RAM auto-budget.
        if [ -n "${{ inputs.shard_test_jobs }}" ]; then
          export SAILFIN_TEST_JOBS="${{ inputs.shard_test_jobs }}"
        fi
        # Direct port of the retired `test-shard` / `test` targets. Both
        # already delegated to the native runner; what the recipes contributed was
        # the argv assembly reproduced here — the workspace test inventory,
        # the `--jobs` budget, and the `--json | tee` sidecar composition.
        # `sfn` does not read SAILFIN_AGENT_REPORT itself, so that gate is
        # inlined here exactly as the recipes expressed it. `pipefail` is
        # already set for this step, so the runner's real exit code survives
        # each tee.
        #
        # The retired recipes also carried an "if the binary is missing, run
        # the compiler" fallback. That is unreachable from this action — every
        # mode that reaches this step has either just built the compiler or
        # verified the downloaded one — so it becomes an explicit error rather
        # than a silent re-entry into a build.
        if [ ! -x build/bin/sfn ]; then
          echo "[test][error] missing build/bin/sfn; the compiler build must run first" >&2
          exit 1
        fi
        run_tests() {
          rc=0
          if [ -n "${{ inputs.shard }}" ]; then
            if [ "${SAILFIN_AGENT_REPORT:-}" = "1" ]; then
              mkdir -p build
              build/bin/sfn dev shard run "${{ inputs.shard }}" --json \
                | tee "build/agent-test.shard-${{ inputs.shard }}.jsonl" || rc=$?
            else
              build/bin/sfn dev shard run "${{ inputs.shard }}" || rc=$?
            fi
            return $rc
          fi
          # Full-suite path. The roots come from the workspace inventory, as
          # `test` sourced them; the read loop (rather than mapfile) keeps
          # macOS's bash 3.2 working.
          test_roots=()
          while IFS= read -r path; do
            test_roots+=("$path")
          done < <(build/bin/sfn dev inventory tests)
          if [ "${#test_roots[@]}" -eq 0 ]; then
            echo "[test] empty workspace test inventory" >&2
            return 2
          fi
          # `--jobs` was always passed: TEST_JOBS defaulted to the
          # scripts/detect_test_jobs.sh CPU+RAM budget when no caller set it
          # (see .claude/rules/compiler-safety.md for why that budget binds).
          jobs="${{ inputs.test_jobs }}"
          if [ -z "$jobs" ]; then
            jobs="$(bash scripts/detect_test_jobs.sh 2>/dev/null || echo 1)"
          fi
          if [ "${SAILFIN_AGENT_REPORT:-}" = "1" ]; then
            mkdir -p build
            build/bin/sfn test "${test_roots[@]}" --jobs "$jobs" --json \
              | tee build/agent-test.test.jsonl || rc=$?
          else
            build/bin/sfn test "${test_roots[@]}" --jobs "$jobs" || rc=$?
          fi
          return $rc
        }
        # Retry-once: #892 is a live non-deterministic codegen heap bug
        # that intermittently corrupts an *unrelated* test's compile
        # (garbled link temp name, or a hang -> timeout). A re-run hits a
        # different random victim and almost always passes. A *persistent*
        # failure still fails the retry -> red, so real breakage is not
        # masked. The ::warning:: keeps every flake hit visible/tracked
        # in the run summary so #892's frequency stays measurable.
        if ! run_tests; then
          echo "::warning title=test flake (likely #892)::tests failed on attempt 1; retrying once. If this recurs, it is the non-deterministic codegen corruption tracked in #892."
          echo "[ci] retrying tests once (attempt 2/2) — see #892"
          run_tests
        fi
        if [ "$_measure" = "1" ]; then
          _t1=$(date +%s)
          _test_s=$(( _t1 - _t0 ))
          _tbhr="n/a"
          sidecar="build/agent-test.shard-${{ inputs.shard }}.jsonl"
          if command -v jq >/dev/null 2>&1 && [ -s "$sidecar" ]; then
            _tbhr="$(jq -rs 'map(select(.event == "summary")) | last | .cache.test_bin_hit_rate // "n/a"' "$sidecar" 2>/dev/null || echo n/a)"
          fi
          mkdir -p build
          {
            echo "ci_metrics_phase=test"
            echo "ci_metrics_target=${{ inputs.target }}"
            echo "ci_metrics_shard=${{ inputs.shard }}"
            echo "test_seconds=${_test_s}"
            echo "test_bin_hit_rate=${_tbhr}"
          } >> build/ci-metrics.env
          echo "[ci-metrics] test phase (shard ${{ inputs.shard }}): ${_test_s}s, cache.test_bin_hit_rate=${_tbhr}"
        fi

    - name: Package artifacts
      if: ${{ inputs.package == 'true' && inputs.mode != 'build-only' }}
      shell: bash {0}
      run: |
        set -euo pipefail
        # Direct port of the retired `ci-package` target: it already delegated
        # to `sfn package`, so this drops the wrapper without changing the
        # two invocations, their flags, or the dist/ paths they produce.
        if [ -z "${{ inputs.target }}" ]; then
          echo "[package][error] missing target (e.g. linux-x86_64, macos-arm64)" >&2
          exit 1
        fi
        if [ ! -x build/bin/sfn ]; then
          echo "[package][error] missing native compiler 'build/bin/sfn'; the compiler build must run first" >&2
          exit 1
        fi
        build/bin/sfn package --target "${{ inputs.target }}" --out dist --compiler-bin build/bin/sfn
        build/bin/sfn package --installer --target "${{ inputs.target }}" --out dist --compiler-bin build/bin/sfn
