name: "Sailfin Windows Build"
description: >-
  Stages a bootstrap seed and drives a native MSVC build of the compiler on a
  Windows runner: MSVC dev environment, LLVM probe, the SFN-53 diagnostic
  ladder, `<seed> build -p compiler`, then the boot / check / run / R1 / R3
  ABI gates. Shared by SFN-55 tier A (`build-compiler-windows` in ci.yml) and
  tier B (`windows-native-selfhost.yml`)'s fixed-point job. `make` is not used
  here — host GnuWin32 `make` on Windows runners is too old for this repo's
  targets (SFEP-0021 §4.4).
inputs:
  seed_source:
    description: >-
      'cross' = stage the mingw-cross bootstrap seed from the
      `ci-installer-windows-x86_64` artifact (M9, the only supported value
      today). 'release' is reserved for the pinned native windows-x86_64
      release asset (M11/SFN-57) and is not implemented yet.
    required: false
    default: "cross"

outputs:
  native_sfn:
    description: "Absolute path to the native-built compiler executable."
    value: ${{ steps.locate.outputs.native_sfn }}
  native_sfn_relative:
    description: >-
      Workspace-relative path to the native-built compiler executable,
      suitable for `actions/upload-artifact` (Node/Win32) — the absolute
      Git-Bash path in `native_sfn` (e.g. `/d/a/sailfin/sailfin/...`) resolves
      to a nonexistent `D:\d\a\...` path under Win32 `path.resolve` (B3, SFN-55
      review).
    value: ${{ steps.locate.outputs.native_sfn_relative }}

runs:
  using: "composite"
  steps:
    # Both callers set `SAILFIN_TARGET_OS: Windows` at job scope (SFN-52 target
    # seam), but a composite has multiple callers now — assert it here rather
    # than trusting each one to keep setting it, so a caller that forgets it
    # fails loud instead of quietly running the POSIX build path on a Windows
    # runner.
    - name: Assert SAILFIN_TARGET_OS=Windows
      shell: bash
      run: |
        set -euo pipefail
        if [ "${SAILFIN_TARGET_OS:-}" != "Windows" ]; then
          echo "[sailfin-build-windows] SAILFIN_TARGET_OS must be 'Windows' (got '${SAILFIN_TARGET_OS:-unset}'); set it at job scope" >&2
          exit 1
        fi

    - name: Download mingw-cross bootstrap seed
      if: ${{ inputs.seed_source == 'cross' }}
      uses: actions/download-artifact@v8
      with:
        name: ci-installer-windows-x86_64
        path: seed-dl

    - name: Stage the bootstrap seed
      if: ${{ inputs.seed_source == 'cross' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p seed
        tar -xzf seed-dl/installer-windows-x86_64.tar.gz -C seed
        EXE="$(find "$PWD/seed" -name sailfin.exe | head -1)"
        [ -n "$EXE" ] || { echo "sailfin.exe not found in bootstrap seed" >&2; exit 1; }
        echo "SEED_EXE=$EXE" >> "$GITHUB_ENV"
        echo "staged seed: $EXE"
        "$EXE" --version || true

    - name: Reject unsupported seed_source
      if: ${{ inputs.seed_source != 'cross' }}
      shell: bash
      env:
        SEED_SOURCE: ${{ inputs.seed_source }}
      run: |
        echo "[sailfin-build-windows] seed_source '$SEED_SOURCE' is not implemented; only 'cross' is supported until SFN-57 lands the native release seed." >&2
        exit 1

    - name: Set up MSVC developer environment (UCRT + libs on PATH/LIB/INCLUDE)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Ensure LLVM (clang + lld-link) present
      shell: bash
      run: |
        set -euo pipefail
        # windows-2025 ships LLVM; surface the versions the native link
        # will use so a toolchain mismatch is visible in the log.
        clang --version | head -1
        lld-link --version || true
        echo "clang: $(command -v clang)"

    # ── Staircase (SFN-53) ────────────────────────────────────────
    # Four cheap rungs before the 281-module self-host, each proving one
    # capability and each bounded by its own `timeout`. See
    # `windows-native-selfhost.yml`'s history for why: a single 90-minute
    # self-host step that emits zero bytes on failure distinguishes nothing.
    #   1 boots        — the bootstrap seed runs under UCRT at all
    #   2 frontend     — parse/typecheck/effects, fully in-process
    #   3 one module   — emit -> clang -> lld-link, ONE child spawn
    #   4 the artifact — the binary it produced actually executes
    # No `continue-on-error` here: unlike `timeout-minutes` (confirmed absent
    # from `runs.steps[*]`'s schema — B1, SFN-55 review), it is unconfirmed
    # whether a composite step actually rejects `continue-on-error`; the key
    # is dropped because it would be redundant either way — each rung runs
    # under `set -uo pipefail` (no `-e`) and its last command is always an
    # `echo`/`|| true` that exits 0, so a failed rung already lets later
    # rungs run and report without it.
    - name: "Rung 1 — seed boots (--version)"
      shell: bash
      run: |
        set -uo pipefail
        timeout 60 "$SEED_EXE" --version; echo "rung1 exit=$?"

    - name: "Rung 2 — seed frontend check (hello-world)"
      shell: bash
      run: |
        set -uo pipefail
        timeout 120 "$SEED_EXE" check examples/basics/hello-world.sfn; echo "rung2 exit=$?"

    - name: "Rung 3 — seed builds ONE module (emit -> clang -> lld-link)"
      shell: bash
      run: |
        set -uo pipefail
        # The single most diagnostic step in the workflow: one child spawn,
        # one link. SAILFIN_BUILD_JOBS=1 pins the serial path so a failure
        # here is not confounded by the parallel pool.
        SAILFIN_BUILD_JOBS=1 timeout 600 "$SEED_EXE" build examples/basics/hello-world.sfn -o hello.exe
        echo "rung3 exit=$?"
        ls -la hello.exe || true

    - name: "Rung 4 — run the produced binary"
      shell: bash
      run: |
        set -uo pipefail
        if [ -f hello.exe ]; then timeout 60 ./hello.exe; echo "rung4 exit=$?";
        else echo "rung4 skipped — rung 3 produced no binary"; fi

    - name: Native MSVC build of the compiler (Stage 2)
      shell: bash
      run: |
        set -euo pipefail
        # `runs.steps[*]` in a composite action has no `timeout-minutes` key
        # (B1, SFN-55 review) — bound the build with `timeout` instead,
        # consistent with the rungs above. 1800s = 30 minutes.
        #
        # Call the seed directly rather than `make rebuild` — host `make` on
        # Windows runners is too old (SFEP-0021 §4.4), and `build -p
        # compiler` is exactly what `make rebuild` shells (Makefile
        # rebuild-impl). SAILFIN_TARGET_OS=Windows drives the SFN-52 target
        # seam (MSVC triple, lld-link, POSIX-lib drop, process_windows.sfn
        # swap).
        #
        # The build driver emits no progress output: a full self-host prints
        # under 1 KB, all of it at exit. A working build and a hung one are
        # therefore byte-identical to a watcher, and a timeout kill leaves no
        # diagnostic whatsoever. Count emitted artifacts on an interval so a
        # slow build reads as slow and a stuck one as stuck.
        (
          # `set +e` is load-bearing: the subshell inherits `set -e` from
          # the step, so any single failing command inside the loop would
          # kill the heartbeat silently and restore the exact zero-output
          # condition it exists to prevent.
          set +e
          while :; do
            sleep 30
            printf '[heartbeat] %s sfn-asm=%s ll=%s o=%s\n' \
              "$(date -u +%H:%M:%S)" \
              "$(find build -name '*.sfn-asm' 2>/dev/null | wc -l)" \
              "$(find build -name '*.ll' 2>/dev/null | wc -l)" \
              "$(find build -name '*.o' 2>/dev/null | wc -l)"
          done
        ) &
        heartbeat_pid=$!
        # Kill the subshell, and its in-flight `sleep` where the tooling
        # allows: a survivor inherits this step's stdout and can hold the
        # step open. `pkill` is absent from Git for Windows' bundled msys
        # set, so the child reap is best-effort — killing the subshell
        # alone still bounds any delay at one sleep interval.
        trap 'pkill -P "$heartbeat_pid" 2>/dev/null || true; kill "$heartbeat_pid" 2>/dev/null || true' EXIT
        timeout 1800 "$SEED_EXE" build -p compiler
        echo "--- locating native-built compiler ---"
        OUT=""
        for c in build/capsules/sfn/compiler/bin/compiler.exe build/capsules/sfn/compiler/bin/compiler build/bin/sfn.exe build/bin/sfn; do
          if [ -f "$c" ]; then OUT="$PWD/$c"; break; fi
        done
        [ -n "$OUT" ] || { echo "native-built compiler not found under build/" >&2; ls -R build | head -50; exit 1; }
        echo "NATIVE_SFN=$OUT" >> "$GITHUB_ENV"
        echo "native compiler: $OUT"

    - name: Locate native compiler (composite output)
      id: locate
      shell: bash
      run: |
        set -euo pipefail
        [ -n "${NATIVE_SFN:-}" ] || { echo "NATIVE_SFN not set by the Stage 2 build step" >&2; exit 1; }
        echo "native_sfn=$NATIVE_SFN" >> "$GITHUB_OUTPUT"
        # B3, SFN-55 review: `actions/upload-artifact` runs under Node, not
        # bash, so the absolute Git-Bash path above (`/d/a/...`) is not a
        # path Win32 `path.resolve` can follow. Strip the workspace prefix so
        # callers that upload this as an artifact get a path Node resolves
        # correctly; bash consumers (the fixed-point step) keep using the
        # absolute `native_sfn` output above.
        rel="${NATIVE_SFN#"$PWD"/}"
        echo "native_sfn_relative=$rel" >> "$GITHUB_OUTPUT"

    - name: Gate — boots and prints version
      shell: bash
      run: |
        set -euo pipefail
        out="$("$NATIVE_SFN" --version)"
        echo "version: $out"
        case "$out" in
          "sfn "*) echo "ok: native MSVC compiler boots" ;;
          *) echo "FAIL: unexpected --version output: $out" >&2; exit 1 ;;
        esac

    - name: Gate — frontend check (hello-world)
      shell: bash
      run: |
        set -euo pipefail
        "$NATIVE_SFN" check examples/basics/hello-world.sfn
        echo "ok: check passed"

    - name: Gate — end-to-end run (hello-world)
      shell: bash
      run: |
        set -euo pipefail
        "$NATIVE_SFN" run examples/basics/hello-world.sfn
        echo "ok: hello-world ran"

    - name: Gate R1 — try/throw (setjmp/longjmp under MSVC UCRT)
      shell: bash
      run: |
        set -euo pipefail
        "$NATIVE_SFN" run examples/basics/try-catch-finally.sfn
        echo "ok: R1 try/throw ran"

    - name: Gate R3 — struct-channel round-trip (Microsoft x64 struct ABI)
      shell: bash
      run: |
        set -euo pipefail
        "$NATIVE_SFN" run examples/concurrency/channels.sfn
        echo "ok: R3 struct-channel ran"

    # Gate R4 — the first `sfn test` ever executed on a Windows host.
    #
    # Until this step, no Windows leg ran the test suite at all: four ladder
    # rungs plus five bespoke inline gates, and nothing else. That is why the
    # SFN-927 Winsock fixes could be shipped without being demonstrable on the
    # one platform they exist for — the readback assertion guarding them runs
    # on Linux, where it exercises the POSIX sibling, not the Windows one.
    #
    # `socket_ops_timeout_readback_test.sfn` is the deliberate first choice
    # rather than the whole suite. It is the only socket e2e that is portable
    # as written: it imports nothing from `sfn/test`, spawns no subprocess,
    # and touches no `/tmp` or `/bin/sh` — just malloc/socket externs and the
    # `sfn_socket_*` wrappers, binding loopback in-process. Most of its
    # siblings inline raw POSIX `socket()`/`close()`, which on Windows dies at
    # `WSANOTINITIALISED` and then `__fastfail`.
    #
    # And it asserts the thing that actually broke: that `SO_RCVTIMEO` reads
    # back as 10000ms rather than 10 (the timeval-vs-DWORD defect), and that a
    # timed-out `recv` returns a genuine negative rather than 4294967295 (the
    # 32-bit return-width defect). Passing here is the first evidence either
    # fix works on Windows rather than in a C twin.
    #
    # Fatal, not advisory: an `sfn test` gate that cannot fail would restate
    # the exact problem this step exists to fix.
    #
    # `SAILFIN_RUNTIME_ROOT` is required here and is not a workaround for
    # anything Windows-specific. `resolve_runtime_root`
    # (`runtime/sfn/platform/exec.sfn`) walks up from the EXE directory with
    # exactly three candidates — `/runtime`, `/../runtime`, `/../../runtime`
    # — which is tuned to a binary two levels deep. That is true of
    # `build/bin/sfn` on Linux, where `/../../runtime` lands exactly on the
    # repo's `runtime/`. The native compiler lands at
    # `build/capsules/sfn/compiler/bin/compiler.exe`, five levels deep, so
    # every candidate misses and the resolver returns "" — which surfaces as
    # `expected /capsule.toml` with an empty prefix.
    #
    # Reproduced on Linux by copying `build/bin/sfn` to a five-deep path and
    # running the same command: byte-identical failure. So this is a
    # path-depth assumption, not a platform defect, and the env override
    # exists precisely for a binary sitting outside an install layout.
    - name: Gate R4 — sfn test on a Windows host (socket timeout readback)
      shell: bash
      env:
        SAILFIN_RUNTIME_ROOT: ${{ github.workspace }}/runtime
      run: |
        set -euo pipefail
        "$NATIVE_SFN" test compiler/tests/e2e/socket_ops_timeout_readback_test.sfn
        echo "ok: R4 sfn test ran natively on Windows"
