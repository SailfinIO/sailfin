name: Perf history

# Nightly performance time-series job (SFEP-0037 §3.3). Builds the compiler
# from the pinned seed, runs the compile-perf and runtime benches, and appends
# the CSVs (tagged with the commit SHA) to the orphan `bench-data` branch — a
# growing time series in the spirit of perf.rust-lang.org / the LLVM
# compile-time tracker, not one-shot artifacts. It then compares the current
# run against the rolling median of the last N runs and auto-files one
# `type:perf` issue per finding — a (comparison kind, name) pair — that
# regresses beyond threshold, deduped against an open issue of the same title,
# plus a whole-build wall-time budget check against the SFEP-0006 <5 min target.
#
# It also records the consumer-build series (`sfn bench --consumer`, SFEP-0070):
# fixed fixtures built end to end, watched for the capsule source closure
# re-inflating. That series warns via the same rolling-median path; it never
# imposes a wall-time budget on a hello-world build, because a hard budget on a
# two-second measurement fails on infrastructure noise and a gate that cries
# wolf gets ignored.
#
# The bench harnesses themselves (`sfn bench --compiler`,
# `sfn bench benchmarks/runtime`, `sfn bench --consumer`) and their budgets are
# unchanged — this job only records and compares their output. All data/compare
# logic lives in scripts/perf_history.sh so the workflow stays thin; see
# docs/perf/bench-history.md for how to read the `bench-data` branch.
#
# Single-platform (linux-x86_64) on purpose: compile and especially runtime
# wall/RSS are not cross-platform comparable, so a coherent series lives on one
# runner class. Nightly only — per-PR/per-merge benching is a later tightening.
#
# NOTE: workflow_dispatch is only triggerable once this file is on `main`.

on:
  schedule:
    # Nightly at 06:00 UTC — between build-quality (05:00) and
    # nightly-selfhost (07:00) so the three nightlies don't overlap.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      seed_version:
        description: "Seed version (blank defaults to bootstrap.toml [seed].version from checkout)"
        required: false
        default: ""
      dry_run:
        description: "Run benches + compare but do not push to bench-data or file issues"
        required: false
        default: false
        type: boolean
      synthetic_slowdown_module:
        description: "Inject a synthetic 2x slowdown for this module (compare-only scratch; verifies auto-filing). Blank = off."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: perf-history
  cancel-in-progress: false

env:
  PERF_MIN_RUNS: "7"
  PERF_THRESHOLD_PCT: "10"
  # Threshold for the consumer series' derived counts (`ctors`,
  # `modules_staged`). They are deterministic for a given tree and seed, so they
  # need no noise band — 0 means "any sustained rise above the rolling median".
  # The 10% band above would absorb a 32 -> 35 constructor rise, which is the
  # regression the consumer series exists to catch (SFEP-0070).
  PERF_COUNT_THRESHOLD_PCT: "0"
  BUILD_BUDGET_S: "300"
  # Warn (never fail) once a run uses this share of the budget. Wall time grows
  # with the tree at roughly constant cost per IR line, so headroom shrinks
  # nightly and a breach arrives without a per-run regression to blame it on.
  BUILD_HEADROOM_WARN_PCT: "90"
  DATA_BRANCH: "bench-data"
  # Systemic-flood cap: if more than this many distinct modules regress in a
  # single run — the signature of an environmental shift (seed bump, runner /
  # toolchain change) rather than that many independent code regressions —
  # file one aggregated issue instead of one-per-module (SFN-330).
  PERF_SYSTEMIC_MODULES: "10"

jobs:
  perf-history:
    name: perf-history [linux-x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DRY_RUN: ${{ inputs.dry_run }}
      SYN_MODULE: ${{ inputs.synthetic_slowdown_module }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve seed version (input override → bootstrap.toml)
        id: seed
        shell: bash
        env:
          INPUT_SEED_VERSION: ${{ inputs.seed_version }}
        run: |
          set -euo pipefail
          override="$(printf '%s' "$INPUT_SEED_VERSION" | tr -d '[:space:]')"
          if [ -n "$override" ]; then
            pin="$override"
            echo "[seed-pin] using seed $pin (workflow_dispatch input override)"
          else
            [ -f bootstrap.toml ] || { echo "[seed-pin] bootstrap.toml is missing" >&2; exit 1; }
            pin="$(awk '
              /^\[[^]]+\]/ { section=$0 }
              section == "[seed]" && /^version[[:space:]]*=/ { gsub(/"/, "", $3); print $3; exit }
            ' bootstrap.toml)"
            [ -n "$pin" ] || { echo "[seed-pin] bootstrap.toml [seed].version is empty or missing" >&2; exit 1; }
            echo "[seed-pin] using seed $pin from bootstrap.toml"
          fi
          echo "seed_version=$pin" >> "$GITHUB_OUTPUT"

      # `time` provides /usr/bin/time -v for peak-RSS measurement (distinct
      # from the bash `time` builtin, which the bench scripts cannot read).
      - name: Install clang + GNU time
        uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with:
          packages: clang-18 llvm-18 jq time

      - name: Fetch released seed compiler
        shell: bash
        env:
          SEED_VERSION: ${{ steps.seed.outputs.seed_version }}
        run: |
          set -euo pipefail
          make fetch-seed SEED_VERSION="$SEED_VERSION"
          build/toolchains/seed/bin/sfn version

      - name: Build native compiler (timed clean self-host)
        id: build
        shell: bash
        env:
          CLANG: clang-18
        run: |
          set -euo pipefail
          # `make rebuild` forces a clean self-host so the timing reflects a
          # real parallel clean build (the SFEP-0006 <5 min target), not a
          # cached one. This wall time is the whole-build budget metric — it is
          # NOT the compile bench's serial sum of isolated per-module emits.
          start=$(date +%s)
          make rebuild CLANG="clang-18" SEED_NATIVE="build/toolchains/seed/bin/sfn"
          end=$(date +%s)
          build/bin/sfn version
          echo "wall_s=$((end - start))" >> "$GITHUB_OUTPUT"
          echo "[perf-history] clean build wall time: $((end - start))s (budget ${BUILD_BUDGET_S}s)"

      - name: Prepare output dir
        shell: bash
        run: mkdir -p bench-out

      - name: Compile-perf benchmark (make bench)
        shell: bash
        run: |
          set -euo pipefail
          # The bench harness exits non-zero on its own budget/SLOW/FAIL flags,
          # but it writes the CSV before exiting. This job's gate is the
          # median comparison (later step), not the harness's per-run budgets,
          # so tolerate a non-zero exit and record the CSV regardless.
          make bench BENCH_ARGS="--csv bench-out/compile.csv --top 20" \
            || echo "[perf-history] make bench exited $? (budget/FAIL flag) — recording CSV anyway"

      - name: Runtime-execution benchmark (make bench-runtime)
        shell: bash
        run: |
          set -euo pipefail
          make bench-runtime BENCH_RUNTIME_ARGS="--csv bench-out/runtime.csv --top 20 --iterations 5" \
            || echo "[perf-history] make bench-runtime exited $? (budget/FAIL flag) — recording CSV anyway"

      - name: Consumer-build benchmark (make bench-consumer)
        shell: bash
        run: |
          set -euo pipefail
          # Same tolerance as the two benches above: the harness exits non-zero
          # when a fixture fails to build, but it writes the CSV first, and this
          # job's signal is the median comparison rather than the harness's own
          # per-run flags. A FAIL row is recorded and then excluded from the
          # comparison by perf_history.sh (a build that failed has no timing).
          make bench-consumer BENCH_CONSUMER_ARGS="--csv bench-out/consumer.csv" \
            || echo "[perf-history] make bench-consumer exited $? (FAIL flag) — recording CSV anyway"

      - name: Check out bench-data branch (create orphan if absent)
        shell: bash
        run: |
          set -euo pipefail
          # A fresh init in an isolated dir keeps the main working tree from
          # ever being committed onto the orphan data branch. Auth via the
          # token-embedded remote URL (masked in logs by Actions).
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          rm -rf bench-data
          mkdir -p bench-data
          git -C bench-data init -q
          git -C bench-data config user.name "github-actions[bot]"
          git -C bench-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C bench-data remote add origin "$remote"
          if git -C bench-data ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git -C bench-data fetch -q --depth=200 origin "$DATA_BRANCH"
            git -C bench-data checkout -q -B "$DATA_BRANCH" FETCH_HEAD
            echo "[perf-history] checked out existing $DATA_BRANCH"
          else
            git -C bench-data checkout -q --orphan "$DATA_BRANCH"
            echo "[perf-history] created new orphan $DATA_BRANCH"
          fi

      - name: Append run to bench-data (idempotent per commit)
        shell: bash
        env:
          SHA: ${{ github.sha }}
          BUILD_WALL: ${{ steps.build.outputs.wall_s }}
        run: |
          set -euo pipefail
          run_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          scripts/perf_history.sh append \
            --data-dir bench-data \
            --sha "$SHA" \
            --date "$run_date" \
            --compile bench-out/compile.csv \
            --runtime bench-out/runtime.csv \
            --consumer bench-out/consumer.csv \
            --build-wall "$BUILD_WALL" \
            --budget "$BUILD_BUDGET_S"

      - name: Commit + push bench-data
        if: ${{ github.event_name == 'schedule' || inputs.dry_run != true }}
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git -C bench-data add -A
          # HEAD-independent staged-change check: works on the first-ever run
          # when bench-data is an unborn orphan branch (no HEAD to diff against).
          if [ -z "$(git -C bench-data status --porcelain)" ]; then
            echo "[perf-history] no new data to commit (run $SHA already recorded)"
          else
            git -C bench-data commit -q -m "perf-history: ${SHA} (${run_date})"
            git -C bench-data push -q origin "$DATA_BRANCH"
            echo "[perf-history] pushed run $SHA to $DATA_BRANCH"
          fi

      - name: Compare against rolling median
        id: compare
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          data_dir=bench-data
          # Synthetic-regression validation (workflow_dispatch): inject a 2x
          # slowdown for one module into a *scratch* copy so the pushed series
          # stays honest, then compare against that. Exercises the full
          # file-issue path end-to-end (acceptance: "synthetic regression
          # injected in a scratch run files exactly one issue").
          if [ -n "${SYN_MODULE:-}" ] && [ -f bench-data/compile.csv ]; then
            echo "[perf-history] synthetic slowdown injected for module: $SYN_MODULE"
            rm -rf bench-data-scratch
            cp -r bench-data bench-data-scratch
            awk -F, -v OFS=, -v s="$SHA" -v m="$SYN_MODULE" \
              'NR>1 && $1==s && $3==m { $4=$4*2; $5=$5*2 } { print }' \
              bench-data/compile.csv > bench-data-scratch/compile.csv
            data_dir=bench-data-scratch
          elif [ -n "${SYN_MODULE:-}" ]; then
            # `compare` tolerates a missing compile.csv; under `set -u` the
            # injection above would not, so say so instead of dying on a
            # dispatch against a branch that has no per-module series yet.
            echo "[perf-history] no compile.csv on $DATA_BRANCH — synthetic slowdown skipped"
          fi
          scripts/perf_history.sh compare \
            --data-dir "$data_dir" \
            --sha "$SHA" \
            --min-runs "$PERF_MIN_RUNS" \
            --threshold-pct "$PERF_THRESHOLD_PCT" \
            --count-threshold-pct "$PERF_COUNT_THRESHOLD_PCT" \
            --budget "$BUILD_BUDGET_S" \
            --out regressions.tsv
          # Count distinct (kind, name) pairs, not names alone: the series share
          # one TSV and a name is only unique within its kind, so keying on the
          # name would let one series' finding stand in for another's (SFN-567).
          count=0
          [ -s regressions.tsv ] && count=$(cut -f1,2 regressions.tsv | sort -u | wc -l | tr -d ' ')
          echo "findings=$count" >> "$GITHUB_OUTPUT"
          {
            echo "## Perf history — ${{ github.sha }}"
            echo ""
            echo "Clean build wall: ${{ steps.build.outputs.wall_s }}s (budget ${BUILD_BUDGET_S}s)"
            echo ""
            if [ -s regressions.tsv ]; then
              echo "Regressions (comparison / name / metric / current / comparison value / +%):"
              echo '```'
              cat regressions.tsv
              echo '```'
            else
              echo "_No module or consumer-fixture regressions, and no whole-build budget breach._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: File regression issues (deduped per finding)
        if: ${{ (github.event_name == 'schedule' || inputs.dry_run != true) && steps.compare.outputs.findings != '0' }}
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Self-sufficient: ensure the dedup-anchor label exists even before
          # sync-labels.yml runs (e.g. a pre-merge dispatch trial).
          gh label create perf-regression --repo "$REPO" \
            --color b60205 \
            --description "Auto-filed by perf-history.yml on a module regression; dedup anchor" \
            --force >/dev/null 2>&1 || true

          data_url="${{ github.server_url }}/${REPO}/tree/${DATA_BRANCH}"

          # Systemic-flood cap (SFN-330): count distinct regressing modules,
          # excluding the <whole-build> budget pseudo-row (which always files
          # its own issue). When more than PERF_SYSTEMIC_MODULES regress at
          # once, that is an environmental shift, not that many independent
          # code regressions — file ONE aggregated issue and drop the per-
          # module fan-out. The seed-scoped baseline in perf_history.sh already
          # suppresses the seed-bump case upstream; this is the backstop for
          # any other broad shift (runner class, toolchain, a cross-cutting
          # change).
          modules_file="$(mktemp)"
          awk -F'\t' '$1 == "rolling-median" { print $2 }' regressions.tsv | sort -u > "$modules_file"
          module_count="$(grep -c . "$modules_file" || true)"

          # Findings are keyed as `kind<TAB>name` from here on. A name is only
          # unique within its kind, so keying on the name alone would let one
          # series' finding stand in for another's — the SFN-567 masking failure
          # in a new shape.
          #
          # The non-`rolling-median` kinds seed the list unconditionally: the cap
          # exists to bound the *unbounded* per-module fan-out, while the
          # whole-build budget row (one row) and the consumer series (one per
          # fixture) are both bounded. Suppressing them under a systemic shift
          # would let a broad environmental cause hide a genuine breach, which is
          # the failure this gate is not allowed to repeat.
          remaining_file="$(mktemp)"
          awk -F'\t' -v OFS='\t' '$1 != "rolling-median" { print $1, $2 }' regressions.tsv \
            | sort -u > "$remaining_file"

          if [ "${module_count:-0}" -gt "${PERF_SYSTEMIC_MODULES}" ]; then
            syn_title="perf regression: systemic — ${module_count} modules (${SHA:0:12})"
            {
              echo "# ${syn_title}"
              echo ""
              echo "Auto-filed by \`perf-history.yml\` (SFEP-0037 §3.3). **${module_count}** modules regressed beyond +${PERF_THRESHOLD_PCT}% vs the rolling median in a single nightly run. A broad simultaneous shift is almost always a shared environmental cause (seed bump, runner class, toolchain change) rather than ${module_count} independent code regressions, so this is filed as **one** aggregated issue instead of ${module_count} per-module issues (SFN-330). Investigate the shared cause first; see \`docs/perf/bench-history.md\` for how to read \`${DATA_BRANCH}\` and reproduce locally (\`make bench\`)."
              echo ""
              echo "**Run:** ${RUN_URL}"
              echo "**Commit:** \`${SHA}\`"
              echo "**Baseline:** rolling median of the last ${PERF_MIN_RUNS} same-seed runs on \`${DATA_BRANCH}\` (threshold +${PERF_THRESHOLD_PCT}%)"
              echo "**Data:** ${data_url}"
              echo ""
              echo "## Regressed modules (${module_count})"
              echo ""
              awk -F'\t' '$1 == "rolling-median" { printf "- **%s** / %s: current `%s` vs median `%s` (**+%s%%**)\n", $2, $3, $4, $5, $6 }' regressions.tsv
            } > perf-systemic-body.md
            new_number="$(gh issue create --repo "$REPO" \
              --title "$syn_title" \
              --label "type:perf" \
              --label "perf-regression" \
              --body-file perf-systemic-body.md \
              | awk -F/ '/^https:/{print $NF}')"
            echo "[perf-history] systemic regression: opened aggregated issue #${new_number} for ${module_count} modules"
            # The per-module fan-out is dropped; $remaining_file already holds
            # the bounded kinds seeded above.
          else
            awk -F'\t' -v OFS='\t' '$1 == "rolling-median" { print $1, $2 }' regressions.tsv \
              | sort -u >> "$remaining_file"
          fi

          # Read the finding list on fd 3, not stdin. The body runs `gh`, which
          # reads stdin; on stdin this loop can lose a line to it, and with two
          # fields a partial read misaligns `row_kind` from `name` — a finding
          # reported under another kind's label, which is the SFN-567 shape this
          # rewrite exists to prevent.
          while IFS=$'\t' read -r -u 3 row_kind name; do
            if [ -z "$name" ]; then
              # The loop's contract is that no finding is dropped, so a
              # malformed row is loud rather than skipped.
              echo "::warning::perf-history: skipping malformed finding row (kind='${row_kind}', empty name)"
              continue
            fi
            # `name` already carries its series prefix where one is needed (the
            # script emits `consumer/<fixture>`), so module and `<whole-build>`
            # titles are unchanged and keep deduping against issues already open.
            title="perf regression: ${name}"
            metrics="$(awk -F'\t' -v k="$row_kind" -v m="$name" \
              '$1 != k || $2 != m { next }
               k == "budget" { printf "- **%s**: current `%s s` vs budget `%s s` (**+%s%%**)\n", $3, $4, $5, $6; next }
               { printf "- **%s**: current `%s` vs rolling median `%s` (**+%s%%**)\n", $3, $4, $5, $6 }' \
              regressions.tsv)"

            # Dedup anchor: the `perf-regression` label plus exact title
            # equality (name-keyed). Mirrors build-quality.yml — list by
            # label, filter title in jq to dodge gh --search quoting quirks.
            existing="$(gh issue list --repo "$REPO" --state open \
              --label perf-regression --limit 100 \
              --json number,title \
              --jq "[.[] | select(.title == \"${title}\")] | .[0].number // empty")"

            {
              echo "**Run:** ${RUN_URL}"
              echo "**Commit:** \`${SHA}\`"
              if [ "$row_kind" = "budget" ]; then
                budget_value="$(awk -F'\t' -v m="$name" '$1 == "budget" && $2 == m { print $5; exit }' regressions.tsv)"
                echo "**Budget:** SFEP-0006 whole-build budget \`${budget_value} s\`"
              elif [ "$row_kind" = "consumer-median" ]; then
                echo "**Baseline:** rolling median of the last ${PERF_MIN_RUNS} same-seed consumer runs on \`${DATA_BRANCH}\` (threshold +${PERF_THRESHOLD_PCT}% on \`cold_s\`, +${PERF_COUNT_THRESHOLD_PCT}% on the derived counts)"
              else
                echo "**Baseline:** rolling median of the last ${PERF_MIN_RUNS} same-seed runs on \`${DATA_BRANCH}\` (threshold +${PERF_THRESHOLD_PCT}%)"
              fi
              echo "**Data:** ${data_url}"
              echo ""
              echo "${metrics}"
            } > perf-body.md

            if [ -n "$existing" ]; then
              # Idempotent per commit, the same contract `append` holds for the
              # CSVs: a manual re-run against an already-recorded SHA re-derives
              # the identical finding, and posting the identical comment again
              # is a double-alert for one measurement. Every body carries
              # `**Commit:** <sha>`, so the SHA is the dedup key.
              already="$(gh issue view "$existing" --repo "$REPO" --json comments \
                --jq "[.comments[] | select(.body | contains(\"${SHA}\"))] | length" 2>/dev/null || echo 0)"
              if [ "${already:-0}" -gt 0 ]; then
                echo "[perf-history] issue #${existing} already reports ${SHA:0:12} for ${name} — skipping duplicate comment"
              else
                echo "[perf-history] appending to existing issue #${existing} for ${name}"
                gh issue comment "$existing" --repo "$REPO" --body-file perf-body.md
              fi
            else
              {
                echo "# perf regression: ${name}"
                echo ""
                if [ "$row_kind" = "budget" ]; then
                  echo "Auto-filed by \`perf-history.yml\` (SFEP-0037 §3.3). The whole-build wall time crossed the SFEP-0006 budget. Further budget breaches aggregate here as comments; see \`docs/perf/bench-history.md\` for how to read \`${DATA_BRANCH}\` and reproduce locally (\`make bench\`)."
                elif [ "$row_kind" = "consumer-median" ]; then
                  echo "Auto-filed by \`perf-history.yml\` (SFEP-0070). This consumer-build fixture regressed against the rolling median of the last ${PERF_MIN_RUNS} nightly runs. \`ctors\` and \`modules_staged\` are derived counts that are deterministic for a given tree and seed, so any sustained rise in them means the capsule source closure grew — a cost every consumer of the language pays. This is a **warning series**: it never fails the nightly. Further regressions for this fixture aggregate here as comments; see \`docs/perf/bench-history.md\` for how to read \`${DATA_BRANCH}\` and reproduce locally (\`make bench-consumer\`)."
                else
                  echo "Auto-filed by \`perf-history.yml\` (SFEP-0037 §3.3). \`${name}\` regressed beyond the +${PERF_THRESHOLD_PCT}% threshold vs the rolling median of the last ${PERF_MIN_RUNS} nightly runs. Further regressions for this module aggregate here as comments; see \`docs/perf/bench-history.md\` for how to read \`${DATA_BRANCH}\` and reproduce locally (\`make bench\` / \`make bench-runtime\`)."
                fi
                echo ""
                echo "## Latest measurement"
                echo ""
                cat perf-body.md
              } > perf-new-body.md
              # Priority is a Linear-native field (not a GitHub label);
              # linear-priority-sync.yml backfills the mirror's priority to
              # Medium from the perf-regression marker.
              new_number="$(gh issue create --repo "$REPO" \
                --title "$title" \
                --label "type:perf" \
                --label "perf-regression" \
                --body-file perf-new-body.md \
                | awk -F/ '/^https:/{print $NF}')"
              echo "[perf-history] opened issue #${new_number} for ${name}"
            fi
          done 3< "$remaining_file"

      - name: Upload run CSVs (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-history-linux-x86_64
          path: |
            bench-out/*.csv
            regressions.tsv
          if-no-files-found: warn

      # Last step, and gated exactly like `File regression issues` above, so a
      # breach leaves its issue and its CSVs behind before the job goes red and
      # a `dry_run` trial stays green. Rationale and the incident this closes:
      # docs/rca/2026-07-30-whole-build-wall-time-budget-breach.md.
      - name: Enforce the whole-build wall-time budget
        if: ${{ github.event_name == 'schedule' || inputs.dry_run != true }}
        shell: bash
        env:
          MEASURED_S: ${{ steps.build.outputs.wall_s }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Enforce the number the compare step judged, not this run's stopwatch.
          # `append` is idempotent per commit (scripts/perf_history.sh), so a
          # re-run against an already-recorded SHA re-measures but does not
          # re-record; reading build.csv keeps the gate and the filed issue from
          # ever contradicting each other in the same job summary.
          wall_s="$(awk -F, -v s="$SHA" 'NR > 1 && $1 == s { print $3; exit }' \
            bench-data/build.csv 2>/dev/null || true)"
          if [ -n "$wall_s" ] && [ "$wall_s" != "${MEASURED_S:-}" ]; then
            echo "[perf-history] this run measured ${MEASURED_S}s; enforcing the recorded ${wall_s}s for ${SHA:0:12}"
          fi
          [ -n "$wall_s" ] || wall_s="${MEASURED_S:-}"
          if [ -z "$wall_s" ]; then
            echo "::error::whole-build wall time was not recorded; cannot check the budget"
            exit 1
          fi
          # A non-positive budget disables the check, matching the `BUD > 0`
          # guard in scripts/perf_history.sh.
          if [ "${BUILD_BUDGET_S:-0}" -le 0 ]; then
            echo "[perf-history] budget disabled (BUILD_BUDGET_S=${BUILD_BUDGET_S:-unset}); skipping"
            exit 0
          fi
          warn_at=$(( BUILD_BUDGET_S * BUILD_HEADROOM_WARN_PCT / 100 ))
          pct=$(( wall_s * 100 / BUILD_BUDGET_S ))
          echo "[perf-history] wall ${wall_s}s / budget ${BUILD_BUDGET_S}s (${pct}% of budget; warn at ${warn_at}s)"
          if [ "$wall_s" -gt "$BUILD_BUDGET_S" ]; then
            over=$(( wall_s - BUILD_BUDGET_S ))
            echo "::error::whole-build wall time ${wall_s}s exceeds the SFEP-0006 budget ${BUILD_BUDGET_S}s by ${over}s (${pct}% of budget)"
            echo "**Budget breach:** wall \`${wall_s} s\` vs budget \`${BUILD_BUDGET_S} s\` (+${over} s)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$wall_s" -ge "$warn_at" ]; then
            # Headroom, not throughput, is what a fixed budget runs out of: the
            # tree grows every night at roughly constant cost per IR line, so
            # the last warning before a breach is the useful one.
            echo "::warning::whole-build wall time ${wall_s}s is within ${BUILD_HEADROOM_WARN_PCT}% of the ${BUILD_BUDGET_S}s budget (${pct}% of budget)"
            echo "**Budget headroom low:** wall \`${wall_s} s\` is ${pct}% of the \`${BUILD_BUDGET_S} s\` budget." >> "$GITHUB_STEP_SUMMARY"
          fi
