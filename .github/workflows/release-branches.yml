name: CI (branch push)

# Runs the build + test matrix on pushes to the release-prep branches
# rc and beta.
#
# `main` is deliberately NOT triggered here: it is already gated
# pre-merge by ci.yml (sharded Linux + macOS, on every PR) and validated
# post-merge by build-quality.yml (Linux + the #615/#807 effect-gate
# smoke). Re-running the full Linux+macOS matrix on every main push was
# pure duplication, and its macOS leg drew a scarce macos-arm64 runner
# from the shared account pool — contending with the feature-branch PRs
# in ci.yml that the gate actually depends on (the leg was chronically
# preempted/cancelled before it could finish anyway). rc/beta keep this
# workflow because nothing else validates them and they are pushed
# infrequently, so the runner contention is negligible.
#
# This workflow validates that the branch is healthy.  It does NOT create
# releases — use the manual "Release" workflow (release.yml) for that.
#
# The pinned seed version lives in `bootstrap.toml`'s [seed].version key
# at the repo root. A setup step below reads that file and exports the
# resolved value as a step output (`steps.seed.outputs.seed_version`) so
# the downstream composite action sees the correct pin. Kept in sync with
# ci.yml, release-tag.yml, nightly-selfhost.yml, and the Makefile — all
# four read the same `bootstrap.toml`. Bumping the seed is a one-line
# edit.

on:
    push:
        branches:
            - rc
            - beta
        paths-ignore:
            - compiler/src/version.sfn
            - compiler/capsule.toml
            - 'compiler/capsules/**/capsule.toml'
            # The release bump commit also stamps llms.txt's "> Version:"
            # line (release.yml "Update version files"); keep bump commits
            # from triggering branch CI, same as the other version files.
            - llms.txt
            - 'site/**'
            - 'capsules/**/capsule.toml'

concurrency:
    group: ci-branch-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-from-release-seed:
        name: Build + Test (seed) [${{ matrix.package_label }}]
        # Skip release-bot commits to avoid burning runner time.
        if: >-
            github.event.head_commit.author.name != 'Sailfin Release Bot' &&
            !contains(github.event.head_commit.message, 'chore(release)')
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
        timeout-minutes: ${{ matrix.timeout_minutes }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # macos-26: adopted after the 2026-06-15 `macos-latest`
                    # migration left macos-15 runners scarce (release jobs
                    # stalled waiting for a host). Seed-producing build; the
                    # nightly-selfhost canary validates the triple-pass fixed
                    # point on macos-26 and PR CI moved to it in the same
                    # change (#1409 / #1410). The published binary's minimum
                    # deployment target follows the macOS 26 SDK default.
                    - os: macos-26
                      package_label: macos-arm64
                      clang: clang
                      # 3-vCPU / 7GB hosted runner. 180, not the 120 the
                      # other full-suite legs use: this leg last completed
                      # in 102m against a 120m cap while pinned to 2 test
                      # children, and dropping that pin (SFN-795) hands the
                      # ~7 GiB runner the auto-budget of 1 — halving pool
                      # parallelism on the leg with the least headroom. The
                      # pin is not the thing to restore: detect_test_jobs.sh
                      # records 2 tipping this pool into OOM/SIGABRT (SFN-87)
                      # and Darwin has no RLIMIT_AS backstop, so the timeout
                      # absorbs the wall-clock instead. Re-measure once a cut
                      # runs on macos-26 at 1 job.
                      timeout_minutes: 180
                    - os: ubuntu-24.04
                      package_label: linux-x86_64
                      clang: clang-18
                      # 4-vCPU / 16GB hosted runner.
                      timeout_minutes: 120
                    - os: ubuntu-24.04-arm
                      package_label: linux-arm64
                      clang: clang-18
                      # Bootstrap plus the full branch test suite.
                      timeout_minutes: 360

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Resolve seed version from bootstrap.toml
              id: seed
              shell: bash
              run: |
                  set -euo pipefail
                  if [ ! -f bootstrap.toml ]; then
                      echo "[seed-pin] bootstrap.toml is missing from checkout" >&2
                      exit 1
                  fi
                  pin="$(awk '
                      /^\[[^]]+\]/ { section=$0 }
                      section == "[seed]" && /^version[[:space:]]*=/ { gsub(/"/, "", $3); print $3; exit }
                  ' bootstrap.toml)"
                  if [ -z "$pin" ]; then
                      echo "[seed-pin] bootstrap.toml [seed].version is empty or missing" >&2
                      exit 1
                  fi
                  echo "[seed-pin] using seed $pin"
                  echo "seed_version=$pin" >> "$GITHUB_OUTPUT"

            - name: Select aarch64 seed mode
              id: arm_seed
              if: matrix.package_label == 'linux-arm64'
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
                  SEED_VERSION: ${{ steps.seed.outputs.seed_version }}
              run: |
                  set -euo pipefail
                  probe="scripts/select-aarch64-seed-mode.sh"
                  # A checkout that predates SFN-580 has no probe. release-tag.yml checks out
                  # the tag being (re)built, so this is the normal state when repairing an
                  # older release — and such a tag's pinned seed is one the qemu bootstrap
                  # already handled. Falling back keeps retroactive rebuilds working; the
                  # worst case is a post-arm64-assets tag taking the slower emulated path.
                  if [ ! -f "$probe" ]; then
                      echo "[arm-seed] $probe absent from this checkout — using the qemu fallback"
                      echo "mode=qemu" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  mode="$(bash "$probe")"
                  echo "[arm-seed] seed mode: $mode"
                  echo "mode=$mode" >> "$GITHUB_OUTPUT"

            - name: Install clang (Linux)
              if: runner.os == 'Linux' && matrix.package_label != 'linux-arm64'
              uses: ./.github/actions/apt-install
              timeout-minutes: 20
              with:
                  packages: clang-18 llvm-18 jq

            - name: Set CLANG env (Linux)
              if: runner.os == 'Linux' && matrix.package_label != 'linux-arm64'
              shell: bash
              run: echo "CLANG=clang-18" >> "$GITHUB_ENV"

            - name: Install native build toolchain (aarch64 Linux)
              if: matrix.package_label == 'linux-arm64'
              uses: ./.github/actions/apt-install
              timeout-minutes: 20
              with:
                  packages: binutils clang-18 curl jq lld llvm-18
                  no-install-recommends: 'true'

            - name: Set CLANG env (aarch64 Linux)
              if: matrix.package_label == 'linux-arm64'
              shell: bash
              run: echo "CLANG=clang-18" >> "$GITHUB_ENV"

            # Only the fallback path needs an emulated x86_64 sysroot
            # (SFN-580). The native path self-hosts on device.
            - name: Provision emulated x86_64 seed sysroot (aarch64 Linux)
              if: matrix.package_label == 'linux-arm64' && steps.arm_seed.outputs.mode == 'qemu'
              shell: bash
              run: |
                  set -euo pipefail
                  sudo dpkg --add-architecture amd64
                  # The arm runner's Ubuntu source points at ports.ubuntu.com,
                  # which has no amd64 indices. Keep it arm64-only and add the
                  # canonical amd64 archives for the emulated seed sysroot.
                  sudo sed -i \
                      '/^Architectures:/d; /^Components:/a Architectures: arm64' \
                      /etc/apt/sources.list.d/ubuntu.sources
                  sudo tee /etc/apt/sources.list.d/ubuntu-amd64.sources >/dev/null <<'EOF'
                  Types: deb
                  URIs: http://archive.ubuntu.com/ubuntu
                  Suites: noble noble-updates noble-backports
                  Components: main universe restricted multiverse
                  Architectures: amd64
                  Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

                  Types: deb
                  URIs: http://security.ubuntu.com/ubuntu
                  Suites: noble-security
                  Components: main universe restricted multiverse
                  Architectures: amd64
                  Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
                  EOF

            - name: Install emulated x86_64 seed toolchain (aarch64 Linux)
              if: matrix.package_label == 'linux-arm64' && steps.arm_seed.outputs.mode == 'qemu'
              uses: ./.github/actions/apt-install
              timeout-minutes: 20
              with:
                  packages: binfmt-support qemu-user qemu-user-binfmt libc6-dev:amd64 libgcc-13-dev:amd64
                  no-install-recommends: 'true'

            - name: Install jq + LLVM tools (macOS)
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  brew install jq llvm
                  echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

            # Unlike release-tag.yml this leg runs the full suite (no
            # `mode:`, so the action's default `full` path), which makes
            # `test_jobs` load-bearing here. It is deliberately not pinned:
            # leaving it empty falls through to a bare `make test`, whose
            # `TEST_JOBS ?=` default is scripts/detect_test_jobs.sh — the
            # bash half of the SFN-781 budget — so each host measures itself
            # at runtime (2 on a 4-vCPU/16 GB Linux runner, 1 on the ~7 GiB
            # macos-26 arm64 runner, which has no RLIMIT_AS backstop). The
            # pins removed here — 4 on both ubuntu legs, 2 on macOS — were
            # the same host class and count that SFN-781 measured OOM-killing
            # a runner at 17.26 GiB tree RSS. Re-pin only with measured tree
            # RSS for that runner attached (SFN-795).
            - name: Build + test + package (via Makefile)
              uses: ./.github/actions/sailfin-build
              env:
                  GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
              with:
                  target: ${{ matrix.package_label }}
                  clang: ${{ matrix.clang }}
                  seed_version: ${{ steps.seed.outputs.seed_version }}
                  arm_seed_mode: ${{ steps.arm_seed.outputs.mode || 'qemu' }}

            - name: Report compiler metadata
              shell: bash {0}
              run: |
                  set -euo pipefail
                  ls -lh build/bin/sfn
                  (file build/bin/sfn || true)
                  build/bin/sfn version || build/bin/sfn --version || true
