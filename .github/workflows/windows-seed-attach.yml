# Windows Native Seed Attach — SFEP-0021 M11 / SFN-57.
#
# Attaches a native MSVC Windows seed to an already-published release, off
# the release critical path. Measured release durations are single-digit
# minutes (the 0.10.1 cut: build+package matrix legs 4-10 min, publish
# under a minute, ~12 min end to end); a native MSVC self-host plus the
# self-host fixed point cannot get anywhere near that, and release-tag.yml's
# "Promote" step does a non-force `git push --atomic` that discards the
# entire build if `main` advances mid-release
# (docs/runbooks/release-ordering.md). Folding this leg into release-tag.yml
# would turn a ~12-minute release into a 50-80-minute one and make that
# rejection the common case, not the rare one, given merges landing every
# ~20 minutes. Running it here — entirely after the release is public —
# keeps release latency and the non-force-push risk unchanged and lets this
# leg take however long the native self-host and fixed point need.
#
# Checking out the release tag (not a branch) is itself the provenance
# guarantee release-tag.yml needs an explicit "Verify build checkout" /
# `expect_sha` step for: that step exists there only because `BUILD_REF` can
# be a mutable staging branch a release.yml cut is still in the middle of
# promoting. A published tag is immutable, so there is no equivalent "moved
# out from under us" risk here to guard against — provenance is strengthened
# by construction, not dropped.
#
# The mingw-cross bootstrap seed is built fresh here (mirroring
# windows-native-selfhost.yml's own `cross-seed` job) rather than reused:
# `sailfin-build-windows`'s `seed_source: cross` mode expects the
# `ci-installer-windows-x86_64` artifact to exist within THIS workflow run,
# and no artifact from a different, already-completed workflow run is
# reachable here.
name: Windows Native Seed Attach

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published release tag to attach a native MSVC seed to (e.g. v0.10.1)"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  cross-seed:
    name: Build mingw-cross bootstrap seed [linux]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve seed version from bootstrap.toml
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          pin="$(awk '
            /^\[[^]]+\]/ { section=$0 }
            section == "[seed]" && /^version[[:space:]]*=/ { gsub(/"/, "", $3); print $3; exit }
          ' bootstrap.toml)"
          [ -n "$pin" ] || { echo "[seed] bootstrap.toml [seed].version empty" >&2; exit 1; }
          echo "seed_version=$pin" >> "$GITHUB_OUTPUT"

      - name: Install clang + llvm (Linux)
        uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with:
          packages: clang-18 llvm-18 jq

      - name: Set CLANG env (Linux)
        shell: bash
        run: echo "CLANG=clang-18" >> "$GITHUB_ENV"

      - name: Build native compiler (self-host main)
        uses: ./.github/actions/sailfin-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: build-only
          target: linux-x86_64
          clang: clang-18
          seed_version: ${{ steps.seed.outputs.seed_version }}
          package: 'false'

      - name: Install MinGW-w64 cross-compiler (Linux)
        uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with:
          packages: gcc-mingw-w64-x86-64
          no-install-recommends: 'true'

      - name: Verify MinGW-w64 cross-compiler (Linux)
        shell: bash
        run: x86_64-w64-mingw32-gcc --version | head -1

      - name: Cross-compile the bootstrap seed (Linux)
        shell: bash
        run: |
          set -euo pipefail
          make ci-cross-windows

      - name: Upload mingw-cross bootstrap seed
        uses: actions/upload-artifact@v7
        with:
          name: ci-installer-windows-x86_64
          path: dist/installer-windows-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1

  attach-msvc-seed:
    name: Build, package & attach native MSVC seed [windows-2025]
    needs: cross-seed
    runs-on: windows-2025 # pinned, not `windows-latest` — SFN-55 Risk R3
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      SAILFIN_TARGET_OS: Windows
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build native Windows compiler
        id: build_windows
        uses: ./.github/actions/sailfin-build-windows
        with:
          seed_source: cross

      # M8 (SFN-54), mirrored from windows-native-selfhost.yml's
      # `native-build` job: two isolated `--work-dir` self-hosts, pass-2
      # must be byte-identical to pass-1. Kept here even though it is now
      # off the release critical path — it costs nothing in that position,
      # and it is the entire point of shipping a seed: a compiler nobody has
      # proven can reproduce its own build.
      - name: Gate — self-host fixed point (pass-2 == pass-1)
        id: fixed_point
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          rm -rf build/selfhost/native-w1 build/selfhost/native-w2 \
                 build/selfhost/fp1 build/selfhost/fp2
          mkdir -p build/selfhost/native-w1 build/selfhost/native-w2 \
                   build/selfhost/fp1 build/selfhost/fp2
          SAILFIN_TEST_SCRATCH="build/selfhost/native-w1/scratch" \
            "$NATIVE_SFN" build --no-cache -p compiler \
              --work-dir build/selfhost/native-w1 \
              -o build/selfhost/fp1/sfn-selfhost1.exe
          for probe in sfn sfn.exe sailfin sailfin.exe; do
            if [ -e "build/selfhost/fp1/$probe" ]; then
              echo "[error] build/selfhost/fp1/$probe exists; pass-2 would emit with it, not with pass-1 (SFN-922)" >&2
              exit 1
            fi
          done
          SAILFIN_TEST_SCRATCH="build/selfhost/native-w2/scratch" \
            build/selfhost/fp1/sfn-selfhost1.exe build --no-cache -p compiler \
              --work-dir build/selfhost/native-w2 \
              -o build/selfhost/fp2/sfn-selfhost2.exe
          for f in build/selfhost/fp1/sfn-selfhost1.exe build/selfhost/fp2/sfn-selfhost2.exe; do
            [ -s "$f" ] || { echo "[error] pass artifact missing or empty: $f" >&2; exit 1; }
          done
          if ! cmp -s build/selfhost/fp1/sfn-selfhost1.exe build/selfhost/fp2/sfn-selfhost2.exe; then
            echo "[error] fixed-point mismatch: pass-2 differs from pass-1" >&2
            cmp -l build/selfhost/fp1/sfn-selfhost1.exe build/selfhost/fp2/sfn-selfhost2.exe | head -n 20 || true
            exit 1
          fi
          echo "ok: native MSVC self-host fixed point (pass-2 == pass-1)"

      - name: Package native MSVC installer
        shell: bash
        run: |
          set -euo pipefail
          "$NATIVE_SFN" package --installer --target windows-x86_64-msvc --compiler-bin "$NATIVE_SFN"
          ls -la dist/installer-windows-x86_64-msvc.tar.gz

      # Trivially correct here: the tag is right there in the checkout, not
      # a value threaded in from a separate staging step.
      - name: Verify installer payload version matches tag
        shell: bash
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          rm -rf _installer_check
          mkdir -p _installer_check
          tar -xzf dist/installer-windows-x86_64-msvc.tar.gz -C _installer_check
          bin="$(find _installer_check -name 'sfn.exe' | head -1)"
          if [ -z "$bin" ]; then
            echo "[ci][error] sfn.exe not found in installer payload" >&2
            exit 1
          fi
          actual="$("$bin" --version | sed -n 's/.*sfn //p')"
          if [ "$actual" != "$expected" ]; then
            echo "[ci][error] installer contains compiler '$actual', expected '$expected'" >&2
            exit 1
          fi

      # Unconditional, unlike the presence-guarded shape this check had when
      # it lived inside release-tag.yml: the asset always exists at this
      # point in this workflow, so there is nothing to guard against. A
      # payload that is present but incomplete link-fails every user
      # program on a fresh install — fail the job outright rather than
      # attaching an unchecked asset to a public release.
      - name: Verify installer payload dependency closure
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-payload-dep-closure.sh dist/installer-windows-x86_64-msvc.tar.gz

      - name: Finalize asset name + checksum
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          final="dist/sailfin_${version}_windows_x86_64-msvc.tar.gz"
          mv dist/installer-windows-x86_64-msvc.tar.gz "$final"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$final" > "${final}.sha256"
          else
            shasum -a 256 "$final" > "${final}.sha256"
          fi
          echo "asset=$final" >> "$GITHUB_OUTPUT"

      - name: Attach native MSVC seed to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            "${{ steps.finalize.outputs.asset }}" \
            "${{ steps.finalize.outputs.asset }}.sha256" \
            --repo "${{ github.repository }}" \
            --clobber
