name: Release (tag)

# The pinned seed version normally lives in `bootstrap.toml`
# (`[seed].version`) at the repo root. The build job reads that key from
# the tag's checkout and exports the resolved value as
# `steps.seed.outputs.seed_version`. Since older tags predate
# `bootstrap.toml`, the `seed_version` workflow input takes precedence when
# set — use it to retroactively rebuild any pre-`bootstrap.toml` tag
# (older tags carried a different seed-pin file, no longer read here). In-tree
# tags cut after `bootstrap.toml` landed can dispatch with a blank override.

env:
  # Tag to build/upload (e.g. v0.1.1)
  RELEASE_TAG: ${{ inputs.tag }}
  # What to actually check out and build. Blank on the retroactive-rebuild
  # path, where the tag already exists and is itself the build ref. release.yml
  # passes a pre-tag staging branch instead, so every payload is built and
  # verified before `main` is bumped and before the tag exists at all
  # (SFN-829; docs/runbooks/release-ordering.md).
  BUILD_REF: ${{ inputs.ref || inputs.tag }}

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to (re)build (e.g. v0.1.1-alpha.132)"
        required: true
        type: string
      seed_version:
        description: "Optional seed-version override (blank → read bootstrap.toml [seed].version from the tag checkout)."
        required: false
        type: string
        default: ""
      previous_tag:
        description: "Optional previous release tag used as the generated-notes start point."
        required: false
        type: string
        default: ""
      ref:
        description: "Ref to check out and build (blank → the tag itself). release.yml passes the pre-tag staging branch."
        required: false
        type: string
        default: ""
      expect_sha:
        description: "Commit the checkout must resolve to (blank → unchecked). Pins a staging branch so it cannot move mid-run."
        required: false
        type: string
        default: ""
      promote:
        description: "Fast-forward main onto the built commit and push the tag, after every payload gate passes and before publishing."
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build (e.g. v0.1.1-alpha.132)"
        required: true
      seed_version:
        description: "Optional seed-version override (blank → read bootstrap.toml [seed].version from the tag checkout). Required for tags older than `bootstrap.toml`."
        required: false
        default: ""
      previous_tag:
        description: "Optional previous release tag used as the generated-notes start point."
        required: false
        default: ""
      ref:
        description: "Ref to check out and build (blank → the tag itself)."
        required: false
        default: ""
      expect_sha:
        description: "Commit the checkout must resolve to (blank → unchecked)."
        required: false
        default: ""

# `promote` is deliberately absent from workflow_dispatch: a manual rebuild
# must never be able to mutate `main` or move a tag. `inputs.promote` is empty
# on this path, so the promotion step is skipped (SFN-829).
concurrency:
  group: "release-tag-${{ inputs.tag }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build + Package [${{ matrix.package_label }}]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: ${{ matrix.timeout_minutes }}
    # Every platform produces a supported release payload, so every matrix leg
    # is required. A failed linux-arm64 build must withhold publication rather
    # than producing another release with an incomplete platform set (SFN-799).
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26: adopted after the 2026-06-15 `macos-latest`
          # migration left macos-15 runners scarce (release jobs stalled
          # waiting for a host). These jobs produce the shipped macos-arm64
          # binaries (pinned as seeds); the nightly-selfhost canary has
          # been validating the triple-pass fixed point on macos-26, and PR
          # CI moved to it in the same change (#1409 dirent / #1410
          # child-env-linking fixes). The published binary's minimum
          # deployment target follows the macOS 26 SDK default.
          - os: macos-26
            package_label: macos-arm64
            clang: clang
            # 3-vCPU / 7GB hosted runner.
            timeout_minutes: 120
          - os: ubuntu-24.04
            package_label: linux-x86_64
            clang: clang-18
            # 4-vCPU / 16GB hosted runner.
            timeout_minutes: 120
          - os: ubuntu-24.04-arm
            package_label: linux-arm64
            clang: clang-18
            # The first-native qemu bootstrap builds three compiler passes.
            timeout_minutes: 240

    steps:
      - name: Checkout repository (build ref)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.BUILD_REF }}

      # Two shapes of build ref, each with its own fidelity check. A tag is
      # immutable, so `--exact-match` is the whole assertion. A staging branch
      # is not, so pin it to the exact commit release.yml staged and later
      # promotes — every leg must build the same bits that get tagged. The
      # version assertions further down ("Verify compiler version matches tag")
      # then hold on both paths regardless.
      - name: Verify build checkout
        shell: bash
        env:
          EXPECT_SHA: ${{ inputs.expect_sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          echo "[ci] building ${BUILD_REF} @ ${head}"
          if [ -n "${EXPECT_SHA:-}" ]; then
            if [ "$head" != "${EXPECT_SHA}" ]; then
              echo "[ci][error] expected commit ${EXPECT_SHA}, got ${head}" >&2
              exit 1
            fi
          elif [ "${BUILD_REF}" = "${RELEASE_TAG}" ]; then
            current="$(git describe --tags --exact-match)"
            if [ "$current" != "${RELEASE_TAG}" ]; then
              echo "[ci][error] expected ${RELEASE_TAG}, got $current" >&2
              exit 1
            fi
          fi

      - name: Resolve seed version (input override → bootstrap.toml)
        id: seed
        shell: bash
        env:
          INPUT_SEED_VERSION: ${{ inputs.seed_version }}
        run: |
          set -euo pipefail
          override="$(printf '%s' "$INPUT_SEED_VERSION" | tr -d '[:space:]')"
          if [ -n "$override" ]; then
            echo "[seed-pin] using seed $override (workflow input override)"
            pin="$override"
          else
            if [ ! -f bootstrap.toml ]; then
              echo "[seed-pin][error] tag ${RELEASE_TAG} predates bootstrap.toml." >&2
              echo "[seed-pin][error] re-run this workflow with the 'seed_version' input set." >&2
              exit 1
            fi
            pin="$(awk '
              /^\[[^]]+\]/ { section=$0 }
              section == "[seed]" && /^version[[:space:]]*=/ { gsub(/"/, "", $3); print $3; exit }
            ' bootstrap.toml)"
            if [ -z "$pin" ]; then
              echo "[seed-pin][error] bootstrap.toml has no [seed].version at tag ${RELEASE_TAG}" >&2
              exit 1
            fi
            echo "[seed-pin] using seed $pin from bootstrap.toml at ${RELEASE_TAG}"
          fi
          echo "seed_version=$pin" >> "$GITHUB_OUTPUT"

      - name: Select aarch64 seed mode
        id: arm_seed
        if: matrix.package_label == 'linux-arm64'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          SEED_VERSION: ${{ steps.seed.outputs.seed_version }}
        run: |
          set -euo pipefail
          probe="scripts/select-aarch64-seed-mode.sh"
          # A checkout that predates SFN-580 has no probe. release-tag.yml checks out
          # the tag being (re)built, so this is the normal state when repairing an
          # older release — and such a tag's pinned seed is one the qemu bootstrap
          # already handled. Falling back keeps retroactive rebuilds working; the
          # worst case is a post-arm64-assets tag taking the slower emulated path.
          if [ ! -f "$probe" ]; then
            echo "[arm-seed] $probe absent from this checkout — using the qemu fallback"
            echo "mode=qemu" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mode="$(bash "$probe")"
          echo "[arm-seed] seed mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Install clang (Linux)
        if: runner.os == 'Linux' && matrix.package_label != 'linux-arm64'
        uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with:
          packages: clang-18 llvm-18 jq

      - name: Set CLANG env (Linux)
        if: runner.os == 'Linux' && matrix.package_label != 'linux-arm64'
        shell: bash
        run: echo "CLANG=clang-18" >> "$GITHUB_ENV"

      - name: Install native build toolchain (aarch64 Linux)
        if: matrix.package_label == 'linux-arm64'
        uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with:
          packages: binutils clang-18 curl jq lld llvm-18
          no-install-recommends: 'true'

      - name: Set CLANG env (aarch64 Linux)
        if: matrix.package_label == 'linux-arm64'
        shell: bash
        run: echo "CLANG=clang-18" >> "$GITHUB_ENV"

      # Only the fallback path needs an emulated x86_64 sysroot (SFN-580). The
      # native path self-hosts on device, so it never pays the multiarch +
      # qemu-user install.
      - name: Provision emulated x86_64 seed sysroot (aarch64 Linux)
        if: matrix.package_label == 'linux-arm64' && steps.arm_seed.outputs.mode == 'qemu'
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture amd64
          # The arm runner's Ubuntu source points at ports.ubuntu.com, which
          # has no amd64 indices. Keep it arm64-only and add the canonical
          # amd64 archives for the emulated x86_64 seed sysroot.
          sudo sed -i \
            '/^Architectures:/d; /^Components:/a Architectures: arm64' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/ubuntu-amd64.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

      - name: Install emulated x86_64 seed toolchain (aarch64 Linux)
        if: matrix.package_label == 'linux-arm64' && steps.arm_seed.outputs.mode == 'qemu'
        uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with:
          packages: binfmt-support qemu-user qemu-user-binfmt libc6-dev:amd64 libgcc-13-dev:amd64
          no-install-recommends: 'true'

      - name: Install jq + LLVM tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install jq llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      # Slim release gate (#843, extended to stable tags): every release
      # tag — prerelease AND stable — is a mechanical version bump on a
      # main SHA that already passed full PR CI + push:main validation,
      # and a stable cut additionally clears the release-train's
      # green-nightly self-host gate (release-train.yml). So all release
      # legs build + package + smoke and delegate full-suite coverage to
      # main CI and the nightly self-host, rather than re-running the whole
      # suite here. The former stable-only `full` path re-ran the suite as
      # a belt-and-braces GA gate, but the macOS-arm64 full-suite leg grew
      # past the 120-minute job timeout and cancelled the cut; the coverage
      # it added is already provided by the gates above. `mode:
      # build-package` therefore gates out the test steps entirely (see the
      # mode conditions in actions/sailfin-build), so no `test_jobs` is
      # passed: a value here would be dead config that reads as a
      # deliberate override of the SFN-781 auto-budget (SFN-795).
      - name: Build + package (via Makefile)
        uses: ./.github/actions/sailfin-build
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        with:
          target: ${{ matrix.package_label }}
          clang: ${{ matrix.clang }}
          seed_version: ${{ steps.seed.outputs.seed_version }}
          mode: build-package
          arm_seed_mode: ${{ steps.arm_seed.outputs.mode || 'qemu' }}

      # Smoke-test the built compiler end-to-end (compile + link + run a
      # real program). Together with the two version verifications below
      # this is the release-leg acceptance surface on the slim path.
      - name: Smoke-test built compiler (hello-world)
        shell: bash {0}
        run: |
          set -euo pipefail
          # The compiler self-applies its 8 GiB memory budget on Linux
          # (#1291) — no step-level ulimit needed.
          out="$(build/bin/sfn run examples/basics/hello-world.sfn)"
          echo "$out"
          if ! printf '%s' "$out" | grep -q "Hello, Sailfin!"; then
            echo "[ci][error] hello-world smoke failed: expected 'Hello, Sailfin!' in output" >&2
            exit 1
          fi

      - name: Verify compiler version matches tag
        shell: bash {0}
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          file_version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' compiler/capsule.toml)"
          if [ "$file_version" != "$expected" ]; then
            echo "[ci][error] compiler/capsule.toml has '$file_version', expected '$expected'" >&2
            exit 1
          fi
          while IFS= read -r manifest; do
            manifest_version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' "$manifest")"
            if [ "$manifest_version" != "$expected" ]; then
              echo "[ci][error] $manifest has '$manifest_version', expected '$expected'" >&2
              exit 1
            fi
          done < <(find compiler/capsules -mindepth 2 -maxdepth 2 -name capsule.toml -print | sort)
          actual="$(build/bin/sfn version | sed -n 's/.*sfn //p')"
          if [ "$actual" != "$expected" ]; then
            echo "[ci][error] built compiler reports '$actual', expected '$expected'" >&2
            exit 1
          fi

      - name: Verify installer payload version
        shell: bash {0}
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          rm -rf _installer_check
          mkdir -p _installer_check
          tar -xzf "dist/installer-${{ matrix.package_label }}.tar.gz" -C _installer_check
          chmod +x _installer_check/bin/sfn || true
          actual="$(_installer_check/bin/sfn version | sed -n 's/.*sfn //p')"
          if [ "$actual" != "$expected" ]; then
            echo "[ci][error] installer contains compiler '$actual', expected '$expected'" >&2
            exit 1
          fi

      # `sfn package --installer` stages the runtime capsule's dependency
      # closure (declared in runtime/capsule.toml [dependencies]) into the
      # tarball at <prefix>/capsules/<scope>/<name>/src -- the layout
      # locate_runtime_dep_capsule_src resolves at install time. A payload
      # missing part of that closure link-fails *every* user program on a
      # fresh install, so this asserts payload completeness before release
      # assets are published.
      - name: Verify installer payload dependency closure
        shell: bash {0}
        run: |
          set -euo pipefail
          bash scripts/verify-payload-dep-closure.sh "dist/installer-${{ matrix.package_label }}.tar.gz"

      # --- Cross-compile Windows binary from Linux LLVM IR ---
      - name: Install MinGW-w64 cross-compiler (Linux)
        if: matrix.package_label == 'linux-x86_64'
        uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with:
          # Only the x86-64 C cross toolchain is used by `make
          # ci-cross-windows`; the `mingw-w64` metapackage pulls ~277 MB of
          # i686 / g++ / win32 packages this build never touches and which
          # stalled the Ubuntu/Azure mirror fetch (#1402).
          #
          # The bounded retry AND the `.deb` cache that used to be hand-rolled
          # here now live in the composite (SFN-982), so this is no longer a
          # second implementation of them to keep in sync.
          packages: gcc-mingw-w64-x86-64
          no-install-recommends: 'true'

      - name: Verify MinGW-w64 cross-compiler (Linux)
        if: matrix.package_label == 'linux-x86_64'
        shell: bash
        run: x86_64-w64-mingw32-gcc --version | head -1

      - name: Cross-compile for Windows (Linux)
        if: matrix.package_label == 'linux-x86_64'
        shell: bash {0}
        run: |
          set -euo pipefail
          make ci-cross-windows

      # Windows is cross-built inside this linux-x86_64 leg rather than
      # having its own matrix entry, so the per-leg dependency closure check
      # above never inspects its tarball -- verify it here instead.
      - name: Verify Windows installer payload dependency closure
        if: matrix.package_label == 'linux-x86_64'
        shell: bash {0}
        run: |
          set -euo pipefail
          bash scripts/verify-payload-dep-closure.sh "dist/installer-windows-x86_64.tar.gz"

      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-native-${{ matrix.package_label }}
          path: |
            dist/sailfin-native-${{ matrix.package_label }}-*.tar.gz
            dist/sailfin-native-${{ matrix.package_label }}-*.tar.gz.sha256
            dist/sailfin-native-${{ matrix.package_label }}-*.manifest.json
          if-no-files-found: error

      - name: Upload installer archive
        uses: actions/upload-artifact@v7
        with:
          name: release-installer-${{ matrix.package_label }}
          path: dist/installer-${{ matrix.package_label }}.tar.gz
          if-no-files-found: error

      - name: Upload Windows installer archive
        if: matrix.package_label == 'linux-x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: release-installer-windows-x86_64
          path: dist/installer-windows-x86_64.tar.gz
          if-no-files-found: error

  # SFEP-0021 M11 / SFN-57: the native MSVC release leg, split into a
  # cross-seed job (duplicated rather than reused from the `build` matrix's
  # linux-x86_64 leg or from windows-native-selfhost.yml's own cross-seed
  # job) and a windows-2025 build job that brings Windows to the SAME
  # release-leg shape the other three platforms already have: build,
  # package, verify — no fixed-point gate. Every other leg in this workflow
  # is `mode: build-package` via the `sailfin-build` composite plus a smoke
  # test and version checks; none of them, including the `bootstrap.toml`-
  # pinned Linux seed that ships through this exact path, runs a self-host
  # fixed point in the release run. Determinism for every platform is
  # `nightly-selfhost.yml`'s (Linux/macOS) and `windows-native-selfhost.yml`'s
  # (Windows) job, both running the fixed point unconditionally on every
  # push to `main` and on a daily cron — the released commit is already
  # fixed-point-verified by that mechanism before this leg ever builds it.
  #
  # Duplicating cross-seed rather than adding `needs: build` is deliberate
  # — the matrix's linux-arm64 leg alone runs up to ~240 minutes (qemu
  # bootstrap), and `upload` would then wait on it before even starting the
  # native Windows leg. Running these two jobs in parallel with `build`
  # instead costs, split honestly into its transitional and steady-state
  # parts:
  #   - Transitional: `native-windows-cross-seed` (~10-15 min) exists only
  #     because no native Windows seed has been published yet. It
  #     disappears once one exists and `sailfin-build-windows`'s
  #     `seed_source: 'release'` mode (currently unimplemented) replaces it.
  #   - Steady state: `native-windows-build` itself — slower than the other
  #     platforms' Windows runners tend to be, but build+package only (no
  #     fixed point), and it runs parallel to the `build` matrix rather than
  #     after it, so its contribution to the critical path is materially
  #     smaller than the transitional cross-seed cost above.
  #
  # This leg is best-effort while it stabilizes: `upload` below proceeds on a
  # failed or cancelled native-windows-build (see its `if:` condition) so a
  # still-shaking Windows leg can never block or silently swallow the release
  # the other four platforms already produced.
  native-windows-cross-seed:
    name: Build mingw-cross bootstrap seed [native windows leg]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout repository (build ref)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.BUILD_REF }}

      - name: Resolve seed version (input override → bootstrap.toml)
        id: seed
        shell: bash
        env:
          INPUT_SEED_VERSION: ${{ inputs.seed_version }}
        run: |
          set -euo pipefail
          override="$(printf '%s' "$INPUT_SEED_VERSION" | tr -d '[:space:]')"
          if [ -n "$override" ]; then
            pin="$override"
          else
            if [ ! -f bootstrap.toml ]; then
              echo "[seed-pin][error] tag ${RELEASE_TAG} predates bootstrap.toml." >&2
              echo "[seed-pin][error] re-run this workflow with the 'seed_version' input set." >&2
              exit 1
            fi
            pin="$(awk '
              /^\[[^]]+\]/ { section=$0 }
              section == "[seed]" && /^version[[:space:]]*=/ { gsub(/"/, "", $3); print $3; exit }
            ' bootstrap.toml)"
            if [ -z "$pin" ]; then
              echo "[seed-pin][error] bootstrap.toml has no [seed].version at tag ${RELEASE_TAG}" >&2
              exit 1
            fi
          fi
          echo "seed_version=$pin" >> "$GITHUB_OUTPUT"

      - name: Install clang + llvm (Linux)
        uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with:
          packages: clang-18 llvm-18 jq

      - name: Set CLANG env (Linux)
        shell: bash
        run: echo "CLANG=clang-18" >> "$GITHUB_ENV"

      - name: Build native compiler (self-host main)
        uses: ./.github/actions/sailfin-build
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        with:
          mode: build-only
          target: linux-x86_64
          clang: clang-18
          seed_version: ${{ steps.seed.outputs.seed_version }}
          package: 'false'

      - name: Install MinGW-w64 cross-compiler (Linux)
        uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with:
          packages: gcc-mingw-w64-x86-64
          no-install-recommends: 'true'

      - name: Verify MinGW-w64 cross-compiler (Linux)
        shell: bash
        run: x86_64-w64-mingw32-gcc --version | head -1

      - name: Cross-compile the bootstrap seed (Linux)
        shell: bash
        run: |
          set -euo pipefail
          make ci-cross-windows

      - name: Upload mingw-cross bootstrap seed
        uses: actions/upload-artifact@v7
        with:
          name: ci-installer-windows-x86_64
          path: dist/installer-windows-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1

  native-windows-build:
    name: Build + package [native windows-x86_64-msvc]
    needs: native-windows-cross-seed
    runs-on: windows-2025 # pinned, not `windows-latest` — SFN-55 Risk R3
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # No `SAILFIN_USE_ARENA` pin here, deliberately — no other leg in
      # this workflow sets one, so the Linux and macOS release binaries are
      # malloc-built, and this leg matches them. `windows-native-selfhost.yml`
      # pins it (`:23-27`) specifically so ITS fixed-point gate exercises the
      # arena path rather than malloc; this leg has no fixed point (see the
      # comment on "Package native MSVC installer" below), so that rationale
      # doesn't apply here, and pinning it anyway would make the shipped
      # Windows asset the one arena-built binary in the release for no
      # explained reason.
      SAILFIN_TARGET_OS: Windows
    steps:
      - name: Checkout repository (build ref)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.BUILD_REF }}
          # Nothing in this job pushes — it only builds, packages, and
          # uploads an artifact for `upload` to pick up later — so there is
          # no reason to keep a checkout token persisted in the workspace
          # for the ~90-minute duration of a native self-host (matches
          # `upload`'s own checkout below).
          persist-credentials: false

      # Same fidelity check as the `build` matrix (see "Verify build
      # checkout" above) — this leg checks out BUILD_REF independently, so
      # without this the MSVC asset could be built from a different tree
      # than the one that gets hashed into SHA256SUMS and published under
      # the tag.
      - name: Verify build checkout
        shell: bash
        env:
          EXPECT_SHA: ${{ inputs.expect_sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          echo "[ci] building ${BUILD_REF} @ ${head}"
          if [ -n "${EXPECT_SHA:-}" ]; then
            if [ "$head" != "${EXPECT_SHA}" ]; then
              echo "[ci][error] expected commit ${EXPECT_SHA}, got ${head}" >&2
              exit 1
            fi
          elif [ "${BUILD_REF}" = "${RELEASE_TAG}" ]; then
            current="$(git describe --tags --exact-match)"
            if [ "$current" != "${RELEASE_TAG}" ]; then
              echo "[ci][error] expected ${RELEASE_TAG}, got $current" >&2
              exit 1
            fi
          fi

      - name: Build native Windows compiler
        id: build_windows
        uses: ./.github/actions/sailfin-build-windows
        with:
          seed_source: cross

      # Deliberately build + package, no fixed-point gate — matching the
      # other three platform legs' shape, not a lesser standard for
      # Windows. Every other leg here runs `mode: build-package` via the
      # `sailfin-build` composite (see the `build` matrix step above) plus
      # a smoke test and version checks; none of them run a self-host
      # fixed point in the release run either, including the
      # `bootstrap.toml`-pinned Linux seed that ships through this exact
      # path. Determinism for all platforms — this one included — is
      # `nightly-selfhost.yml`'s and `windows-native-selfhost.yml`'s job:
      # both run the fixed point unconditionally on every push to `main`
      # and on a daily cron, so the released commit is already
      # fixed-point-verified by the same mechanism the other platforms
      # rely on before this leg ever builds it again here. Re-running it
      # inside the release critical path would apply a stricter bar to
      # Windows than to the platform we self-host on every day — do not
      # re-add it on the assumption its absence is an oversight.
      #
      # Transitional target name (SFEP-0021 M11): `make ci-cross-windows`
      # already owns the `installer-windows-x86_64.tar.gz` basename for the
      # mingw-cross leg, so this leg must use a distinct `--target` rather
      # than colliding with it. `_package_target_os` prefix-matches
      # `windows-` so `.exe` staging still applies to the MSVC target.
      - name: Package native MSVC installer
        shell: bash
        run: |
          set -euo pipefail
          "$NATIVE_SFN" package --installer --target windows-x86_64-msvc --compiler-bin "$NATIVE_SFN"
          ls -la dist/installer-windows-x86_64-msvc.tar.gz

      - name: Verify compiler version matches tag
        shell: bash
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          file_version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' compiler/capsule.toml)"
          if [ "$file_version" != "$expected" ]; then
            echo "[ci][error] compiler/capsule.toml has '$file_version', expected '$expected'" >&2
            exit 1
          fi
          actual="$("$NATIVE_SFN" --version | sed -n 's/.*sfn //p')"
          if [ "$actual" != "$expected" ]; then
            echo "[ci][error] built compiler reports '$actual', expected '$expected'" >&2
            exit 1
          fi

      # Weaker than "Verify compiler version matches tag" above, and the
      # error text below is worded accordingly. The installer payload
      # stages only bin/, runtime/, import-context/
      # (`_package_installer` in `compiler/src/cli/commands/package.sfn`) —
      # no `.build-stamp`, no `compiler/capsule.toml` alongside the binary.
      # `resolve_compiler_version` (`compiler/src/version.sfn`) therefore
      # cannot read a build stamp bundled in the tarball; whatever it
      # resolves to here depends on this job's own working-directory
      # layout (its relative capsule.toml lookup can land back on the real
      # checkout two directories above `_installer_check/bin/`), not on
      # anything guaranteed once the tarball is unpacked on an end-user
      # machine. This step asserts the extracted `sfn.exe` prints the
      # expected version string in THIS CI environment — a real check, but
      # not proof the packaged binary is self-describing in general. The
      # strong, unambiguous check is "Verify compiler version matches tag"
      # above, which reads `compiler/capsule.toml` and `$NATIVE_SFN
      # --version` directly rather than through the extracted payload.
      - name: Verify installer payload reports expected version (weaker than the build-level check above)
        shell: bash
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          rm -rf _installer_check
          mkdir -p _installer_check
          tar -xzf dist/installer-windows-x86_64-msvc.tar.gz -C _installer_check
          # `-print -quit` rather than `| head -1`: the payload also
          # contains thousands of staged `.sfn`/`.sfn-asm` sources, so a
          # plain `find | head -1` under `set -euo pipefail` can SIGPIPE
          # when `head` closes the pipe while `find` is still walking,
          # failing the step intermittently (scripts/verify-payload-dep-closure.sh
          # already uses this same fix for the same hazard).
          bin="$(find _installer_check -name 'sfn.exe' -print -quit)"
          if [ -z "$bin" ]; then
            echo "[ci][error] sfn.exe not found in installer payload" >&2
            exit 1
          fi
          actual="$("$bin" --version | sed -n 's/.*sfn //p')"
          if [ "$actual" != "$expected" ]; then
            echo "[ci][error] extracted installer payload's sfn.exe reports version '$actual' in this CI environment, expected '$expected' (see comment above: this does not by itself prove the shipped tarball is self-describing)" >&2
            exit 1
          fi

      - name: Upload native MSVC installer archive
        uses: actions/upload-artifact@v7
        with:
          name: release-installer-windows-x86_64-msvc
          path: dist/installer-windows-x86_64-msvc.tar.gz
          if-no-files-found: error

  upload:
    name: Verify, promote & publish
    # `!cancelled()` below covers a `native-windows-build` timeout/failure/
    # cancellation: a cancelled job conclusion otherwise hard-skips every
    # `needs:` dependent regardless of its own `if:`/`continue-on-error`, so
    # without this override a stuck native leg would silently take `upload`
    # (and both notify jobs below, which depend on it) down with it —
    # unbumped `main`, no tag, no Slack ping. `needs.build.result ==
    # 'success'` preserves the pre-existing invariant that a failed matrix
    # leg still blocks publishing (`fail-fast: false` makes the matrix's
    # aggregate result `failure` if any leg fails); `native-windows-build`'s
    # result is deliberately NOT checked here — this leg is best-effort while
    # it stabilizes, so its own outcome never gates the other four platforms.
    needs: [build, native-windows-build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (signing script + committed public key)
        uses: actions/checkout@v7
        with:
          # Pin to the build ref so the signing script and the committed public
          # key come from the same commit the binaries were built at (the build
          # job checks out this ref too) — matters for retroactive rebuilds and
          # key-rotation windows. On a release.yml cut this is the staging
          # branch, and it is also the commit the promotion step tags.
          ref: ${{ env.BUILD_REF }}
          # Full history: the promotion step pushes this commit to `main`, and a
          # shallow clone cannot be pushed. Credentials are configured there
          # from RELEASE_PAT rather than persisted here, so a non-promoting run
          # carries no push token at all.
          fetch-depth: 0
          persist-credentials: false

      # Retroactive tags predate SFN-799's fail-closed payload verifier. Keep
      # their signing code and public key pinned above, but apply the current
      # publication invariant so a legacy QEMU rebuild can still produce a
      # complete ARM64 pair without depending on a script absent from the tag.
      - name: Checkout current release payload gate
        uses: actions/checkout@v7
        with:
          ref: main
          path: .release-gates
          sparse-checkout: |
            scripts/verify-release-payloads.sh
            scripts/verify-payload-dep-closure.sh
          sparse-checkout-cone-mode: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "release-*"
          merge-multiple: true
          path: .

      - name: Normalize artifact layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          # `mv -f` on a basename collision silently overwrites — last file
          # wins, no error. This guard converts that to a hard failure.
          #
          # Scope, stated honestly: the prior "Download build artifacts" step
          # downloads with `merge-multiple: true` into `path: .`, which
          # already collapses two uploaded artifacts that share the exact
          # same relative path — that collision is silently resolved before
          # this step ever runs, and this guard cannot see or catch it. What
          # it DOES catch is a collision arising at this `mv -f` layer: two
          # files that survive the download merge at different paths under
          # `.` (maxdepth 3) but share a basename, which `mv -f` into the
          # flat `dist/` would otherwise silently collapse the same way.
          move_unique() {
            local pattern="$1"
            local dupes
            dupes="$(find . -maxdepth 3 -type f -name "$pattern" -printf '%f\n' | sort | uniq -d)"
            if [ -n "$dupes" ]; then
              echo "[normalize][error] duplicate basename(s) found for pattern '$pattern':" >&2
              echo "$dupes" >&2
              exit 1
            fi
            find . -maxdepth 3 -type f -name "$pattern" -exec mv -f {} dist/ \;
          }

          move_unique 'sailfin-native-*.tar.gz'
          move_unique 'sailfin-native-*.tar.gz.sha256'
          move_unique 'sailfin-native-*.manifest.json'
          move_unique 'installer-*.tar.gz'

      - name: Prepare installer assets
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          while IFS= read -r -d '' payload; do
            label="$(basename "$payload" .tar.gz)"
            variant=""
            case "$label" in
              *linux-x86_64*)
                os="linux"
                arch="x86_64"
                ;;
              *linux-arm64*)
                os="linux"
                arch="arm64"
                ;;
              *macos-arm64*)
                os="macos"
                arch="arm64"
                ;;
              # Must precede the *windows-x86_64* arm below — bash `case` is
              # first-match-wins, and `installer-windows-x86_64-msvc.tar.gz`
              # also matches the broader mingw pattern.
              *windows-x86_64-msvc*)
                os="windows"
                arch="x86_64"
                variant="-msvc"
                ;;
              *windows-x86_64*)
                os="windows"
                arch="x86_64"
                ;;
              *)
                echo "unknown installer payload $label" >&2
                continue
                ;;
            esac
            installer_name="sailfin_${version}_${os}_${arch}${variant}.tar.gz"
            mv -f "$payload" "dist/${installer_name}"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "dist/${installer_name}" > "dist/${installer_name}.sha256"
            else
              shasum -a 256 "dist/${installer_name}" > "dist/${installer_name}.sha256"
            fi
          done < <(find dist -maxdepth 1 -type f -name 'installer-*.tar.gz' -print0)

      # Validate the exact final filenames before signing or uploading. This
      # independently guards against artifact-layout drift even though every
      # build matrix leg is required (SFN-799).
      - name: Verify expected platform payloads
        shell: bash
        run: |
          set -euo pipefail
          bash .release-gates/scripts/verify-release-payloads.sh dist "${RELEASE_TAG#v}"

      # Payload completeness, distinct from payload presence above: every
      # capsule in the runtime's transitive dependency closure must be staged
      # inside each installer tarball, with its sources and its manifest. A
      # payload that is present but incomplete link-fails every user program
      # on a fresh install. Kept as its own step rather than folded into the
      # presence gate, which stays a pure "are the required files here" check.
      - name: Verify installer payload dependency closure (all platforms)
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for label in linux_x86_64 linux_arm64 macos_arm64 windows_x86_64; do
            bash .release-gates/scripts/verify-payload-dep-closure.sh \
              "dist/sailfin_${version}_${label}.tar.gz"
          done
          # The native MSVC asset is optional presence (native-windows-build
          # is best-effort while it stabilizes — see `upload`'s `if:` above),
          # but never an optional check: skip only when the payload is
          # absent, verify unconditionally when it is present. It is the one
          # release payload produced by a code path that has barely executed
          # anywhere, making it the most likely to have an incomplete
          # runtime closure — and a payload that is present but incomplete
          # link-fails every user program on a fresh install, exactly what
          # this loop exists to catch for every other platform.
          msvc_payload="dist/sailfin_${version}_windows_x86_64-msvc.tar.gz"
          if [ -f "$msvc_payload" ]; then
            bash .release-gates/scripts/verify-payload-dep-closure.sh "$msvc_payload"
          fi

      # Supply-chain root: publish a signed SHA256SUMS manifest over the release
      # assets so `sfn` can verify a fetched toolchain against the public key
      # embedded in the binary. Trust model: docs/release-signing.md, SFEP-0046 §3.5.
      # The self-verify inside the script fails the release if the CI signing key
      # and the committed public key drift apart.
      - name: Sign release manifest (SHA256SUMS)
        shell: bash
        env:
          SAILFIN_RELEASE_SIGNING_KEY: ${{ secrets.SAILFIN_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          bash scripts/sign-release-manifest.sh dist

      # SFN-829: the first and only mutation of `main` in a cut, and the point
      # at which the tag comes into existence. Every gate above has already
      # passed against these exact bits — per-leg smoke, compiler-version,
      # installer payload version, per-leg and all-platform dependency closure,
      # payload presence, and manifest signing. Before this step a cut is
      # entirely abandonable; that is what keeps a payload defect from burning a
      # version number the way the 0.9.4 cut did.
      #
      # `--atomic` over both refspecs so `main` and the tag land together or not
      # at all. Non-force so the push is *rejected* if `main` advanced while the
      # payloads were building: losing the build is the accepted cost of tagging
      # exactly the commit that was verified, rather than a rebased
      # approximation whose tree nobody built. Rejection mutates nothing.
      #
      # Skipped unless release.yml passed `promote: true` — the workflow_dispatch
      # path does not expose the input, so a manual rebuild cannot reach here.
      - name: Promote (fast-forward main, push tag)
        if: inputs.promote
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PAT }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          EXPECT_SHA: ${{ inputs.expect_sha }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "::error::RELEASE_PAT is required to promote a release so the new tag triggers downstream workflows."
            exit 1
          fi
          git config user.name "Sailfin Release Bot"
          git config user.email "releases@sailfin.io"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          sha="$(git rev-parse HEAD)"
          # The build legs pinned themselves to this same commit. Re-assert it
          # here so the tag can only ever name bits that were actually built.
          if [ -n "${EXPECT_SHA:-}" ] && [ "$sha" != "${EXPECT_SHA}" ]; then
            echo "::error::Refusing to promote ${sha}: the build ref moved from the verified commit ${EXPECT_SHA}."
            exit 1
          fi
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}" "$sha"
          if ! git push --atomic origin "${sha}:refs/heads/main" "refs/tags/${RELEASE_TAG}"; then
            echo "::error::Promotion push rejected — 'main' advanced while the release payloads were building, so the staged bump is no longer a fast-forward. Nothing was mutated: 'main' is unbumped and ${RELEASE_TAG} is not tagged. Re-run the release workflow; it rebases onto the newer 'main'."
            exit 1
          fi
          echo "Promoted ${sha} to main and pushed ${RELEASE_TAG}."

          # `gh release create --verify-tag` below reads the tag back through
          # the REST API, which can lag the git push by a beat. Poll for it
          # here rather than racing it at the final step of a release build
          # that has already spent hours getting this far.
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              exit 0
            fi
            echo "Tag ${RELEASE_TAG} not visible via the API yet (attempt ${attempt}/6); waiting."
            sleep 5
          done
          echo "::error::${RELEASE_TAG} was pushed but is still not visible via the API after 30s."
          exit 1

      # `gh release create <tag> <files...>` creates a draft internally,
      # uploads every asset, and publishes only after every upload succeeds.
      # This ordering is the publication invariant: a failed ARM64 build,
      # payload gate, signing step, or upload cannot expose a new incomplete
      # release (SFN-799). Repair runs move an existing public release back to
      # draft before replacing assets; any failed upload therefore leaves an
      # unpublished draft rather than a public partial payload set.
      - name: Publish complete release atomically
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "[ci][error] gh CLI not available on runner" >&2
            exit 1
          fi

          shopt -s nullglob
          files=(
            dist/sailfin-native-*.tar.gz
            dist/sailfin-native-*.tar.gz.sha256
            dist/sailfin-native-*.manifest.json
            dist/sailfin_*.tar.gz
            dist/sailfin_*.tar.gz.sha256
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "[ci][error] no release assets found after payload verification" >&2
            exit 1
          fi

          prerelease_args=(--latest)
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            prerelease_args=(--prerelease --latest=false)
          fi

          notes_start_args=()
          if [ -n "${PREVIOUS_TAG}" ]; then
            notes_start_args=(--notes-start-tag "${PREVIOUS_TAG}")
          fi

          if is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "${is_draft}" = "false" ]; then
              gh release edit "${RELEASE_TAG}" --draft=true
            fi
            gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber
            gh release edit "${RELEASE_TAG}" --draft=false "${prerelease_args[@]}"
          else
            version="${RELEASE_TAG#v}"
            gh release create "${RELEASE_TAG}" "${files[@]}" \
              --verify-tag \
              --title "Sailfin ${version}" \
              --generate-notes \
              "${notes_start_args[@]}" \
              "${prerelease_args[@]}"
          fi
  notify-slack-failure:
    name: Notify Slack on release asset failure
    # `native-windows-build` is in `needs` here even though `upload` (the
    # only OTHER consumer of its result) deliberately ignores it — this is
    # the leg's one failure-visibility path. Without it, a native-leg-only
    # failure/cancellation is invisible: `upload` still runs and succeeds
    # (by design, so the leg can't block the other four platforms), so
    # neither this job's old `failure()` condition nor notify-slack-success's
    # `success()` would ever mention it, and the leg fails silently — the
    # same "nobody notices" rot windows-native-selfhost.yml's own
    # `notify-failure` job (`:310-470`) exists to close.
    needs: [build, native-windows-build, upload]
    # `!cancelled()` guards this job's own scheduling the same way it guards
    # `upload`'s (see `upload`'s comment above): a cancelled dependency
    # otherwise hard-skips this job regardless of the disjuncts below.
    # `needs.native-windows-build.result == 'cancelled'` is listed
    # explicitly because a job-level timeout there yields `cancelled`, which
    # `failure()`-style checks do not treat as a failure.
    if: >-
      ${{ !cancelled() &&
          (needs.build.result == 'failure' ||
           needs.upload.result == 'failure' ||
           needs.native-windows-build.result == 'failure' ||
           needs.native-windows-build.result == 'cancelled') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Post Slack notification
        shell: bash
        env:
          SLACK_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
          IS_PROMOTE: ${{ inputs.promote }}
          BUILD_RESULT: ${{ needs.build.result }}
          UPLOAD_RESULT: ${{ needs.upload.result }}
          NATIVE_WINDOWS_RESULT: ${{ needs.native-windows-build.result }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_RELEASE_WEBHOOK_URL:-}" ]; then
            exit 0
          fi
          python3 - <<'PY' > /tmp/slack-payload.json
          import json
          import os
          tag = os.environ["RELEASE_TAG"]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          core_failed = os.environ.get("BUILD_RESULT") == "failure" or os.environ.get("UPLOAD_RESULT") == "failure"
          native_result = os.environ.get("NATIVE_WINDOWS_RESULT", "")
          if core_failed:
              # On a promoting cut the gates run before anything is public, so the
              # usual outcome of this failure is a clean no-op rather than a
              # half-finished release (SFN-829). Say so: the remediation is "fix and
              # re-cut", not "go clean up main". Does not apply to a
              # native-leg-only failure below, since `upload` deliberately
              # still published in that case.
              suffix = (
                  " Payload gates run before promotion, so `main` is most likely unbumped and untagged"
                  " — check the run for whether the Promote step was reached."
                  if os.environ.get("IS_PROMOTE") == "true"
                  else ""
              )
              print(json.dumps({
                  "text": f":x: Sailfin release asset build/upload failed for {tag}.{suffix}\\nRun: {run_url}"
              }))
          else:
              print(json.dumps({
                  "text": f":warning: Sailfin release {tag} published, but the native MSVC Windows seed leg ({native_result}) did not produce an asset. The mingw-cross Windows installer still shipped normally; only the native seed is missing from this release.\\nRun: {run_url}"
              }))
          PY
          curl -fsS -X POST \
            -H 'Content-type: application/json' \
            --data @/tmp/slack-payload.json \
            "$SLACK_RELEASE_WEBHOOK_URL" >/dev/null || true

  notify-slack-success:
    name: Notify Slack on release published
    needs: [build, upload]
    # See notify-slack-failure's `!cancelled()` comment above — same
    # hard-skip hazard applies here.
    if: ${{ !cancelled() && success() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Post Slack notification
        shell: bash
        env:
          SLACK_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
          IS_PRERELEASE: ${{ contains(env.RELEASE_TAG, '-') }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_RELEASE_WEBHOOK_URL:-}" ]; then
            exit 0
          fi
          python3 - <<'PY' > /tmp/slack-payload.json
          import json
          import os
          tag = os.environ["RELEASE_TAG"]
          prerelease = os.environ.get("IS_PRERELEASE", "false") == "true"
          repo = os.environ["GITHUB_REPOSITORY"]
          rel_url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/releases/tag/{tag}"
          if prerelease:
              text = f":package: Sailfin prerelease {tag} published with assets.\nRelease: {rel_url}"
          else:
              text = f":tada: Sailfin STABLE {tag} published with assets.\nRelease: {rel_url}"
          print(json.dumps({"text": text}))
          PY
          curl -fsS -X POST \
            -H 'Content-type: application/json' \
            --data @/tmp/slack-payload.json \
            "$SLACK_RELEASE_WEBHOOK_URL" >/dev/null || true
