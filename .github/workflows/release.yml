name: Release

# Manually-triggered release workflow.  Replaces python-semantic-release.
#
# Reads the current version from compiler/capsule.toml, computes the next
# version based on `channel` and `bump` inputs, updates the compiler and
# implementation-capsule manifests plus version.sfn, and commits — then pushes
# that commit to a *staging branch* rather than to `main`.
#
# SFN-829: nothing about a cut is public until release-tag.yml has built,
# packaged and verified every platform payload from that staging branch. Only
# then does it fast-forward `main` onto the bump and push the tag, atomically,
# before publishing the GitHub Release. A payload defect therefore leaves `main`
# unbumped and untagged rather than burning a version number the way the 0.9.4
# cut did. Full order of operations and failure modes:
# docs/runbooks/release-ordering.md.
#
# Channel semantics:
#   alpha       → v0.5.0-alpha.23   (prerelease on main)
#   beta        → v0.5.0-beta.1     (promote to beta)
#   rc          → v0.5.0-rc.1       (release candidate)
#   stable      → v0.5.0            (GA release)
#
# Bump semantics (within the chosen channel):
#   prerelease  → increment the .N suffix (or start .1 when promoting)
#   patch       → bump patch, reset to <channel>.1  (or clean for stable)
#   minor       → bump minor, reset patch + prerelease
#   major       → bump major, reset minor + patch + prerelease

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - alpha
          - beta
          - rc
          - stable
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - prerelease
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (compute version but don't tag/release)"
        required: false
        type: boolean
        default: false
      verified_sha:
        description: "Commit whose compiler a green nightly self-host verified (release-train gate). Blank on manual cuts skips the re-check."
        required: false
        type: string
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_PAT_SECRET: ${{ secrets.RELEASE_PAT }}

jobs:
  release:
    name: Stage version bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      prev_tag: ${{ steps.bump.outputs.prev_tag }}
      staging_ref: ${{ steps.stage.outputs.staging_ref }}
      staging_sha: ${{ steps.stage.outputs.staging_sha }}

    steps:
      - name: Require RELEASE_PAT
        if: env.RELEASE_PAT_SECRET == ''
        run: |
          echo "::error::RELEASE_PAT secret is required so the new tag triggers downstream workflows."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git credentials
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          git config user.name "Sailfin Release Bot"
          git config user.email "releases@sailfin.io"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Compute next version
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL="${{ inputs.channel }}"
          BUMP="${{ inputs.bump }}"

          # --- Read current version from capsule.toml -------------------------
          current="$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' compiler/capsule.toml)"
          if [ -z "$current" ]; then
            echo "::error::Could not read version from compiler/capsule.toml"
            exit 1
          fi
          echo "Current version: $current"

          # `prev_tag` becomes the `--notes-start-tag` the publish step in
          # release-tag.yml passes when it creates the release. The
          # current version's tag normally exists, but it does not when a bad
          # release was deleted — which is the standard remediation, so the
          # next cut must not depend on it. Emit an empty value in that case
          # and let `--generate-notes` pick the start point itself, rather
          # than passing a tag that is not there and finding out at the final
          # publish step of a long release build.
          if git rev-parse "v${current}" >/dev/null 2>&1; then
            echo "prev_tag=v${current}" >> "$GITHUB_OUTPUT"
          else
            echo "No tag 'v${current}' (deleted or never cut); letting --generate-notes auto-detect the start point."
            echo "prev_tag=" >> "$GITHUB_OUTPUT"
          fi

          # --- Parse semver components ----------------------------------------
          # Matches: MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-pre.N
          if [[ "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-([a-z]+)\.([0-9]+))?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            PRE_LABEL="${BASH_REMATCH[5]:-}"
            PRE_NUM="${BASH_REMATCH[6]:-0}"
          else
            echo "::error::Cannot parse version '$current' as semver"
            exit 1
          fi

          # --- Channel ordering for promotion checks -------------------------
          channel_rank() {
            case "$1" in
              alpha)  echo 0 ;;
              beta)   echo 1 ;;
              rc)     echo 2 ;;
              stable) echo 3 ;;
              *)      echo -1 ;;
            esac
          }

          cur_rank=$(channel_rank "${PRE_LABEL:-stable}")
          new_rank=$(channel_rank "$CHANNEL")

          # --- Compute next version -------------------------------------------
          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              if [ "$CHANNEL" = "stable" ]; then
                NEXT="${MAJOR}.${MINOR}.${PATCH}"
              else
                NEXT="${MAJOR}.${MINOR}.${PATCH}-${CHANNEL}.1"
              fi
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              if [ "$CHANNEL" = "stable" ]; then
                NEXT="${MAJOR}.${MINOR}.${PATCH}"
              else
                NEXT="${MAJOR}.${MINOR}.${PATCH}-${CHANNEL}.1"
              fi
              ;;
            patch)
              PATCH=$((PATCH + 1))
              if [ "$CHANNEL" = "stable" ]; then
                NEXT="${MAJOR}.${MINOR}.${PATCH}"
              else
                NEXT="${MAJOR}.${MINOR}.${PATCH}-${CHANNEL}.1"
              fi
              ;;
            prerelease)
              if [ "$CHANNEL" = "stable" ]; then
                # Promote to stable: strip prerelease suffix
                NEXT="${MAJOR}.${MINOR}.${PATCH}"
              elif [ "$CHANNEL" = "$PRE_LABEL" ]; then
                # Same channel: increment prerelease number
                NEXT="${MAJOR}.${MINOR}.${PATCH}-${CHANNEL}.$((PRE_NUM + 1))"
              elif [ "$new_rank" -gt "$cur_rank" ]; then
                # Promoting to a higher channel: start at .1
                NEXT="${MAJOR}.${MINOR}.${PATCH}-${CHANNEL}.1"
              else
                echo "::error::Cannot demote from '${PRE_LABEL:-stable}' to '${CHANNEL}'. Use a higher channel or bump major/minor/patch first."
                exit 1
              fi
              ;;
          esac

          # --- Guard against no-op releases ------------------------------------
          if [ "$NEXT" = "$current" ]; then
            echo "::error::Computed version '$NEXT' is the same as the current version. Nothing to release. Use a different bump or channel."
            exit 1
          fi

          # --- Guard against re-tagging an existing tag -----------------------
          if git rev-parse "v${NEXT}" >/dev/null 2>&1; then
            echo "::error::Tag 'v${NEXT}' already exists. Choose a different bump/channel combination."
            exit 1
          fi

          echo "Next version: $NEXT"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Update version files
        if: inputs.dry_run != true
        shell: bash
        env:
          NEXT: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          # Update the compiler manifest (whitespace-tolerant around = and quotes).
          capsule_matches=$(grep -c '^version *=' compiler/capsule.toml || true)
          if [ "$capsule_matches" -ne 1 ]; then
            echo "::error::Expected exactly 1 'version =' line in capsule.toml, found $capsule_matches"
            exit 1
          fi
          current_compiler_version="$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' compiler/capsule.toml)"
          sed -i "s/^version *= *\"[^\"]*\"/version = \"${NEXT}\"/" compiler/capsule.toml

          # SFEP-0020: private compiler implementation capsules share the
          # compiler release version. Refuse pre-existing drift, then bump the
          # complete physical capsule set atomically with the root manifest.
          mapfile -t internal_manifests < <(
            find compiler/capsules -mindepth 2 -maxdepth 2 -name capsule.toml -print | sort
          )
          if [ "${#internal_manifests[@]}" -eq 0 ]; then
            echo "::error::No compiler implementation capsule manifests found"
            exit 1
          fi
          for manifest in "${internal_manifests[@]}"; do
            manifest_matches=$(grep -c '^version *=' "$manifest" || true)
            if [ "$manifest_matches" -ne 1 ]; then
              echo "::error::Expected exactly 1 'version =' line in $manifest, found $manifest_matches"
              exit 1
            fi
            manifest_version="$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' "$manifest")"
            if [ "$manifest_version" != "$current_compiler_version" ]; then
              echo "::error::$manifest is at $manifest_version, not compiler version $current_compiler_version"
              exit 1
            fi
            sed -i "s/^version *= *\"[^\"]*\"/version = \"${NEXT}\"/" "$manifest"
          done

          # Update version.sfn fallback (whitespace-tolerant around = and quotes).
          # The compiler reads its version from capsule.toml at runtime, but
          # installed binaries fall back to __version_fallback__ when capsule.toml
          # is not on disk.
          sfn_matches=$(grep -c 'let __version_fallback__ *=' compiler/src/version.sfn || true)
          if [ "$sfn_matches" -ne 1 ]; then
            echo "::error::Expected exactly 1 '__version_fallback__' assignment in version.sfn, found $sfn_matches"
            exit 1
          fi
          sed -i "s/let __version_fallback__ *= *\"[^\"]*\"/let __version_fallback__ = \"${NEXT}\"/" compiler/src/version.sfn

          # Verify the replacements took effect
          echo "--- compiler/capsule.toml ---"
          grep '^version' compiler/capsule.toml
          echo "--- compiler implementation capsules ---"
          for manifest in "${internal_manifests[@]}"; do
            printf '%s: ' "$manifest"
            grep '^version' "$manifest"
          done
          echo "--- compiler/src/version.sfn ---"
          grep '__version_fallback__' compiler/src/version.sfn

          # Update llms.txt's "> Version:" stamp. The drift guard
          # (compiler/tests/e2e/test_llms_txt_sync.sh) asserts this line
          # matches capsule.toml; without this rewrite every automated
          # release tag fails that test by construction (the bump lands
          # seconds before the build, with no human review in between) —
          # exactly what broke the v0.7.0-alpha.30 cut. Content accuracy
          # beyond the stamp remains a review concern on content PRs.
          llms_matches=$(grep -c '^> Version:' llms.txt || true)
          if [ "$llms_matches" -ne 1 ]; then
            echo "::error::Expected exactly 1 '> Version:' line in llms.txt, found $llms_matches"
            exit 1
          fi
          today=$(date -u +%Y-%m-%d)
          sed -i "s/^> Version:.*/> Version: ${NEXT} | Updated: ${today}/" llms.txt
          echo "--- llms.txt ---"
          grep '^> Version:' llms.txt

          # Final sanity check: the new version must appear in every version file.
          if ! grep -q "\"${NEXT}\"" compiler/capsule.toml; then
            echo "::error::capsule.toml was not updated to version ${NEXT}"
            exit 1
          fi
          if ! grep -q "\"${NEXT}\"" compiler/src/version.sfn; then
            echo "::error::version.sfn was not updated to version ${NEXT}"
            exit 1
          fi
          for manifest in "${internal_manifests[@]}"; do
            if ! grep -q "^version *= *\"${NEXT}\"" "$manifest"; then
              echo "::error::$manifest was not updated to version ${NEXT}"
              exit 1
            fi
          done
          if ! grep -q "^> Version: ${NEXT} " llms.txt; then
            echo "::error::llms.txt was not updated to version ${NEXT}"
            exit 1
          fi

      - name: Commit version bump
        if: inputs.dry_run != true
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git add compiler/capsule.toml compiler/capsules/*/capsule.toml compiler/src/version.sfn llms.txt
          git commit -m "chore(release): ${TAG#v}"

      # SFN-829: the bump commit goes to a throwaway staging branch, never to
      # `main`, and no tag is created here. release-tag.yml builds and verifies
      # every platform payload from this branch and only then fast-forwards
      # `main` onto this exact commit and pushes the tag. Until that promotion
      # the cut is entirely abandonable — which is the point: the 0.9.4 payload
      # defect burned a version number precisely because the bump and the tag
      # were public before any asset existed to fail on.
      - name: Rebase & push staging branch
        id: stage
        if: inputs.dry_run != true
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          VERIFIED_SHA: ${{ inputs.verified_sha }}
        run: |
          set -euo pipefail
          STAGING_REF="release-staging/${TAG}"

          # main is written to concurrently (e.g. capsule-release.yml auto-commits
          # `chore(capsules): bump versions`). Rebase our version-bump commit onto the
          # latest origin/main so the promotion push is a fast-forward. Paths are
          # disjoint (we touch compiler/*, capsule bot touches capsules/*), so the
          # rebase replays without conflicts; abort defensively if one occurs.
          git fetch origin main

          # Self-host safety gate (#1956): the release-train passes the SHA of the
          # green nightly whose triple-pass `make check` verified HEAD's compiler.
          # We stage on top of origin/main's tip (so the version bump fast-forwards
          # main at promotion), which is safe ONLY while its compiler is
          # byte-behaviour-identical to that verified commit. Re-check here —
          # origin/main may have advanced since the train evaluated — and refuse to
          # cut if it moved onto a compiler / runtime / seed change the nightly never
          # saw; the next nightly must re-verify first. Diffed BEFORE our own bump
          # commit, so the bump's compiler manifest/version edits never trip it.
          # Empty on manual/override cuts (the operator owns the risk).
          if [ -n "$VERIFIED_SHA" ]; then
            unverified="$(git diff --name-only "${VERIFIED_SHA}..origin/main" -- compiler/src compiler/capsules runtime bootstrap.toml)"
            if [ -n "$unverified" ]; then
              echo "::error::origin/main advanced onto self-host-relevant changes not covered by verified nightly ${VERIFIED_SHA}; refusing to cut an unverified compiler. Re-run after the next green nightly. Files:"
              echo "$unverified"
              exit 1
            fi
          fi

          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::Rebase onto origin/main hit a conflict."
            exit 1
          fi

          sha="$(git rev-parse HEAD)"
          base="$(git rev-parse origin/main)"
          # Force-push: the staging branch is ours alone and a retried cut of the
          # same version must overwrite whatever a previous attempt left behind.
          # This races nothing — `concurrency: group: release` serialises cuts.
          git push --force origin "HEAD:refs/heads/${STAGING_REF}"

          echo "staging_ref=${STAGING_REF}" >> "$GITHUB_OUTPUT"
          echo "staging_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Staged ${TAG} as ${sha} on ${STAGING_REF} (base ${base}). Nothing public yet."
          {
            echo "## Staged ${TAG}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Staging branch | \`${STAGING_REF}\` |"
            echo "| Commit | \`${sha}\` |"
            echo "| Base (origin/main) | \`${base}\` |"
            echo ""
            echo "\`main\` is unbumped and \`${TAG}\` is untagged until every payload gate passes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run summary
        if: inputs.dry_run == true
        run: |
          {
            echo "## Dry Run Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Current | ${{ steps.bump.outputs.prev_tag }} |"
            echo "| Next | ${{ steps.bump.outputs.tag }} |"
            echo "| Channel | ${{ inputs.channel }} |"
            echo "| Bump | ${{ inputs.bump }} |"
            echo ""
            echo "No changes were made (dry run)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Builds and verifies every payload from the staging branch, then promotes:
  # fast-forwards `main` onto the staged commit, pushes the tag, and publishes.
  # `promote: true` is what makes this workflow — and only this workflow — able
  # to mutate `main`; a manual release-tag.yml dispatch cannot (SFN-829).
  build-assets:
    name: Verify payloads, promote & publish
    needs: release
    if: inputs.dry_run != true
    permissions:
      contents: write
    uses: ./.github/workflows/release-tag.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      previous_tag: ${{ needs.release.outputs.prev_tag }}
      ref: ${{ needs.release.outputs.staging_ref }}
      expect_sha: ${{ needs.release.outputs.staging_sha }}
      promote: true
    secrets: inherit

  # The staging branch is scaffolding, not history. Delete it once the cut has
  # landed; keep it after a failure so the operator can inspect exactly what was
  # built. No workflow triggers on `release-staging/*`, so a leftover is inert
  # and the next attempt at the same version force-pushes over it.
  cleanup-staging:
    name: Delete staging branch
    needs: [release, build-assets]
    if: always() && needs.release.outputs.staging_ref != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete or retain the staging branch
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PAT }}
          STAGING_REF: ${{ needs.release.outputs.staging_ref }}
          BUILD_RESULT: ${{ needs.build-assets.result }}
        run: |
          set -euo pipefail
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::notice::Release did not complete (build-assets: ${BUILD_RESULT}). Retaining '${STAGING_REF}' for inspection; delete it with: git push origin --delete ${STAGING_REF}"
            exit 0
          fi
          git init -q .staging-cleanup
          cd .staging-cleanup
          git remote add origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git"
          # Never fail a published release over its own scaffolding: the branch
          # is inert either way, and a red run here would misreport a cut that
          # actually succeeded.
          if git push origin --delete "$STAGING_REF"; then
            echo "Deleted ${STAGING_REF}."
          else
            echo "::warning::Could not delete '${STAGING_REF}'; the release itself published. Delete it with: git push origin --delete ${STAGING_REF}"
          fi

  notify-slack-failure:
    name: Notify Slack on release workflow failure
    needs: release
    if: failure()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Post Slack notification
        shell: bash
        env:
          SLACK_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
          CHANNEL: ${{ inputs.channel }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_RELEASE_WEBHOOK_URL:-}" ]; then
            exit 0
          fi
          python3 - <<'PY' > /tmp/slack-payload.json
          import json
          import os
          channel = os.environ.get("CHANNEL", "unknown")
          bump = os.environ.get("BUMP", "unknown")
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          print(json.dumps({
              "text": f":x: Sailfin release workflow failed while staging the version bump (channel={channel}, bump={bump}). `main` is unbumped and nothing was tagged.\\nRun: {run_url}"
          }))
          PY
          curl -fsS -X POST \
            -H 'Content-type: application/json' \
            --data @/tmp/slack-payload.json \
            "$SLACK_RELEASE_WEBHOOK_URL" >/dev/null || true
