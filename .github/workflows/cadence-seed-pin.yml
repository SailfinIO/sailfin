name: Cadence Seed Pin

# After ANY release publishes assets, open a PR that adopts that just-published
# toolchain as the compiler checkout seed, and auto-merge it once its CI is
# green so the seed advances without a manual step. The canonical pin is
# `bootstrap.toml [seed].version` (SFEP-0047), alongside the `[toolchain].sfn`
# floor in `compiler/capsule.toml` (the compiler member override) and
# `workspace.toml` (the workspace-wide default floor, SFN-414) — all kept in
# lockstep.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Released tag to pin, e.g. v0.9.0"
        required: true

permissions:
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: cadence-seed-pin
  cancel-in-progress: false

jobs:
  open-pin-pr:
    name: Open seed-pin PR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      SLACK_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Resolve released version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
            version="${tag#v}"
          else
            version="$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' compiler/capsule.toml)"
            tag="v${version}"
          fi
          if [ -z "$version" ]; then
            echo "::error::Could not resolve compiler version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Open PR for cadence seed bump
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          post_slack() {
            if [ -z "${SLACK_RELEASE_WEBHOOK_URL:-}" ]; then
              return 0
            fi
            SLACK_TEXT="$1" python3 - <<'PY' > /tmp/slack-payload.json
          import json
          import os
          print(json.dumps({"text": os.environ["SLACK_TEXT"].replace("\\n", "\n")}))
          PY
            curl -fsS -X POST \
              -H 'Content-type: application/json' \
              --data @/tmp/slack-payload.json \
              "$SLACK_RELEASE_WEBHOOK_URL" >/dev/null || true
          }

          source_version="$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' compiler/capsule.toml)"
          if [ "$source_version" != "$VERSION" ]; then
            echo "::error::compiler/capsule.toml is at $source_version, not $VERSION; refusing to pin a seed ahead of the source version."
            exit 1
          fi

          if ! gh release view "$TAG" --json assets,isDraft >/tmp/release.json; then
            echo "::error::Release $TAG is not visible yet"
            exit 1
          fi
          is_draft="$(jq -r '.isDraft' /tmp/release.json)"
          if [ "$is_draft" != "false" ]; then
            echo "::error::Release $TAG is still a draft; refusing to pin an unpublished toolchain."
            exit 1
          fi
          jq -r '.assets[].name' /tmp/release.json >/tmp/release-assets
          assets="$(wc -l < /tmp/release-assets | tr -d ' ')"
          if [ "$assets" -eq 0 ]; then
            echo "::error::Release $TAG has no uploaded assets yet; retry after release-tag completes."
            exit 1
          fi
          bash scripts/verify-arm64-release-assets.sh "$VERSION" /tmp/release-assets

          current="$(awk '
            /^\[[^]]+\]/ { section=$0 }
            section == "[seed]" && /^version[[:space:]]*=/ {
              gsub(/"/, "", $3); print $3; exit
            }
          ' bootstrap.toml)"
          if [ "$current" = "$VERSION" ]; then
            echo "[seed-pin] bootstrap.toml already pins $VERSION; nothing to do."
            exit 0
          fi

          branch="bot/cadence-seed-pin-v${VERSION}"
          pr_url="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // ""')"
          if [ -n "$pr_url" ]; then
            echo "[seed-pin] resuming smoke gate for existing PR: ${pr_url}"
          else
            remote_branch_sha="$(git ls-remote --heads origin "refs/heads/${branch}" | awk 'NR == 1 { print $1 }')"
            if [ -n "$remote_branch_sha" ]; then
              git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
              changed="$(git diff --name-only "origin/main...origin/${branch}" | sort)"
              expected_changed="$(printf '%s\n' bootstrap.toml compiler/capsule.toml workspace.toml | sort)"
              if [ "$changed" != "$expected_changed" ]; then
                echo "::error::Existing ${branch} changes unexpected files; refusing to reuse it."
                printf '%s\n' "$changed"
                exit 1
              fi

              read_remote_value() {
                file="$1"
                wanted_section="$2"
                wanted_key="$3"
                git show "origin/${branch}:${file}" | awk \
                  -v wanted_section="$wanted_section" \
                  -v wanted_key="$wanted_key" '
                    /^\[[^]]+\]/ { section=$0 }
                    section == wanted_section && $1 == wanted_key {
                      gsub(/"/, "", $3); print $3; exit
                    }
                  '
              }
              remote_seed="$(read_remote_value bootstrap.toml '[seed]' version)"
              remote_compiler_floor="$(read_remote_value compiler/capsule.toml '[toolchain]' sfn)"
              remote_workspace_floor="$(read_remote_value workspace.toml '[toolchain]' sfn)"
              if [ "$remote_seed" != "$VERSION" ] \
                || [ "$remote_compiler_floor" != "$VERSION" ] \
                || [ "$remote_workspace_floor" != "$VERSION" ]; then
                echo "::error::Existing ${branch} does not carry the expected ${VERSION} pin in all three manifests."
                exit 1
              fi
              echo "[seed-pin] reusing validated remote branch ${branch} at ${remote_branch_sha}"
            else
              git config user.name "Sailfin Release Bot"
              git config user.email "releases@sailfin.io"
              git checkout -b "$branch"

              tmp="$(mktemp)"
              awk -v v="$VERSION" '
                /^\[[^]]+\]/ { section=$0 }
                section == "[seed]" && /^version[[:space:]]*=/ {
                  sub(/"[^"]*"/, "\"" v "\"")
                }
                { print }
              ' bootstrap.toml > "$tmp"
              mv "$tmp" bootstrap.toml

              tmp="$(mktemp)"
              awk -v v="$VERSION" '
                /^\[[^]]+\]/ { section=$0 }
                section == "[toolchain]" && /^sfn[[:space:]]*=/ {
                  sub(/"[^"]*"/, "\"" v "\"")
                }
                { print }
              ' compiler/capsule.toml > "$tmp"
              mv "$tmp" compiler/capsule.toml

              # Keep the workspace-wide toolchain floor in lockstep with the
              # compiler member's floor. `workspace.toml [toolchain].sfn` (SFN-414)
              # is the default floor every member inherits; leaving it behind drifts
              # it from the adopted seed. Same rewrite as capsule.toml; `channel`
              # (a sibling key in the same section) is untouched.
              tmp="$(mktemp)"
              awk -v v="$VERSION" '
                /^\[[^]]+\]/ { section=$0 }
                section == "[toolchain]" && /^sfn[[:space:]]*=/ {
                  sub(/"[^"]*"/, "\"" v "\"")
                }
                { print }
              ' workspace.toml > "$tmp"
              mv "$tmp" workspace.toml

              git add bootstrap.toml compiler/capsule.toml workspace.toml
              if git diff --cached --quiet; then
                echo "[seed-pin] no changes after rewrite; skipping."
                exit 0
              fi

              git commit -m "chore(seed): pin cadence seed to ${VERSION}"
              git push -u origin "$branch"
            fi

            body="$(mktemp)"
            cat > "$body" <<EOF
          ## Summary

          Pins the compiler checkout seed from \`${current}\` to \`${VERSION}\` after the cadence alpha \`${TAG}\` published release assets.

          ## Notes

          - Updates \`bootstrap.toml [seed].version\`, the canonical compiler-checkout seed policy.
          - Updates \`compiler/capsule.toml [toolchain].sfn\` so the public toolchain floor tracks the adopted seed.
          - Updates \`workspace.toml [toolchain].sfn\` so the workspace-wide default floor stays in lockstep.

          ## Verification

          - \`gh release view ${TAG} --json assets,isDraft\` confirmed a published release with ${assets} asset(s).
          - \`scripts/verify-arm64-release-assets.sh ${VERSION} /tmp/release-assets\` confirmed the required native and installer ARM64 pair.
          EOF

            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(seed): pin cadence seed to ${VERSION}" \
              --body-file "$body")"
            echo "$pr_url"
          fi

          # Installer smoke is a path-filtered workflow rather than a branch-rule
          # requirement. Wait for its native ARM job explicitly before enabling
          # auto-merge, so the required CI aggregate cannot merge a pin while the
          # published installer/native-seed self-host is pending or red (SFN-799).
          arm_smoke_name="install (ubuntu-24.04-arm)"
          arm_smoke_buckets=""
          head_sha="$(gh pr view "$pr_url" --json headRefOid --jq '.headRefOid')"
          for attempt in $(seq 1 180); do
            arm_smoke_buckets="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs" \
              -f per_page=100 \
              -f filter=latest \
              --jq '[.check_runs[] | select(.name == "install (ubuntu-24.04-arm)") | if .status != "completed" then "pending" elif .conclusion == "success" then "pass" elif .conclusion == "cancelled" then "cancel" elif .conclusion == "skipped" then "skipping" else "fail" end] | unique | join(",")')"
            case "$arm_smoke_buckets" in
              *fail* | *cancel* | *skipping*)
                echo "::error::${arm_smoke_name} did not pass (bucket=${arm_smoke_buckets})."
                exit 1
                ;;
              *pending* | "")
                echo "[seed-pin] waiting for ${arm_smoke_name} (${attempt}/180; bucket=${arm_smoke_buckets:-not registered})"
                sleep 10
                ;;
              pass)
                echo "[seed-pin] ${arm_smoke_name} passed."
                break
                ;;
              *)
                echo "::error::${arm_smoke_name} returned unexpected bucket set: ${arm_smoke_buckets}"
                exit 1
                ;;
            esac
          done
          if [ "$arm_smoke_buckets" != "pass" ]; then
            echo "::error::Timed out waiting for ${arm_smoke_name}."
            exit 1
          fi

          # Required CI may still be running; GitHub auto-merge waits for that
          # branch-rule gate after the independent ARM installer smoke is green.
          # If auto-merge is unavailable, leave the PR open for manual merge.
          if gh pr merge "$pr_url" --auto --squash; then
            echo "[seed-pin] ARM smoke passed; auto-merge enabled for ${pr_url}."
            post_slack ":seedling: Sailfin seed-pin PR opened for ${VERSION} (ARM installer smoke green; auto-merge on required CI).\nPR: ${pr_url}\nRelease: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          else
            echo "::warning::Could not enable auto-merge for ${pr_url}; leaving it open for manual merge."
            post_slack ":seedling: Sailfin seed-pin PR opened for ${VERSION} — auto-merge unavailable, needs a manual merge.\nPR: ${pr_url}\nRelease: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          fi

      - name: Notify Slack on seed-pin failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SLACK_RELEASE_WEBHOOK_URL:-}" ]; then
            exit 0
          fi
          python3 - <<'PY' > /tmp/slack-payload.json
          import json
          import os
          tag = os.environ.get("TAG", "unknown")
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          print(json.dumps({
              "text": f":warning: Sailfin cadence seed-pin workflow failed for {tag}.\\nRun: {run_url}"
          }))
          PY
          curl -fsS -X POST \
            -H 'Content-type: application/json' \
            --data @/tmp/slack-payload.json \
            "$SLACK_RELEASE_WEBHOOK_URL" >/dev/null || true
        env:
          TAG: ${{ steps.version.outputs.tag }}
