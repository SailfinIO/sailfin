name: Nightly self-host check

# The triple-pass `sfn dev verify` gate is the only thing that catches
# compiler bugs baked into the first-pass binary (e.g. re-export
# miscompilations — see docs/rca/2026-04-18-reexport-diagnostic-gep.md).
# Per-PR CI is intentionally single-pass for speed; this job runs
# nightly and before a release to give us a clean self-hosting signal.
#
# Triggers:
#   - nightly at 07:00 UTC
#   - manual dispatch (use before cutting any release)
#   - when the release-tag workflow runs (see release-tag.yml)
#
# The pinned seed version lives in `bootstrap.toml`'s [seed].version key
# at the repo root. A setup step below reads that file (or uses the
# `seed_version` workflow_dispatch input when set) and exports the
# resolved value as `steps.seed.outputs.seed_version`. Kept in sync with
# ci.yml, release-branches.yml, and release-tag.yml — all three read the
# same `bootstrap.toml`. Bumping the seed is a one-line
# edit.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      seed_version:
        description: "Seed version (blank defaults to bootstrap.toml [seed].version from checkout)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly-selfhost
  cancel-in-progress: false

jobs:
  make-check:
    # Job id `make-check` is a required status check; kept as-is (Rule 0)
    # even though the step it runs is `sfn dev verify` now.
    name: sfn dev verify (triple-pass fixed point) [${{ matrix.package_label }}]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            package_label: linux-x86_64
            clang: clang-18
            # Strict self-host gate (#1830): a stage2/stage3 fixed-point
            # mismatch fails this leg instead of warn-and-promote.
            selfhost_strict: "1"
          # Trialing macos-26 ahead of the 2026-06-15 `macos-latest` migration:
          # nightly is the early-warning canary for fixed-point / determinism
          # breakage on the new image before CI and release jobs adopt it.
          #
          # Strict on macOS too (SFN-87 / #1726). It was warn-only because the
          # check could not pass: ld64 derives a Mach-O's ad-hoc code-signature
          # identifier from the linked output's basename, and the driver linked
          # stage2/stage3 to different basenames, so `binary_match` was
          # structurally unsatisfiable and every run reported a mismatch even
          # though all 240 module digests were identical. With both stages
          # linked to a common basename the fixed point is reached (binary
          # included), and `sfn selfhost` now gates strict on module-IR
          # divergence rather than the binary sha, which macOS packaging makes
          # an unreliable signal.
          - os: macos-26
            package_label: macos-arm64
            clang: clang
            selfhost_strict: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve seed version (input override → bootstrap.toml)
        id: seed
        shell: bash
        env:
          INPUT_SEED_VERSION: ${{ inputs.seed_version }}
        run: |
          set -euo pipefail
          override="$(printf '%s' "$INPUT_SEED_VERSION" | tr -d '[:space:]')"
          if [ -n "$override" ]; then
            echo "[seed-pin] using seed $override (workflow_dispatch input override)"
            pin="$override"
          else
            if [ ! -f bootstrap.toml ]; then
              echo "[seed-pin] bootstrap.toml is missing from checkout" >&2
              exit 1
            fi
            pin="$(awk '
              /^\[[^]]+\]/ { section=$0 }
              section == "[seed]" && /^version[[:space:]]*=/ { gsub(/"/, "", $3); print $3; exit }
            ' bootstrap.toml)"
            if [ -z "$pin" ]; then
              echo "[seed-pin] bootstrap.toml [seed].version is empty or missing" >&2
              exit 1
            fi
            echo "[seed-pin] using seed $pin from bootstrap.toml"
          fi
          echo "seed_version=$pin" >> "$GITHUB_OUTPUT"

      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with:
          packages: clang-18 llvm-18 jq

      - name: Install jq + LLVM tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install jq llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      # Recreate the Darwin `clang` PATH shim the retired build driver
      # installed at parse time. This job does not go through
      # `.github/actions/sailfin-build`, which carries its own copy, so
      # dropping `make` here dropped the shim with it.
      #
      # NOT redundant with SFN-1077: that made the compiler resolve its own
      # driver for the final *link* (`SAILFIN_CC`, backend.sfn:145), but the
      # released seed's own bootstrap and the compiler's Assemble role
      # (`build/clang_argv.sfn`) still invoke a bare `clang` off PATH. On a
      # Homebrew-LLVM runner that clang does not own the Darwin SDK/linker
      # contract and the link fails with `ld: library 'm' not found`.
      #
      # Placed after the Homebrew PATH prepend on purpose: `$GITHUB_PATH`
      # prepends, so Apple's clang lands ahead of Homebrew's -- the same
      # precedence the driver's `PATH := $(CLANG_SHIM_DIR):$(PATH)` gave.
      - name: Install Darwin clang shim
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cc="${SAILFIN_CC:-/usr/bin/clang}"
          shim="$PWD/build/.toolchain-shim"
          mkdir -p "$shim"
          if [ -x "$cc" ]; then
            ln -sf "$cc" "$shim/clang"
            echo "[clang-shim] $shim/clang -> $cc"
          else
            echo "[clang-shim] $cc absent — empty shim dir, harmless PATH prefix"
          fi
          echo "$shim" >> "$GITHUB_PATH"

      - name: Fetch released seed compiler
        id: seed_fetch
        uses: ./.github/actions/fetch-seed
        with:
          seed_version: ${{ steps.seed.outputs.seed_version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: sfn dev verify (first pass → seedcheck → stage3)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The retired `CLANG=` step env is deliberately NOT carried over as
          # `SAILFIN_CC`. `CLANG` only ever fed the retired `.ll`-compile path
          # (Makefile:85-87), so passing it here was already a no-op. Setting
          # `SAILFIN_CC` instead would NOT be one: it is consulted only when
          # host and target are both Darwin (backend.sfn:131-137), where it
          # overrides the preferred `/usr/bin/clang`. That would quietly point
          # the macOS leg at whatever `clang` leads PATH.
          SEED_BIN: ${{ steps.seed_fetch.outputs.seed_bin }}
          # #1830: SELFHOST_STRICT=1 makes a stage2/stage3 fixed-point
          # mismatch fatal. Both legs pass "1" -- macOS became strict too
          # (SFN-87 / #1726); see the matrix entry's own comment. Kept as a
          # matrix value rather than hardcoded so a leg can be relaxed
          # without touching this step.
          SELFHOST_STRICT: ${{ matrix.selfhost_strict }}
          # Pinned at step level, not inline on the build: `dev verify`'s
          # phase 1 re-runs the build itself, and `_dv_child_env` copies the
          # process environment -- an inline prefix would not reach it, so a
          # fingerprint miss would cold-rebuild against a different cache root.
          #
          # ABSOLUTE, never relative. That same `_dv_child_env` copy reaches
          # the `tests-seedcheck` phase, and `clean_runner_env` does not strip
          # this key, so e2e tests that pin a nested build's cwd to their own
          # scratch (`process.run_capture_cwd`) resolve a relative root
          # *inside* that scratch. The cache then publishes a second copy of
          # every staged module under `<scratch>/build/cache/<schema>/`,
          # which doubles any test that counts `.sfn-asm` under its scratch
          # and mints a cold private store per nested build. The retired
          # Makefile scoped this inline on the compiler build (`cd $(CURDIR)`),
          # so it never reached the test phases.
          SAILFIN_BUILD_CACHE_DIR: ${{ github.workspace }}/build/cache
        run: |
          set -euo pipefail
          # Two steps, mirroring what the retired `check` target did
          # (Makefile:587 then :591): the seed builds the compiler, and the
          # freshly built compiler — not the seed — drives verification.
          #
          # Driving with the seed would run the SEED's copy of the verify
          # orchestration, so any fix to that logic in this tree would be
          # silently ignored until the next seed cut. `dev verify` re-runs the
          # build as its own first phase, which the source fingerprint makes a
          # no-op here.
          "$SEED_BIN" dev bootstrap build

          # SELFHOST_STRICT has no native reader; it becomes the --strict flag.
          args=(dev verify)
          if [ "${SELFHOST_STRICT:-0}" = "1" ]; then args+=(--strict); fi
          build/bin/sfn "${args[@]}"

      # `find`, not `**`: macOS runners ship bash 3.2, which has no
      # `globstar`, so `shopt -s globstar` errored out and the recursive
      # glob silently matched nothing — on the one leg whose failures we
      # most need to read (SFN-375). The retry-log step never enabled
      # `globstar` at all, so its `**` degraded to a single level on both
      # platforms. `find -path` needs no shell option and behaves the same
      # on bash 3.2 and 5.x.
      - name: Surface non-empty phase_types diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          find build/selfhost -path '*/build/sailfin/.phase_types_diagnostics' -size +0c 2>/dev/null |
            while IFS= read -r f; do
              echo "== $f =="
              cat "$f"
            done

      - name: Surface retry-log entries
        if: always()
        shell: bash
        run: |
          set +e
          find build/selfhost -path '*/raw/retry_log.tsv' -size +0c 2>/dev/null |
            while IFS= read -r log; do
              echo "== $log =="
              cat "$log"
            done
