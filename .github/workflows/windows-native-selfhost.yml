# Windows Native Self-Host (M7/M8/M9 tier B) — the unconditional nightly
# fixed point.
#
# Executes SFEP-0021 milestones M7 (SFN-53) and M8 (SFN-54) on every push to
# `main` and once nightly: the `cross-seed` job rebuilds the mingw-cross
# bootstrap seed on Linux (there is no released native Windows seed yet —
# that is M11/SFN-57 — so per SFEP-0021 §4.3 the seed comes from `make
# ci-cross-windows`, uploaded under the same artifact name ci.yml's
# `build-compiler-linux` uses); `native-build` stages it and drives the SFN-53
# ladder plus the boot / check / run / R1 (try-throw) / R3 (struct-channel)
# ABI gates via the shared `.github/actions/sailfin-build-windows` composite,
# then runs the self-host fixed point: the native compiler rebuilds itself
# twice and pass-2 must be byte-identical to pass-1.
#
# This is SFN-55 (SFEP-0021 M9) tier B: the *unconditional* backstop to tier
# A's path-filtered `build-compiler-windows` job in `ci.yml`. Tier A only
# runs on PRs whose changed paths match the Windows filter (SFN-55 §4); this
# workflow runs on every push to `main` regardless of what changed, plus a
# daily cron, so a false negative in tier A's filter is caught within 24h
# instead of never.
name: Windows native self-host (fixed point)

# SFN-55 review A3: ci.yml sets this at workflow scope (`ci.yml:17`), so tier
# A builds under the arena allocator. Without the same pin here, tier B's
# fixed point proves determinism of the malloc path instead, and an
# arena-only Windows nondeterminism would be invisible to the one gate meant
# to catch it.
env:
  SAILFIN_USE_ARENA: "1"

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *" # after nightly-selfhost's 07:00
  workflow_dispatch:

# `push: main` and `schedule` both carry `github.ref = refs/heads/main`, so a
# group key on `github.ref` alone puts them in the SAME group — a merge
# landing every ~20 min would cancel the 08:00 cron mid-run, and the cron
# would cancel an in-flight push run, on a job that takes ~45-60 min. Either
# way the fixed point never finishes and the gate it exists to run never goes
# red. Keying on `github.event_name` too separates the two triggers into
# independent groups; `cancel-in-progress` is true for everything except
# `schedule` (`push` and `workflow_dispatch`), where superseding an in-flight
# run with the newest commit is still correct (SFN-55 review A1) — a burst of
# merges should still collapse to the latest push, just not at the cost of
# cancelling the nightly.
concurrency:
  group: windows-native-selfhost-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  # SFN-994 flipped `native-build` to bootstrap from the published native
  # seed, so nothing consumes this artifact any more. The job stays for its
  # other stated purpose — keeping `make ci-cross-windows` exercised nightly
  # (~2 min on a 1x ubuntu job) — and as the escape hatch: if a bad native
  # seed ever ships, `seed_source: cross` is still implemented and one line
  # away, and this job proves it still works.
  #
  # SFN-58 deletes both this job and the cross path together. Until then a
  # green run here is the evidence that retiring it is safe.
  cross-seed:
    name: Build mingw-cross bootstrap seed [linux]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve seed version from bootstrap.toml
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          pin="$(awk '
            /^\[[^]]+\]/ { section=$0 }
            section == "[seed]" && /^version[[:space:]]*=/ { gsub(/"/, "", $3); print $3; exit }
          ' bootstrap.toml)"
          [ -n "$pin" ] || { echo "[seed] bootstrap.toml [seed].version empty" >&2; exit 1; }
          echo "seed_version=$pin" >> "$GITHUB_OUTPUT"

      - name: Install clang + llvm (Linux)
        uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with:
          packages: clang-18 llvm-18 jq

      - name: Set CLANG env (Linux)
        shell: bash
        run: echo "CLANG=clang-18" >> "$GITHUB_ENV"

      - name: Build native compiler (self-host main)
        uses: ./.github/actions/sailfin-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: build-only
          target: linux-x86_64
          clang: clang-18
          seed_version: ${{ steps.seed.outputs.seed_version }}
          package: 'false'

      - name: Install MinGW-w64 cross-compiler (Linux)
        uses: ./.github/actions/apt-install
        timeout-minutes: 20
        with:
          packages: gcc-mingw-w64-x86-64
          no-install-recommends: 'true'

      - name: Verify MinGW-w64 cross-compiler (Linux)
        shell: bash
        run: x86_64-w64-mingw32-gcc --version | head -1

      - name: Cross-compile the bootstrap seed (Linux)
        shell: bash
        run: make ci-cross-windows

      # Named to match ci.yml's `build-compiler-linux` upload: the
      # `sailfin-build-windows` composite (used by both tier A in ci.yml and
      # this job) downloads `ci-installer-windows-x86_64` unconditionally,
      # so both callers can share one download step regardless of which
      # workflow produced the artifact.
      - name: Upload mingw-cross bootstrap seed
        uses: actions/upload-artifact@v7
        with:
          name: ci-installer-windows-x86_64
          path: dist/installer-windows-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1

  # No `needs: cross-seed` since SFN-994 — this job bootstraps from the
  # published native seed, so a cross-seed failure must not gate it. The two
  # now run in parallel; `notify-failure` still watches both.
  native-build:
    name: Native MSVC build from release seed [windows-2025]
    runs-on: windows-2025 # pinned, not `windows-latest` — SFN-55 Risk R3
    timeout-minutes: 90
    # The whole job runs with the Windows target seam active. SFN-52's
    # build_target_os() would also probe %SystemRoot% natively, but the
    # explicit override is the reliable selector (child processes may see
    # an empty env), and it documents intent.
    env:
      SAILFIN_TARGET_OS: Windows
    outputs:
      gate_name: ${{ steps.identify_gate.outputs.gate_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # SFN-994: bootstrap from the published native MSVC seed named by
      # `bootstrap.toml [seed].version`, signature- and digest-verified before
      # it is executed, rather than from a same-run mingw-cross artifact.
      #
      # This is the nightly, so it is the right leg to flip first: it proves
      # the native bootstrap daily without gating anything. `ci.yml`'s tier A
      # and `release-tag.yml`'s release leg stay on `cross` for now — which is
      # also what keeps both modes exercised while the cross path still exists.
      #
      # It is a real dependency change: this job can now fail because a
      # PUBLISHED asset is missing, unverifiable, or broken, not only because
      # this checkout is. That is the signal SFN-58 needs before retiring the
      # mingw path — a nightly that quietly fell back to `cross` would hide
      # exactly the failure that should block the retirement.
      - name: Build native Windows compiler
        id: build_windows
        uses: ./.github/actions/sailfin-build-windows
        with:
          seed_source: release

      # M8 (SFN-54): the native compiler self-hosts twice and pass-2 must be
      # byte-identical to pass-1. Mirrors the POSIX fixed-point gate
      # (`Fixed-point rebuild check (linux-x86_64)` in ci.yml): two
      # `--work-dir`-isolated builds, each with its own
      # `SAILFIN_TEST_SCRATCH` so pass-2's per-module `.ll` outputs cannot
      # clobber pass-1's, then `--no-cache` on both so the comparison is a
      # genuine re-emit rather than a cache hit.
      #
      # A byte compare is trustworthy here specifically because SFN-920
      # threads `/Brepro` through `lld-link` for MSVC targets — without it,
      # `lld-link` stamps a live epoch `TimeDateStamp` into the PE header on
      # every link, so two otherwise-identical builds diverge at the observed
      # byte 129 regardless of compiler determinism. Before SFN-920 this gate
      # would have been flaky.
      #
      # `/Brepro` does not cover an absolute path embedded in the image. If
      # `-g` / `/DEBUG` ever reaches the MSVC link, `lld-link` writes the PDB
      # path into the debug directory, and the two distinct `--work-dir`s
      # below turn from an isolation property into a guaranteed mismatch.
      #
      # Placed last, after the cheap R1/R3 ABI gates: this step is two full
      # native self-hosts of the ~281-module compiler, by far the most
      # expensive step in the job, so the fast gates should fail first and
      # leave this one uncharged.
      # 30 minutes is >2x the observed ~7 min/pass. Deliberately not 45:
      # the job's own 90-minute budget is already largely committed by the
      # staging/MSVC/ladder steps and the 30-minute build, and a step
      # timeout that outruns the job's remainder yields GitHub's generic
      # job cancellation instead of this step's own timeout message —
      # a worse diagnostic, not a wrong verdict.
      #
      # The two passes are a SEPARATE step from the comparison below on
      # purpose (SFN-1035). Both observed release-commit failures were
      # bootstrap-dispatch failures in pass 1 that never reached a byte
      # compare, yet were reported under a step named for a determinism
      # check — so triage started at "the compiler is non-deterministic"
      # when the compiler had not run. A step reports one verdict; these are
      # two.
      - name: Self-host pass 1 + pass 2 (native MSVC)
        id: selfhost_passes
        shell: bash
        timeout-minutes: 30
        env:
          # SFN-1035: a `chore(release): X` commit bumps
          # `compiler/capsule.toml` to X while `bootstrap.toml [seed].version`
          # still pins X-1 — the cadence seed-pin PR lands minutes to hours
          # later. Through that window `bootstrap_gate_or_dispatch`
          # (`compiler/src/cli/commands/dev.sfn:259`) sees running != pin and
          # takes the DISPATCH path on both passes below.
          #
          # Dispatch is not merely inconvenient here, it is wrong. This gate
          # exists to prove the binary built above self-hosts to a fixed
          # point; handing the build to the *previous release's* seed tests a
          # different compiler than the one under test. Windows fails loudly
          # instead of silently only by accident of `sfn_process_exec` being
          # a documented `-1` stub (`runtime/sfn/platform/process_windows.sfn`
          # — Windows has no `execve` image replacement), so the step died
          # with "failed to re-exec the pinned seed" on every release commit.
          #
          # This is not a new argument — the in-tree selfhost driver already
          # makes it. `_selfhost_stage_env`
          # (`compiler/src/cli_selfhost.sfn:299-312`) forces the same setting
          # on every `sfn selfhost` stage child, for the same window, and
          # states the consequence plainly: the gate "would otherwise fetch +
          # re-exec the seed here and subvert the self-host check while still
          # reporting green." This workflow step was the outlier; setting it
          # restores parity.
          #
          # That green-but-vacuous outcome is what POSIX would have produced
          # here. Under dispatch, pass 1 re-execs seed X-1; pass 2's driver
          # also carries the source version, so it dispatches to X-1 too, and
          # the byte compare degrades to comparing that one seed against
          # itself. Windows fails loudly instead only by accident of the stub.
          #
          # Unlike the composite's setting, this one has NO removal
          # condition, and the reason is mechanical rather than a judgement
          # call: `$NATIVE_SFN` is built from the working tree, so its version
          # tracks `compiler/capsule.toml` and never `bootstrap.toml
          # [seed].version`. SFN-57 and SFN-994 change which seed BUILDS
          # `$NATIVE_SFN`; they do not change `$NATIVE_SFN`'s own version, so
          # the skew window survives them intact. The composite's setting is
          # transitional. This one is structural.
          SAILFIN_BOOTSTRAP: "off"
        run: |
          set -euo pipefail
          # SFN-922: each pass writes into its own EMPTY directory, and that
          # is load-bearing. Under `-p` (`walk_src`), the binary that emits
          # all ~281 modules is not the one invoked here: `build.sfn:455`
          # resolves it via `_resolve_self_path(binary_dir)`, which probes
          # `sfn`/`sfn.exe`/`sailfin`/`sailfin.exe` inside `binary_dir` FIRST
          # and only falls back to `exe_path()` — the actually running binary
          # — when all four miss (SFN-904, `build/paths.sfn:226-234`).
          #
          # These outputs used to land in `build/bin/`. That happened to be
          # correct here only because nothing on this runner puts a
          # probe-matching name there; the same shape in `ci.yml` WAS wrong,
          # emitting both passes with `build/bin/sfn` (SFN-922). Correct by
          # accident is not correct, and folding this step into `ci.yml`
          # under SFN-55 would have inherited the accident.
          #
          # Not inside the work dirs either: `<work-dir>/sailfin` is the
          # cache directory (`build/cache.sfn:184-189`), the SFN-579 shape
          # the `!fs.is_directory` guard at `paths.sfn:201` catches.
          #
          # The `.exe` suffix on `-o` is load-bearing: an explicit `-o` is
          # honored verbatim (`build.sfn:346`, `build/target.sfn:234-236`),
          # and an extensionless image cannot be launched by `CreateProcessA`
          # with a null `lpApplicationName` (SFN-693), so pass 2 would fail
          # to spawn on Windows only.
          rm -rf build/selfhost/native-w1 build/selfhost/native-w2 \
                 build/selfhost/fp1 build/selfhost/fp2
          mkdir -p build/selfhost/native-w1 build/selfhost/native-w2 \
                   build/selfhost/fp1 build/selfhost/fp2
          SAILFIN_TEST_SCRATCH="build/selfhost/native-w1/scratch" \
            "$NATIVE_SFN" build --no-cache -p compiler \
              --work-dir build/selfhost/native-w1 \
              -o build/selfhost/fp1/sfn-selfhost1.exe
          # Assert the invariant above rather than trusting it: a
          # probe-matching name beside pass-1's output would send pass-2's
          # emit back through that binary and quietly re-vacuum the gate.
          for probe in sfn sfn.exe sailfin sailfin.exe; do
            if [ -e "build/selfhost/fp1/$probe" ]; then
              echo "[error] build/selfhost/fp1/$probe exists; pass-2 would emit with it, not with pass-1 (SFN-922)" >&2
              exit 1
            fi
          done
          SAILFIN_TEST_SCRATCH="build/selfhost/native-w2/scratch" \
            build/selfhost/fp1/sfn-selfhost1.exe build --no-cache -p compiler \
              --work-dir build/selfhost/native-w2 \
              -o build/selfhost/fp2/sfn-selfhost2.exe
          for f in build/selfhost/fp1/sfn-selfhost1.exe build/selfhost/fp2/sfn-selfhost2.exe; do
            [ -s "$f" ] || { echo "[error] pass artifact missing or empty: $f" >&2; exit 1; }
          done

      # Comparison only — the passes ran in the step above. Anything that
      # fails HERE is a genuine determinism break, which is what makes this
      # step name diagnostic rather than merely descriptive.
      #
      # No `SAILFIN_BOOTSTRAP` needed: this step runs no Sailfin toolchain.
      - name: Gate — self-host fixed point (pass-2 == pass-1)
        id: fixed_point
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ls -lh build/selfhost/fp1/sfn-selfhost1.exe build/selfhost/fp2/sfn-selfhost2.exe
          (sha256sum build/selfhost/fp1/sfn-selfhost1.exe build/selfhost/fp2/sfn-selfhost2.exe 2>/dev/null || shasum -a 256 build/selfhost/fp1/sfn-selfhost1.exe build/selfhost/fp2/sfn-selfhost2.exe || true)
          if ! cmp -s build/selfhost/fp1/sfn-selfhost1.exe build/selfhost/fp2/sfn-selfhost2.exe; then
            echo "[error] fixed-point mismatch: pass-2 differs from pass-1" >&2
            cmp -l build/selfhost/fp1/sfn-selfhost1.exe build/selfhost/fp2/sfn-selfhost2.exe | head -n 20 || true
            exit 1
          fi
          echo "ok: native MSVC self-host fixed point (pass-2 == pass-1)"

      # SFN-57 / SFEP-0021 M11: package the fixed-point-proven binary as a
      # native MSVC installer archive every night, so the release-tag.yml
      # native leg has a continuously-exercised sequence to model rather than
      # a first-of-its-kind one. This is deliberately downstream of the
      # fixed-point gate above, not the build step: the mandate is publishing
      # a *proven* seed, and the fixed point is what proves this binary
      # self-hosts deterministically before anything gets packaged from it.
      #
      # `--compiler-bin` is required: `sfn package` defaults to
      # `build/bin/sfn`, but the Stage 2 build step above lands the native
      # binary under `build/capsules/sfn/compiler/bin/compiler.exe`
      # (`sailfin-build-windows/action.yml`'s locate step) and exports that
      # path as `$NATIVE_SFN`.
      - name: Package native MSVC installer
        id: package_installer
        shell: bash
        run: |
          set -euo pipefail
          "$NATIVE_SFN" package --installer --target windows-x86_64-msvc --compiler-bin "$NATIVE_SFN"
          ls -la dist/installer-windows-x86_64-msvc.tar.gz

      # Named to NOT match the `release-*` pattern release-tag.yml's
      # "Download build artifacts" step filters on — this nightly artifact
      # must never be picked up by a release run; only release-tag.yml's own
      # native leg produces the asset that actually ships.
      - name: Upload native MSVC installer (nightly, not a release asset)
        id: upload_installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-msvc-installer-nightly
          path: dist/installer-windows-x86_64-msvc.tar.gz
          if-no-files-found: error
          retention-days: 7

      # SFN-55 review A2: `notify-failure` needs a gate name to file the
      # regression issue under. `gate` becomes the issue title, and open
      # issues dedup on that title, so a value is a PERMANENT anchor: renaming
      # one later splits the dedup and orphans whatever issue still carries
      # the old title. Each value should name a distinct failure mode, in
      # words that cannot be misread.
      #
      # Four values, and every step that can fail maps to exactly one:
      #
      #   windows-selfhost-passes  the compiler did not self-host (SFN-1035)
      #   windows-fixed-point      it self-hosted twice and the two differed
      #   windows-native-package   the installer was not produced or uploaded
      #   windows-native-build     anything earlier — seed staging, the
      #                            ladder, the Stage 2 build, an ABI gate
      #
      # `windows-fixed-point` means only what its name says now. Before
      # SFN-1035 split the two builds out, a run that never produced a second
      # binary still filed under the determinism title.
      #
      # `windows-native-build` is a catch-all, so nothing that can fail may be
      # left unchecked above it or it lands there and misdirects triage at the
      # compiler build. That is why the upload step carries an id: it runs
      # AFTER packaging, so it is not covered by "anything earlier", and a
      # failed upload — `if-no-files-found: error`, or a transient 5xx — is a
      # missing installer rather than a broken compiler.
      - name: Identify failed gate
        id: identify_gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Ordered most-specific first: `selfhost_passes` is checked before
          # `fixed_point` because a failed passes step leaves `fixed_point`
          # skipped, not failed, and a skipped step must not read as a pass.
          # Quoting is load-bearing: a step that never ran yields '', and an
          # unquoted `[ = "failure" ]` would be a syntax error, not a false.
          if [ "${{ steps.selfhost_passes.outcome }}" = "failure" ]; then
            gate=windows-selfhost-passes
          elif [ "${{ steps.fixed_point.outcome }}" = "failure" ]; then
            gate=windows-fixed-point
          elif [ "${{ steps.package_installer.outcome }}" = "failure" ] \
            || [ "${{ steps.upload_installer.outcome }}" = "failure" ]; then
            gate=windows-native-package
          else
            gate=windows-native-build
          fi
          echo "gate_name=$gate" >> "$GITHUB_OUTPUT"

  # SFN-55 review A2: without this, A1's fix (letting the fixed point survive
  # to a genuine red/green result instead of being cancelled every ~20 min)
  # still fails into a void — a nightly nobody reads is the same rot this
  # issue exists to close. Instantiates `build-quality.yml`'s existing
  # mechanism (`:621-869`) rather than inventing a second one; adapted to
  # this workflow's two-job shape (no separate cache-warmer job) instead of
  # build-quality's three-gate one. Triage runbook:
  # `docs/runbooks/windows-native.md`.
  notify-failure:
    name: Open regression issue + PR comment on failure
    needs: [cross-seed, native-build]
    # `always()`, not `!cancelled()`: a `timeout-minutes` expiry on the
    # job-level 90-minute caps (either `cross-seed` or `native-build`)
    # surfaces as a `cancelled` job conclusion — a step-level timeout (the
    # fixed-point step's own 30 min) instead marks the step and the job
    # `failure`, already caught by the `== 'failure'` disjuncts below without
    # needing `always()`. After A1, a job-level cancellation is the single
    # most likely failure signal this workflow can produce, and
    # `!cancelled()` would suppress it (copied verbatim from
    # `build-quality.yml:632-638`). `cross-seed` gets the same `cancelled`
    # disjunct as `native-build`: it carries its own 90-minute timeout and
    # does real work (a full Linux self-host + `make ci-cross-windows`), and
    # without it a `cross-seed` cancellation leaves `native-build` `skipped`
    # — no disjunct holds, and nothing is filed (SFN-55 review, round 2).
    if: >-
      always() &&
      (needs.cross-seed.result == 'failure' ||
       needs.cross-seed.result == 'cancelled' ||
       needs.native-build.result == 'failure' ||
       needs.native-build.result == 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Elevated beyond the workflow-level `contents: read` (`:52-53`) —
    # `gh issue create`/`gh pr comment` need `issues: write` and
    # `pull-requests: write`, and the classify step below queries the Actions
    # API (`actions: read`) — omitted in round 1, which meant every
    # cancellation the `always()` comment above calls out as "the single most
    # likely failure signal" hit a 403 under `set -euo pipefail`, aborted the
    # classify step, and silently filed nothing (SFN-55 review, round 2).
    # Scoped to this job alone so the two build jobs stay minimally
    # privileged.
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    env:
      GATE_NAME: ${{ needs.native-build.outputs.gate_name != '' && needs.native-build.outputs.gate_name || 'windows-native-build' }}
      FAIL_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EVENT_NAME: ${{ github.event_name }}
      REF: ${{ github.ref }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # A1 puts every `push` run (and every `workflow_dispatch` run) to
      # `main` in one concurrency group with `cancel-in-progress: true`, so a
      # newer push legitimately cancels an older still-running one — expected
      # coalescing, not a regression. Distinguish that from a genuine
      # timeout/host cancellation by checking whether a newer run of the same
      # event type has since started: if so, this run was superseded: if this
      # is still the newest run of its event type, the cancellation is real.
      - name: Classify cancellation (supersede vs timeout)
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          report=true
          if [ "${{ needs.cross-seed.result }}" != "failure" ] &&
             [ "${{ needs.native-build.result }}" != "failure" ] &&
             { [ "${{ needs.cross-seed.result }}" = "cancelled" ] ||
               [ "${{ needs.native-build.result }}" = "cancelled" ]; }; then
            # `branch=main` matches `push`/`schedule` (always `main`), but
            # `workflow_dispatch` can run on any ref — strip the `refs/heads/`
            # prefix so a manual dispatch from a feature branch compares
            # against the latest run of that SAME branch, not main's.
            branch="${REF#refs/heads/}"
            latest_run_id="$(gh api \
              "/repos/${REPO}/actions/workflows/windows-native-selfhost.yml/runs?event=${EVENT_NAME}&branch=${branch}&per_page=1" \
              --jq '.workflow_runs[0].id // empty')"
            if [ -n "$latest_run_id" ] && [ "$latest_run_id" != "$RUN_ID" ]; then
              report=false
              echo "[notify] superseded by run ${latest_run_id}; expected concurrency coalescing, no regression notification"
            else
              echo "[notify] this is the latest ${EVENT_NAME} run on ${branch} and still cancelled; reporting as a genuine cancellation/timeout"
            fi
          fi
          echo "report=${report}" >> "$GITHUB_OUTPUT"

      - name: Open or append regression issue
        id: regression_issue
        if: steps.classify.outputs.report == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gate="${GATE_NAME}"
          title="windows-native regression: ${gate}"

          existing="$(gh issue list \
            --repo "$REPO" \
            --state open \
            --label windows-native-regression \
            --limit 100 \
            --json number,title \
            --jq "[.[] | select(.title == \"${title}\")] | .[0].number // empty")"

          {
            echo "**Failure run:** ${RUN_URL}"
            echo "**Commit:** \`${FAIL_SHA}\`"
            echo "**Event:** \`${EVENT_NAME}\` on \`${REF}\`"
            echo "**Gate:** \`${gate}\`"
            echo "**cross-seed result:** \`${{ needs.cross-seed.result }}\`"
            echo "**native-build result:** \`${{ needs.native-build.result }}\`"
          } > regression-body.md

          if [ -n "$existing" ]; then
            echo "[notify] appending comment to existing regression issue #${existing}"
            gh issue comment "$existing" --repo "$REPO" --body-file regression-body.md
            echo "number=$existing" >> "$GITHUB_OUTPUT"
          else
            {
              echo "# windows-native regression: ${gate}"
              echo ""
              echo "The \`windows-native-selfhost.yml\` gate (SFN-55 tier B) failed on \`${gate}\`. This issue tracks the regression and aggregates additional failures via comments — see \`docs/runbooks/windows-native.md\` for the triage runbook."
              echo ""
              echo "## Latest failure"
              echo ""
              cat regression-body.md
            } > regression-new-body.md
            new_number="$(gh issue create \
              --repo "$REPO" \
              --title "$title" \
              --label "area:architecture" \
              --label "windows-native-regression" \
              --body-file regression-new-body.md \
              | awk -F/ '/^https:/{print $NF}')"
            echo "[notify] opened new regression issue #${new_number}"
            echo "number=$new_number" >> "$GITHUB_OUTPUT"
          fi

      # Per §6: PR comment only on `push: main` events. `schedule` and
      # `workflow_dispatch` runs aren't tied to a single merging PR.
      - name: Comment on merging PR
        if: >-
          steps.classify.outputs.report == 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          issue_number="${{ steps.regression_issue.outputs.number }}"
          pr_number="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/commits/${FAIL_SHA}/pulls" \
            --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            echo "[notify] no merging PR found for ${FAIL_SHA}; skipping PR comment"
            exit 0
          fi
          echo "[notify] commenting on merging PR #${pr_number}"
          {
            echo "windows-native-selfhost gate failed on this merge: \`${GATE_NAME}\`."
            echo ""
            echo "- Tracking issue: #${issue_number}"
            echo "- Failing run: ${RUN_URL}"
            echo "- Runbook: \`docs/runbooks/windows-native.md\`"
          } > pr-comment.md
          gh pr comment "$pr_number" --repo "$REPO" --body-file pr-comment.md
