# Windows Native Self-Host (M7/M8) — exploratory bootstrap harness.
#
# Executes SFEP-0021 milestone M7 (SFN-53): produce the first *native
# MSVC-ABI* Sailfin compiler on a `windows-latest` runner and prove it
# boots. There is no released native Windows seed yet (that is M11), so
# per SFEP-0021 §4.3 the bootstrap seed is the mingw-cross exe, which can
# only be produced on Linux — hence two jobs:
#
#   cross-seed   (ubuntu)  — self-host main + `make ci-cross-windows` →
#                            the mingw-cross sailfin.exe (bootstrap seed).
#   native-build (windows) — run `<cross-exe> build -p compiler` with
#                            SAILFIN_TARGET_OS=Windows (the target seam
#                            SFN-52 already wired), then --version / check
#                            / R1 (try-throw) / R3 (struct-channel) gates,
#                            then milestone M8 (SFN-54): the native compiler
#                            rebuilds itself twice and pass-2 must be
#                            byte-identical to pass-1 (self-host fixed point).
#
# This is a manual/dispatch harness, not the permanent CI job (that is
# M9/SFN-55). It is expected to iterate: the deepest unknowns are R1
# (`setjmp` symbol binding under MSVC UCRT) and R3 (struct-by-value ABI),
# plus the UCRT/stub link surface — all of which only a real native link
# surfaces. Keep it dispatchable until M7 is green, then fold into M9.
name: Windows Native Self-Host (M7)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/sfn-53-windows-native-runner

# One run per ref. The native leg carries a 90-minute timeout on a
# `windows-latest` runner (billed at 2x), so without this a burst of
# pushes leaves every superseded run grinding to its own timeout in
# parallel — three concurrent runs of a harness whose whole purpose is to
# report on the newest commit.
concurrency:
  group: windows-native-selfhost-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-seed:
    name: Build mingw-cross bootstrap seed [linux]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve seed version from bootstrap.toml
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          pin="$(awk '
            /^\[[^]]+\]/ { section=$0 }
            section == "[seed]" && /^version[[:space:]]*=/ { gsub(/"/, "", $3); print $3; exit }
          ' bootstrap.toml)"
          [ -n "$pin" ] || { echo "[seed] bootstrap.toml [seed].version empty" >&2; exit 1; }
          echo "seed_version=$pin" >> "$GITHUB_OUTPUT"

      - name: Install clang + llvm (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 jq
          echo "CLANG=clang-18" >> "$GITHUB_ENV"

      - name: Build native compiler (self-host main)
        uses: ./.github/actions/sailfin-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: build-only
          target: linux-x86_64
          clang: clang-18
          seed_version: ${{ steps.seed.outputs.seed_version }}
          package: 'false'

      - name: Install MinGW-w64 cross-compiler (Linux)
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc --version | head -1

      - name: Cross-compile the bootstrap seed (Linux)
        shell: bash
        run: make ci-cross-windows

      - name: Upload mingw-cross bootstrap seed
        uses: actions/upload-artifact@v7
        with:
          name: windows-cross-seed
          path: dist/installer-windows-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1

  native-build:
    name: Native MSVC build from cross seed [windows-latest]
    needs: cross-seed
    runs-on: windows-latest
    timeout-minutes: 90
    # The whole job runs with the Windows target seam active. SFN-52's
    # build_target_os() would also probe %SystemRoot% natively, but the
    # explicit override is the reliable selector (child processes may see
    # an empty env), and it documents intent.
    env:
      SAILFIN_TARGET_OS: Windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download mingw-cross bootstrap seed
        uses: actions/download-artifact@v8
        with:
          name: windows-cross-seed
          path: seed-dl

      - name: Stage the bootstrap seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p seed
          tar -xzf seed-dl/installer-windows-x86_64.tar.gz -C seed
          EXE="$(find "$PWD/seed" -name sailfin.exe | head -1)"
          [ -n "$EXE" ] || { echo "sailfin.exe not found in bootstrap seed" >&2; exit 1; }
          echo "SEED_EXE=$EXE" >> "$GITHUB_ENV"
          echo "staged seed: $EXE"
          "$EXE" --version || true

      - name: Set up MSVC developer environment (UCRT + libs on PATH/LIB/INCLUDE)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure LLVM (clang + lld-link) present
        shell: bash
        run: |
          set -euo pipefail
          # windows-latest ships LLVM; surface the versions the native link
          # will use so a toolchain mismatch is visible in the log.
          clang --version | head -1
          lld-link --version || true
          echo "clang: $(command -v clang)"

      # ── Staircase (SFN-53) ────────────────────────────────────────
      # Four cheap rungs before the 281-module self-host, each proving
      # one capability and each bounded by its own `timeout`.
      #
      # Why: four consecutive runs reached the 90-minute job timeout in
      # the self-host step having emitted ZERO bytes, so every attempt
      # cost 90 minutes and distinguished nothing — not a hang from a
      # slow build, not a broken seed from a broken fan-out. Jumping
      # straight to the hardest possible task made every failure
      # maximally expensive and minimally informative.
      #
      # Each rung isolates one layer, so the first one that fails names
      # the culprit directly:
      #   1 boots        — the mingw-cross exe runs under UCRT at all
      #   2 frontend     — parse/typecheck/effects, fully in-process
      #   3 one module   — emit -> clang -> lld-link, ONE child spawn
      #   4 the artifact — the binary it produced actually executes
      # Rung 3 is the sharp one: it is the smallest possible exercise of
      # emit -> compile -> link for a single module.
      #
      # The rungs were written against a "the self-host hangs on Windows"
      # hypothesis. That hypothesis was wrong: measurement on a native
      # Windows host found no hang at all. Every `s[i]` re-derived the
      # string's length with a full `strnlen`, which made lowering
      # quadratic — 47M scans totalling 243 GB for ONE module — and
      # Windows merely lacked the SIMD `strnlen` that hides the same cost
      # on Linux. The self-host was running correctly the whole time, just
      # ~20x slower than the job timeout allowed, and printing nothing.
      # The ladder is kept because bounded rungs beat one 90-minute
      # all-or-nothing step regardless of what is being diagnosed.
      #
      # `continue-on-error` so a failed rung still lets later rungs run
      # and report — one run then yields the whole ladder's shape
      # instead of only its first break.
      - name: "Rung 1 — seed boots (--version)"
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          timeout 60 "$SEED_EXE" --version; echo "rung1 exit=$?"

      - name: "Rung 2 — seed frontend check (hello-world)"
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          timeout 120 "$SEED_EXE" check examples/basics/hello-world.sfn; echo "rung2 exit=$?"

      - name: "Rung 3 — seed builds ONE module (emit -> clang -> lld-link)"
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          # The single most diagnostic step in the workflow: one child
          # spawn, one link. SAILFIN_BUILD_JOBS=1 pins the serial path so
          # a failure here is not confounded by the parallel pool.
          SAILFIN_BUILD_JOBS=1 timeout 600 "$SEED_EXE" build examples/basics/hello-world.sfn -o hello.exe
          echo "rung3 exit=$?"
          ls -la hello.exe || true

      - name: "Rung 4 — run the produced binary"
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -f hello.exe ]; then timeout 60 ./hello.exe; echo "rung4 exit=$?";
          else echo "rung4 skipped — rung 3 produced no binary"; fi

      - name: Native MSVC build of the compiler (Stage 2)
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # Call the seed directly rather than `make rebuild` — the
          # GnuWin32 make on windows-latest is too old (SFEP-0021 §4.4),
          # and `build -p compiler` is exactly what `make rebuild` shells
          # (Makefile rebuild-impl). SAILFIN_TARGET_OS=Windows drives the
          # SFN-52 target seam (MSVC triple, lld-link, POSIX-lib drop,
          # process_windows.sfn swap).
          #
          # The build driver emits no progress output: a full self-host
          # prints under 1 KB, all of it at exit (measured on both Linux
          # and Windows). A working build and a hung one are therefore
          # byte-identical to a watcher, and a timeout kill leaves no
          # diagnostic whatsoever — run 30166490718 logged ZERO bytes
          # between this step opening and its cancellation 90 minutes
          # later, which is what made the native leg so expensive to
          # iterate on remotely. Count emitted artifacts on an interval
          # so a slow build reads as slow and a stuck one as stuck. Drop
          # this once the driver reports progress natively.
          (
            # `set +e` is load-bearing: the subshell inherits `set -e` from
            # the step, so any single failing command inside the loop would
            # kill the heartbeat silently and restore the exact zero-output
            # condition it exists to prevent.
            set +e
            while :; do
              sleep 30
              printf '[heartbeat] %s sfn-asm=%s ll=%s o=%s\n' \
                "$(date -u +%H:%M:%S)" \
                "$(find build -name '*.sfn-asm' 2>/dev/null | wc -l)" \
                "$(find build -name '*.ll' 2>/dev/null | wc -l)" \
                "$(find build -name '*.o' 2>/dev/null | wc -l)"
            done
          ) &
          heartbeat_pid=$!
          # Kill the subshell, and its in-flight `sleep` where the tooling
          # allows: a survivor inherits this step's stdout and can hold the
          # step open. `pkill` is absent from Git for Windows' bundled msys
          # set, so the child reap is best-effort — killing the subshell
          # alone still bounds any delay at one sleep interval.
          trap 'pkill -P "$heartbeat_pid" 2>/dev/null || true; kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          "$SEED_EXE" build -p compiler
          echo "--- locating native-built compiler ---"
          OUT=""
          for c in build/capsules/sfn/compiler/bin/compiler.exe build/capsules/sfn/compiler/bin/compiler build/bin/sfn.exe build/bin/sfn; do
            if [ -f "$c" ]; then OUT="$PWD/$c"; break; fi
          done
          [ -n "$OUT" ] || { echo "native-built compiler not found under build/" >&2; ls -R build | head -50; exit 1; }
          echo "NATIVE_SFN=$OUT" >> "$GITHUB_ENV"
          echo "native compiler: $OUT"

      - name: Gate — boots and prints version
        shell: bash
        run: |
          set -euo pipefail
          out="$("$NATIVE_SFN" --version)"
          echo "version: $out"
          case "$out" in
            "sfn "*) echo "ok: native MSVC compiler boots" ;;
            *) echo "FAIL: unexpected --version output: $out" >&2; exit 1 ;;
          esac

      - name: Gate — frontend check (hello-world)
        shell: bash
        run: |
          set -euo pipefail
          "$NATIVE_SFN" check examples/basics/hello-world.sfn
          echo "ok: check passed"

      - name: Gate — end-to-end run (hello-world)
        shell: bash
        run: |
          set -euo pipefail
          "$NATIVE_SFN" run examples/basics/hello-world.sfn
          echo "ok: hello-world ran"

      - name: Gate R1 — try/throw (setjmp/longjmp under MSVC UCRT)
        shell: bash
        run: |
          set -euo pipefail
          "$NATIVE_SFN" run examples/basics/try-catch-finally.sfn
          echo "ok: R1 try/throw ran"

      - name: Gate R3 — struct-channel round-trip (Microsoft x64 struct ABI)
        shell: bash
        run: |
          set -euo pipefail
          "$NATIVE_SFN" run examples/concurrency/channels.sfn
          echo "ok: R3 struct-channel ran"

      # M8 (SFN-54): the native compiler self-hosts twice and pass-2 must be
      # byte-identical to pass-1. Mirrors the POSIX fixed-point gate
      # (`Fixed-point rebuild check (linux-x86_64)` in ci.yml): two
      # `--work-dir`-isolated builds, each with its own
      # `SAILFIN_TEST_SCRATCH` so pass-2's per-module `.ll` outputs cannot
      # clobber pass-1's, then `--no-cache` on both so the comparison is a
      # genuine re-emit rather than a cache hit.
      #
      # A byte compare is trustworthy here specifically because SFN-920
      # threads `/Brepro` through `lld-link` for MSVC targets — without it,
      # `lld-link` stamps a live epoch `TimeDateStamp` into the PE header on
      # every link, so two otherwise-identical builds diverge at byte 129
      # regardless of compiler determinism. That base branch is why this gate
      # is safe to add now and would have been flaky before it.
      #
      # Placed last, after the cheap R1/R3 ABI gates: this step is two full
      # native self-hosts of the ~281-module compiler, by far the most
      # expensive step in the job, so the fast gates should fail first and
      # leave this one uncharged.
      - name: Gate — self-host fixed point (pass-2 == pass-1)
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          rm -rf build/selfhost/native-w1 build/selfhost/native-w2
          mkdir -p build/selfhost/native-w1 build/selfhost/native-w2
          SAILFIN_TEST_SCRATCH="build/selfhost/native-w1/scratch" \
            "$NATIVE_SFN" build --no-cache -p compiler \
              --work-dir build/selfhost/native-w1 \
              -o build/bin/sfn-selfhost1.exe
          SAILFIN_TEST_SCRATCH="build/selfhost/native-w2/scratch" \
            build/bin/sfn-selfhost1.exe build --no-cache -p compiler \
              --work-dir build/selfhost/native-w2 \
              -o build/bin/sfn-selfhost2.exe
          for f in build/bin/sfn-selfhost1.exe build/bin/sfn-selfhost2.exe; do
            [ -f "$f" ] || { echo "[error] expected pass artifact missing: $f" >&2; exit 1; }
          done
          ls -lh build/bin/sfn-selfhost1.exe build/bin/sfn-selfhost2.exe
          (sha256sum build/bin/sfn-selfhost1.exe build/bin/sfn-selfhost2.exe 2>/dev/null || shasum -a 256 build/bin/sfn-selfhost1.exe build/bin/sfn-selfhost2.exe)
          if ! cmp -s build/bin/sfn-selfhost1.exe build/bin/sfn-selfhost2.exe; then
            echo "[error] fixed-point mismatch: pass-2 differs from pass-1" >&2
            cmp -l build/bin/sfn-selfhost1.exe build/bin/sfn-selfhost2.exe | head -n 20 || true
            exit 1
          fi
          echo "ok: native MSVC self-host fixed point (pass-2 == pass-1)"
