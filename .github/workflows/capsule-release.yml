name: Capsule Release

on:
  push:
    branches: [main]
    paths:
      - 'capsules/**'
      - 'stdlib/**'
      - 'runtime/prelude.sfn'
      - 'workspace.toml'

concurrency:
  group: capsule-release
  cancel-in-progress: false

jobs:
  release:
    name: Detect, Version & Publish Capsules
    if: >-
      github.event.head_commit.author.name != 'Sailfin Release Bot' &&
      !contains(github.event.head_commit.message, '[skip capsule-release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git credentials
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          git config user.name "Sailfin Release Bot"
          git config user.email "releases@sailfin.io"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Install Sailfin CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/SailfinIO/sailfin/main/install.sh | bash

      - name: Detect changed capsules and publish
        env:
          SFN_TOKEN: ${{ secrets.SFN_TOKEN }}
        run: |
          set -euo pipefail

          # Get the commit range for this push
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          # If this is the first push (before is all zeros), compare against parent
          if echo "$BEFORE" | grep -qE '^0+$'; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          echo "Comparing $BEFORE..$AFTER"

          # Select publishable library members by canonical workspace identity,
          # across current, transitional, and final SFEP-0072 roots.
          changed_capsules=()
          changed_manifests=()
          changed_external_entries=()
          public_count=0
          diff_status="${RUNNER_TEMP}/capsule-release-name-status"
          before_public="${RUNNER_TEMP}/capsule-release-before-public"
          git diff --name-status --find-renames=50% "$BEFORE".."$AFTER" > "$diff_status"
          inventory_script="$PWD/scripts/module_layout_fingerprint.sh"
          topology_classifier="$PWD/scripts/capsule-release-topology-only.sh"
          before_root="$(mktemp -d "${RUNNER_TEMP}/capsule-release-before.XXXXXX")"
          before_tree="$before_root/tree"
          cleanup_before_tree() {
            git worktree remove --force "$before_tree" >/dev/null 2>&1 || true
            rm -rf "$before_root"
          }
          trap cleanup_before_tree EXIT
          git worktree add --detach "$before_tree" "$BEFORE" >/dev/null
          (cd "$before_tree" && bash "$inventory_script" --public-members) > "$before_public"
          if [ ! -s "$before_public" ]; then
            echo "::error::Previous workspace inventory contains no publishable library capsules."
            exit 1
          fi
          cleanup_before_tree
          trap - EXIT

          while IFS=$'\t' read -r capsule_name capsule_dir external_entry; do
            public_count=$((public_count + 1))
            capsule_changed=false
            while IFS=$'\t' read -r status old_path new_path; do
              touches=false
              case "$old_path" in "$capsule_dir"|"$capsule_dir"/*) touches=true ;; esac
              case "$new_path" in "$capsule_dir"|"$capsule_dir"/*) touches=true ;; esac
              if [ -n "$external_entry" ]; then
                if [ "$old_path" = "$external_entry" ] || [ "$new_path" = "$external_entry" ]; then touches=true; fi
              fi
              if [ "$touches" = false ]; then continue; fi

              # Manifest-only edits are release metadata, not source changes.
              if { [ "$old_path" = "$capsule_dir/capsule.toml" ] || [ -z "$old_path" ]; } && \
                 { [ "$new_path" = "$capsule_dir/capsule.toml" ] || [ -z "$new_path" ]; }; then
                continue
              fi

              # A same-identity relocation with the same capsule-relative path
              # is topology work, not a semantic capsule release. Lower-
              # similarity renames are exempt only when their sole byte change
              # is the required old-member-root -> new-member-root path rewrite.
              if bash "$topology_classifier" "$BEFORE" "$AFTER" \
                "$before_public" "$capsule_name" "$capsule_dir" \
                "$status" "$old_path" "$new_path"; then
                continue
              fi
              capsule_changed=true
              break
            done < "$diff_status"
            if [ "$capsule_changed" = true ]; then
              changed_capsules+=("$capsule_dir")
              changed_manifests+=("$capsule_dir/capsule.toml")
              changed_external_entries+=("$external_entry")
            fi
          done < <(bash scripts/module_layout_fingerprint.sh --public-members)
          if [ "$public_count" -eq 0 ]; then
            echo "::error::Workspace inventory contains no publishable library capsules."
            exit 1
          fi

          if [ ${#changed_capsules[@]} -eq 0 ]; then
            echo "No capsule source changes detected, skipping."
            exit 0
          fi

          echo "Changed capsules: ${changed_capsules[*]}"

          committed=false

          for capsule_index in "${!changed_capsules[@]}"; do
            capsule_dir="${changed_capsules[$capsule_index]}"
            external_entry="${changed_external_entries[$capsule_index]}"
            capsule_name="$(grep -oP '^name\s*=\s*"\K[^"]+' "$capsule_dir/capsule.toml")"
            echo "::group::Processing $capsule_name ($capsule_dir)"

            # Get commits that touched this capsule's source files (excluding capsule.toml)
            commit_paths=("$capsule_dir")
            if [ -n "$external_entry" ]; then commit_paths+=("$external_entry"); fi
            commits="$(git log "$BEFORE".."$AFTER" --format='%s' -- \
              "${commit_paths[@]}" ":(exclude)$capsule_dir/capsule.toml" || true)"

            if [ -z "$commits" ]; then
              echo "No relevant commits for $capsule_name, skipping."
              echo "::endgroup::"
              continue
            fi

            echo "Commits touching $capsule_name:"
            echo "$commits"

            # Determine bump type from conventional commits
            bump="patch"
            if echo "$commits" | grep -qiE '^[a-z]+(\(.+\))?!:'; then
              bump="major"
            elif echo "$commits" | grep -qiE '^feat(\(.+\))?:'; then
              bump="minor"
            fi

            echo "Bump type: $bump"

            # Read current version
            current_version="$(grep -oP '^version\s*=\s*"\K[^"]+' "$capsule_dir/capsule.toml")"
            echo "Current version: $current_version"

            # Bump version
            IFS='.' read -r major minor patch <<< "$current_version"
            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            new_version="${major}.${minor}.${patch}"
            echo "New version: $new_version"

            # Update capsule.toml
            sed -i "s/^version = \"$current_version\"/version = \"$new_version\"/" "$capsule_dir/capsule.toml"

            # Publish. Treat an "already exists" (HTTP 409) as success: a prior run
            # published this version but lost the push race below, so the bump never
            # landed in git. Committing the bump now resyncs git with the registry
            # instead of hard-failing every subsequent run.
            echo "Publishing $capsule_name@$new_version..."
            if publish_out="$(cd "$capsule_dir" && sailfin publish 2>&1)"; then
              echo "$publish_out"
            elif echo "$publish_out" | grep -qiE 'already exists|HTTP 409'; then
              echo "$publish_out"
              echo "::warning::$capsule_name@$new_version already published; committing bump to resync git with registry."
            else
              echo "$publish_out"
              echo "::error::Failed to publish $capsule_name@$new_version."
              exit 1
            fi

            echo "::endgroup::"
            committed=true
          done

          # Commit all version bumps in one commit
          if [ "$committed" = true ]; then
            git add -- "${changed_manifests[@]}"
            git commit -m "chore(capsules): bump versions [skip capsule-release]

          $(for capsule_dir in "${changed_capsules[@]}"; do
              name="$(grep -oP '^name\s*=\s*\"\K[^\"]+' "$capsule_dir/capsule.toml")"
              ver="$(grep -oP '^version\s*=\s*\"\K[^\"]+' "$capsule_dir/capsule.toml")"
              echo "  - $name@$ver"
            done)"
            # `main` is written concurrently (merged PRs, release.yml). Rebase our
            # bump commit onto the latest origin/main and retry; we only touch
            # selected public manifests, so the replay is conflict-free in practice.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Rebase onto origin/main hit a conflict (attempt ${attempt})."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Pushed capsule version bump on attempt ${attempt}."
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Failed to push capsule version bump after 5 attempts."
                exit 1
              fi
              echo "Push rejected (attempt ${attempt}); main moved — retrying after rebase."
              sleep 5
            done
          fi
