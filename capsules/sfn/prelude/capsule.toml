[capsule]
name = "sfn/prelude"
version = "0.5.9"
description = "Sailfin standard prelude (collections, strings, type checks)"

[capabilities]
required = ["clock", "io", "net"]

[build]
kind = "library"
entry = "../../../runtime/prelude.sfn"
implicit = false

# SFN-931 keeps this shell dormant while making its capability ceiling honest.
# `runtime/capsule.toml prelude-entry` remains the sole provider until the
# SFEP-0072 prelude-adoption slice moves the source into this capsule.
