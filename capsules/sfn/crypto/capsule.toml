[capsule]
name = "sfn/crypto"
version = "0.37.0"
description = "Cryptographic hashing and digest functions for Sailfin"

[dependencies]
# `sfn/strings::int_to_string` renders object-identifier arcs as dotted decimal
# in `src/der.sfn`, and `ascii_lowercase`/`split` fold and label-split names for
# RFC 6125 hostname matching in `src/x509.sfn` (SFN-504).
"sfn/strings" = "*"

[capabilities]
# The complete shipped surface, and deliberately nothing more. `io` reads
# a CA bundle from disk (`src/trust_store.sfn`); `rand` backs
# `random_bytes` over `getentropy` (`src/rand.sfn`).
#
# `clock` is deliberately ABSENT. This capsule reads no ambient time:
# callers supply `now_ms` and the X.509 code does a window comparison
# (SFN-504), which is what keeps the clock surface scoped to `sfn/time`.
# `compiler/tests/e2e/clock_gettime_reader_test.sfn` pins that boundary
# by asserting this manifest never names `clock`, so adding it to satisfy
# the six `![clock]` timing and validity `test` blocks would trade a real
# capability grant, on the most security-sensitive capsule in the tree,
# for a test-only convenience. Under SFEP-0016 that grant becomes a
# syscall mask.
#
# The cost of holding the line: `sfn check` on one of those test files
# reports `E0403`, because it applies this ceiling to `test` blocks while
# `sfn test` does not. That divergence is SFN-1219; the `dev-required`
# key in SFN-1216 is what lets both paths agree without widening the
# shipped surface.
required = ["io", "rand"]

[build]
entry = "src/mod.sfn"
kind = "library"
