[capsule]
name = "sfn/crypto"
version = "0.37.0"
description = "Cryptographic hashing and digest functions for Sailfin"

[dependencies]
# `sfn/strings::int_to_string` renders object-identifier arcs as dotted decimal
# in `src/der.sfn`, and `ascii_lowercase`/`split` fold and label-split names for
# RFC 6125 hostname matching in `src/x509.sfn` (SFN-504).
"sfn/strings" = "*"

[capabilities]
# `io` reads a CA bundle from disk (`src/trust_store.sfn`); `rand` backs
# `random_bytes` over `getentropy` (`src/rand.sfn`). Both are real
# shipped surface.
#
# `clock` is TEST-ONLY. No shipped function in this capsule declares it —
# it is here for six `test` blocks that assert verification timing
# budgets and X.509 validity windows. It has to be listed anyway because
# `_analyze_statement_capabilities` checks `test` blocks against the same
# ceiling as shipped code, so this manifest over-claims `clock` on the
# strength of a timing assertion. Read that as a known wart, not an
# intended grant: it matters because SFEP-0016 derives a syscall mask
# from this list, and this is the most security-sensitive capsule in the
# tree. SFN-1216 adds a `dev-required` key that unions into the ceiling
# only for `TestDeclaration`; when it lands, `clock` moves there and
# this comment goes with it.
required = ["clock", "io", "rand"]

[build]
entry = "src/mod.sfn"
kind = "library"
